<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>人物 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <main class="max-w-[1200px] mx-auto p-6">
            <div
                id="grid"
                class="grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-2"
            ></div>
            <div id="pager" class="mt-6 text-center"></div>
        </main>

        <script src="assets/app.min.js"></script>
        <script>
            var pageSize = 100;
            var allItems = [];
            var showing = 0;

            // ── 卡片渲染：左侧正方形头像 + 右侧两行（原名/中文名）──
            function renderItem(p) {
                return (
                    "<div onclick=\"location.href='/person?id=" +
                    p.id +
                    '\'" class="flex items-center gap-3 bg-surface rounded-lg overflow-hidden cursor-pointer border border-bord hover:border-pink transition-colors h-[72px]">' +
                    '<img src="' +
                    img("person", p.id, "grid") +
                    '" loading=\"lazy\" ' +
                    imgOnError("person", p.id, "grid") +
                    ' class="w-[72px] h-[72px] object-cover bg-surface shrink-0">' +
                    '<div class="flex-1 min-w-0 pr-3 py-1">' +
                    '<div class="text-sm font-semibold truncate">' +
                    primaryName(p.name, p.name_cn) +
                    "</div>" +
                    (function () {
                        var sub = subName(p.name, p.name_cn);
                        return sub
                            ? '<div class="text-xs text-sub truncate mt-0.5">' +
                                  sub +
                                  "</div>"
                            : "";
                    })() +
                    "</div></div>"
                );
            }

            function showMore(n) {
                var grid = document.getElementById("grid");
                var end = Math.min(showing + n, allItems.length);
                var html = "";
                for (var i = showing; i < end; i++) {
                    html += renderItem(allItems[i]);
                }
                grid.innerHTML += html;
                showing = end;
                updatePager();
            }
            function showAll() {
                showMore(allItems.length - showing);
            }
            function updatePager() {
                var pager = document.getElementById("pager");
                if (allItems.length <= pageSize) {
                    pager.innerHTML =
                        '<span class="text-xs text-sub">共 ' +
                        allItems.length +
                        " 人</span>";
                    return;
                }
                var html =
                    '<span class="text-xs text-sub">当前展示 ' +
                    showing +
                    "，共 " +
                    allItems.length +
                    " 人</span>";
                if (showing < allItems.length) {
                    html +=
                        ' <button onclick="showMore(' +
                        pageSize +
                        ')" class="ml-3 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开更多</button>';
                    html +=
                        ' <button onclick="showAll()" class="ml-2 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开全部</button>';
                }
                pager.innerHTML = html;
            }

            (async () => {
                allItems = (await apiLocal("/v0/persons/list")) || [];
                if (!allItems.length) {
                    document.getElementById("grid").innerHTML =
                        '<div class="col-span-full text-center py-20 text-sub">暂无数据</div>';
                    return;
                }
                showing = 0;
                showMore(pageSize);
            })();
        </script>
    </body>
</html>
