<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>人物详情 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div class="sticky top-0 z-50">
            <div id="topbar"></div>
            <div
                id="detail-header"
                class="bg-surface-raised border-b border-bord"
            ></div>
        </div>
        <main id="view" class="max-w-[1200px] mx-auto p-6"></main>

        <script src="assets/app.min.js"></script>
        <script type="module" src="assets/person.js"></script>
        <script>
            (async () => {
                const ID = new URLSearchParams(location.search).get("id");
                if (!ID) {
                    document.getElementById("view").innerHTML =
                        '<p class="text-sub text-center py-20">缺少人物 ID</p>';
                    return;
                }

                const p = await api("/v0/persons/" + ID);
                if (!p) {
                    document.getElementById("view").innerHTML =
                        '<p class="text-sub text-center py-10">未找到该人物（ID: ' +
                        ID +
                        "）</p>";
                    return;
                }
                await loadPersonMap();
                var cn = extractCN(p);

                var hdr = document.getElementById("detail-header");
                hdr.innerHTML = '<div id="person-header"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:person-header", {
                        detail: { person: p, id: ID, cn: cn }
                    })
                );

                var items = infoboxData(p);
                document.getElementById("view").innerHTML =
                    '<div id="person-detail"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:person-detail", {
                        detail: {
                            person: p,
                            cn: cn,
                            infoItems: items
                        }
                    })
                );

                loadCharSection(ID);
                loadSubjectSection(ID);
            })();

            function loadCharSection(ID) {
                api("/v0/persons/" + ID + "/characters")
                    .then(function (data) {
                        var items = Array.isArray(data) ? data : [];
                        var section = document.getElementById("chars-section");
                        if (!section) return;
                        if (!items.length) {
                            section.innerHTML = "";
                            return;
                        }
                        section.innerHTML =
                            '<div id="person-characters"></div>';
                        window.dispatchEvent(
                            new CustomEvent("seshat:person-characters", {
                                detail: {
                                    items: items,
                                    title: "出演角色",
                                    kind: "chars",
                                    id: ID
                                }
                            })
                        );
                    })
                    .catch(function () {
                        var section = document.getElementById("chars-section");
                        if (section) section.innerHTML = "";
                    });
            }

            function loadSubjectSection(ID) {
                api("/v0/persons/" + ID + "/subjects")
                    .then(function (data) {
                        var items = Array.isArray(data) ? data : [];
                        var section =
                            document.getElementById("subjects-section");
                        if (!section) return;
                        if (!items.length) {
                            section.innerHTML = "";
                            return;
                        }
                        section.innerHTML = '<div id="person-subjects"></div>';
                        window.dispatchEvent(
                            new CustomEvent("seshat:person-subjects", {
                                detail: {
                                    items: items,
                                    title: "参与制作",
                                    kind: "subjects",
                                    id: ID
                                }
                            })
                        );
                    })
                    .catch(function () {
                        var section =
                            document.getElementById("subjects-section");
                        if (section) section.innerHTML = "";
                    });
            }
        </script>
    </body>
</html>
