<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>人物详情 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>
        <div
            id="detail-header"
            class="sticky top-12 z-40 bg-surface-raised border-b border-bord"
        ></div>
        <main id="view" class="max-w-[1200px] mx-auto p-6"></main>

        <script src="assets/app.min.js"></script>
        <script>
            (async () => {
                const ID = new URLSearchParams(location.search).get("id");
                window._persId = ID;
                if (!ID) {
                    document.getElementById("view").innerHTML =
                        '<p class="text-sub text-center py-20">缺少人物 ID</p>';
                    return;
                }

                const p = await api("/v0/persons/" + ID);
                if (!p) {
                    document.getElementById("view").innerHTML =
                        '<p class="text-sub text-center py-10">未找到该人物（ID: ' +
                        ID +
                        "）</p>";
                    return;
                }
                await loadPersonMap();
                var cn = extractCN(p);

                document.getElementById("detail-header").innerHTML =
                    '<div class="max-w-[1200px] mx-auto px-6 h-12 py-0 flex items-center gap-3">' +
                    '<a href="javascript:history.back()" class="w-7 h-7 rounded-full border border-bord-strong flex items-center justify-center text-sub hover:text-text hover:border-bord-xstrong shrink-0 no-underline text-xs" title="返回">←</a>' +
                    (isRemote("/v0/persons/" + ID)
                        ? globeIcon("w-6 h-6")
                        : "") +
                    (p.nsfw
                        ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-warn-bg text-warn shrink-0">NSFW</span>'
                        : "") +
                    '<span class="text-2xl font-bold truncate">' +
                    primaryName(p.name, cn) +
                    "</span>" +
                    (function () {
                        var s = subName(p.name, cn);
                        return s
                            ? '<span class="text-sm text-sub truncate hidden sm:inline">' +
                                  s +
                                  "</span>"
                            : "";
                    })() +
                    '<span class="text-xs text-sub ml-auto shrink-0">ID: ' +
                    p.id +
                    "</span></div>";

                var items = infoboxData(p);
                var infoHtml = "";
                for (var i = 0; i < items.length; i++) {
                    infoHtml +=
                        '<div class="py-1 border-b border-bord-light text-[14px]' +
                        (items[i][2] ? " ml-4" : "") +
                        '"><span class="text-sub">' +
                        (items[i][0] ? items[i][0] + ": " : "") +
                        "</span><span>" +
                        items[i][1] +
                        "</span></div>";
                }

                var career =
                    typeof p.career === "string"
                        ? JSON.parse(p.career)
                        : p.career || [];
                var careerHtml = career.length
                    ? '<div class="flex flex-wrap gap-1.5">' +
                      career
                          .map(function (c) {
                              return (
                                  '<span class="bg-pink-bg text-pink px-2 py-0.5 rounded-md text-[12px]">' +
                                  (MSG.careerMap[c] || c) +
                                  "</span>"
                              );
                          })
                          .join("") +
                      "</div>"
                    : "";

                document.getElementById("view").innerHTML =
                    '<div class="flex flex-col md:flex-row gap-6">' +
                    '<div class="w-full md:w-[260px] shrink-0">' +
                    '<img src="' +
                    img("person", p.id, "large") +
                    '" ' +
                    imgOnError("person", p.id, "large") +
                    ' class="w-full rounded-xl cursor-pointer" onclick="showLightbox(this.src)">' +
                    (infoHtml
                        ? '<div class="mt-3 flex flex-col gap-0.5">' +
                          infoHtml +
                          "</div>"
                        : "") +
                    "</div>" +
                    '<div class="flex-1 min-w-0 flex flex-col gap-5">' +
                    // Career + summary left, collects right
                    ((careerHtml || p.summary) && p.stat && p.stat.collects
                        ? '<div class="flex flex-col md:flex-row gap-4"><div class="flex-1 min-w-0">' +
                          (careerHtml
                              ? '<div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">职业</span></div>' +
                                careerHtml
                              : "") +
                          (p.summary
                              ? '<div class="' +
                                (careerHtml ? "mt-4" : "") +
                                '"><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">简介</span></div><p class="text-[14px] leading-relaxed text-sub">' +
                                formatSummary(p.summary) +
                                "</p></div>"
                              : "") +
                          '</div><div class="w-full md:w-[230px] shrink-0 self-start bg-surface-alt border border-bord rounded-xl overflow-hidden"><div class="bg-surface-alt px-4 py-2"><span class="font-bold text-sm">收藏</span></div><div class="border-t border-bord-mid"></div><div class="px-4 pt-3 pb-3"><div class="flex items-baseline justify-center"><span class="text-2xl font-bold">' +
                          p.stat.collects +
                          '</span><span class="text-xs text-sub ml-1">人</span></div></div></div></div>'
                        : careerHtml || p.summary
                          ? "<div>" +
                            (careerHtml
                                ? '<div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">职业</span></div>' +
                                  careerHtml
                                : "") +
                            (p.summary
                                ? '<div class="' +
                                  (careerHtml ? "mt-4" : "") +
                                  '"><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">简介</span></div><p class="text-[14px] leading-relaxed text-sub">' +
                                  formatSummary(p.summary) +
                                  "</p></div>"
                                : "") +
                            "</div>"
                          : "") +
                    // Placeholders for async sections
                    '<div id="chars-section"><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">出演角色</span><span class="text-xs text-sub">加载中…</span></div></div>' +
                    '<div id="subjects-section"><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">参与制作</span><span class="text-xs text-sub">加载中…</span></div></div>' +
                    "</div></div>";

                loadCharSection(ID);
                loadSubjectSection(ID);
            })();

            // ── 出演角色 ──
            var _charsAll = [],
                _charsShowing = 0;
            function loadCharSection(ID) {
                api("/v0/persons/" + ID + "/characters")
                    .then(function (data) {
                        _charsAll = Array.isArray(data) ? data : [];
                        _charsAll.sort(function (a, b) {
                            var o = { 2: 0, 4: 1, 1: 2, 3: 3, 6: 4 };
                            return (
                                (o[a.subject_type] != null
                                    ? o[a.subject_type]
                                    : 5) -
                                (o[b.subject_type] != null
                                    ? o[b.subject_type]
                                    : 5)
                            );
                        });
                        _charsShowing = 0;
                        renderCharSection();
                    })
                    .catch(function () {
                        document.getElementById("chars-section").innerHTML = "";
                    });
            }
            function renderCharSection() {
                var section = document.getElementById("chars-section");
                if (!_charsAll.length) {
                    section.innerHTML = "";
                    return;
                }
                var end = Math.min(_charsShowing + 10, _charsAll.length);
                var items = _charsAll.slice(0, end);
                var typeCls = {
                    1: "bg-tier-gold-bg text-tier-gold",
                    2: "bg-tier-blue-bg text-tier-blue",
                    3: "bg-tier-purple-bg text-tier-purple",
                    4: "bg-tier-green-bg text-tier-green",
                    6: "bg-surface-alt text-sub"
                };
                var cards = [];
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var typeLabel = MSG.subjectTypes[item.subject_type] || "";
                    cards.push(
                        '<div class="border-t border-bord-light overflow-hidden" style="height:80px">' +
                            '<div class="flex items-center gap-3 h-full">' +
                            '<div class="relative shrink-0 rounded overflow-hidden bg-surface cursor-pointer" style="width:64px;aspect-ratio:1" onclick="location.href=\'/subject?id=' +
                            item.subject_id +
                            "'\">" +
                            '<img src="' +
                            img("subject", item.subject_id, "grid") +
                            '" ' +
                            imgOnError("subject", item.subject_id, "grid") +
                            ' class="w-full h-full object-cover">' +
                            (typeLabel
                                ? '<span class="absolute top-0.5 right-0.5 text-[9px] font-semibold ' +
                                  typeCls[item.subject_type] +
                                  ' px-1 py-px rounded">' +
                                  typeLabel +
                                  "</span>"
                                : "") +
                            "</div>" +
                            '<div class="flex-1 min-w-0">' +
                            '<div class="font-semibold text-[14px] cursor-pointer hover:text-pink truncate" onclick="location.href=\'/subject?id=' +
                            item.subject_id +
                            "'\">" +
                            primaryName(
                                item.subject_name,
                                item.subject_name_cn || ""
                            ) +
                            "</div>" +
                            (function () {
                                var sub = subName(
                                    item.subject_name,
                                    item.subject_name_cn || ""
                                );
                                return sub
                                    ? '<div class="text-xs text-sub truncate mt-0.5">' +
                                          sub +
                                          "</div>"
                                    : "";
                            })() +
                            '<div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-1"><span class="bg-pink text-white px-1.5 py-px rounded text-[11px] font-semibold">' +
                            (item.staff || "") +
                            "</span></div>" +
                            "</div>" +
                            '<div class="flex items-start gap-2 shrink-0 cursor-pointer self-start mt-2" onclick="event.stopPropagation();location.href=\'/character?id=' +
                            item.id +
                            "'\">" +
                            '<span class="text-[14px] font-semibold hover:text-pink">' +
                            item.name +
                            "</span>" +
                            '<img src="' +
                            img("character", item.id, "grid") +
                            '" ' +
                            imgOnError("character", item.id, "grid") +
                            ' class="w-10 h-10 rounded-lg object-cover bg-surface">' +
                            "</div>" +
                            "</div></div>"
                    );
                }
                var html = "";
                for (var i = 0; i < cards.length; i += 2) {
                    html +=
                        '<div class="flex gap-4"><div class="flex-1 min-w-0">' +
                        cards[i] +
                        '</div><div class="flex-1 min-w-0">' +
                        (cards[i + 1] || "") +
                        "</div></div>";
                }
                var remoteIcon = isRemote(
                    "/v0/persons/" + window._persId + "/characters"
                )
                    ? globeIcon("w-4 h-4")
                    : "";
                var titleHtml =
                    '<div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">出演角色</span>' +
                    remoteIcon +
                    "</div>";
                var pagerHtml = "";
                _charsShowing = end;
                if (_charsAll.length > 10) {
                    pagerHtml =
                        '<div class="mt-3 text-center"><span class="text-xs text-sub">共 ' +
                        _charsAll.length +
                        " 个条目</span>";
                    if (_charsShowing < _charsAll.length) {
                        var remaining = _charsAll.length - _charsShowing;
                        pagerHtml +=
                            ' <button onclick="showMoreChars()" class="ml-3 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开更多</button>';
                        if (remaining > 10)
                            pagerHtml +=
                                ' <button onclick="showAllChars()" class="ml-2 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开全部</button>';
                    }
                    pagerHtml += "</div>";
                }
                section.innerHTML = titleHtml + html + pagerHtml;
            }
            function showMoreChars() {
                renderCharSection();
            }
            function showAllChars() {
                _charsShowing = _charsAll.length;
                renderCharSection();
            }

            // ── 参与制作 ──
            var _subjAll = [],
                _subjShowing = 0;
            function loadSubjectSection(ID) {
                api("/v0/persons/" + ID + "/subjects")
                    .then(function (data) {
                        _subjAll = Array.isArray(data) ? data : [];
                        _subjAll.sort(function (a, b) {
                            var o = { 2: 0, 4: 1, 1: 2, 3: 3, 6: 4 };
                            return (
                                (o[a.type] != null ? o[a.type] : 5) -
                                (o[b.type] != null ? o[b.type] : 5)
                            );
                        });
                        _subjShowing = 0;
                        renderSubjectSection();
                    })
                    .catch(function () {
                        document.getElementById("subjects-section").innerHTML =
                            "";
                    });
            }
            function renderSubjectSection() {
                var section = document.getElementById("subjects-section");
                if (!_subjAll.length) {
                    section.innerHTML = "";
                    return;
                }
                var end = Math.min(_subjShowing + 10, _subjAll.length);
                var items = _subjAll.slice(0, end);
                var typeCls = {
                    1: "bg-tier-gold-bg text-tier-gold",
                    2: "bg-tier-blue-bg text-tier-blue",
                    3: "bg-tier-purple-bg text-tier-purple",
                    4: "bg-tier-green-bg text-tier-green",
                    6: "bg-surface-alt text-sub"
                };
                var cards = [];
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var typeLabel = MSG.subjectTypes[item.type] || "";
                    cards.push(
                        '<div class="border-t border-bord-light overflow-hidden" style="height:80px">' +
                            '<div class="flex items-center gap-3 h-full">' +
                            '<div class="relative shrink-0 rounded overflow-hidden bg-surface cursor-pointer" style="width:64px;aspect-ratio:1" onclick="location.href=\'/subject?id=' +
                            item.id +
                            "'\">" +
                            '<img src="' +
                            img("subject", item.id, "grid") +
                            '" ' +
                            imgOnError("subject", item.id, "grid") +
                            ' class="w-full h-full object-cover">' +
                            (typeLabel
                                ? '<span class="absolute top-0.5 right-0.5 text-[9px] font-semibold ' +
                                  typeCls[item.type] +
                                  ' px-1 py-px rounded">' +
                                  typeLabel +
                                  "</span>"
                                : "") +
                            "</div>" +
                            '<div class="flex-1 min-w-0">' +
                            '<div class="font-semibold text-[14px] cursor-pointer hover:text-pink truncate" onclick="location.href=\'/subject?id=' +
                            item.id +
                            "'\">" +
                            primaryName(item.name, item.name_cn || "") +
                            "</div>" +
                            (function () {
                                var sub = subName(
                                    item.name,
                                    item.name_cn || ""
                                );
                                return sub
                                    ? '<div class="text-xs text-sub truncate mt-0.5">' +
                                          sub +
                                          "</div>"
                                    : "";
                            })() +
                            '<div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-1"><span class="bg-pink text-white px-1.5 py-px rounded text-[11px] font-semibold">' +
                            (item.staff || "") +
                            "</span></div>" +
                            "</div>" +
                            "</div></div>"
                    );
                }
                var html = "";
                for (var i = 0; i < cards.length; i += 2) {
                    html +=
                        '<div class="flex gap-4"><div class="flex-1 min-w-0">' +
                        cards[i] +
                        '</div><div class="flex-1 min-w-0">' +
                        (cards[i + 1] || "") +
                        "</div></div>";
                }
                var remoteIcon = isRemote(
                    "/v0/persons/" + window._persId + "/subjects"
                )
                    ? globeIcon("w-4 h-4")
                    : "";
                var titleHtml =
                    '<div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">参与制作</span>' +
                    remoteIcon +
                    "</div>";
                var pagerHtml = "";
                _subjShowing = end;
                if (_subjAll.length > 10) {
                    pagerHtml =
                        '<div class="mt-3 text-center"><span class="text-xs text-sub">共 ' +
                        _subjAll.length +
                        " 个条目</span>";
                    if (_subjShowing < _subjAll.length) {
                        var remaining = _subjAll.length - _subjShowing;
                        pagerHtml +=
                            ' <button onclick="showMoreSubjs()" class="ml-3 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开更多</button>';
                        if (remaining > 10)
                            pagerHtml +=
                                ' <button onclick="showAllSubjs()" class="ml-2 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开全部</button>';
                    }
                    pagerHtml += "</div>";
                }
                section.innerHTML = titleHtml + html + pagerHtml;
            }
            function showMoreSubjs() {
                renderSubjectSection();
            }
            function showAllSubjs() {
                _subjShowing = _subjAll.length;
                renderSubjectSection();
            }
        </script>
    </body>
</html>
