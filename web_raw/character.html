<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>角色详情 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div class="sticky top-0 z-50">
            <div id="topbar"></div>
            <div
                id="detail-header"
                class="bg-surface-raised border-b border-bord"
            ></div>
        </div>
        <main id="view" class="max-w-[1200px] mx-auto p-6"></main>

        <script src="assets/app.min.js"></script>
        <script type="module" src="assets/character.js"></script>
        <script>
            (async () => {
                const ID = new URLSearchParams(location.search).get("id");
                window._charId = ID;
                if (!ID) {
                    document.getElementById("view").innerHTML =
                        '<p class="text-sub text-center py-20">缺少角色 ID</p>';
                    return;
                }

                const c = await api("/v0/characters/" + ID);
                if (!c) {
                    document.getElementById("view").innerHTML =
                        '<p class="text-sub text-center py-10">未找到该角色（ID: ' +
                        ID +
                        "）</p>";
                    return;
                }
                await loadPersonMap();
                var cn = extractCN(c);

                var hdr = document.getElementById("detail-header");
                hdr.innerHTML = '<div id="character-header"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:character-header", {
                        detail: { character: c, id: ID, cn: cn }
                    })
                );

                var items = infoboxData(c);
                document.getElementById("view").innerHTML =
                    '<div id="character-detail"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:character-detail", {
                        detail: {
                            character: c,
                            cn: cn,
                            infoItems: items
                        }
                    })
                );

                loadAppearances(ID);
            })();

            function loadAppearances(ID) {
                Promise.all([
                    api("/v0/characters/" + ID + "/subjects"),
                    api("/v0/characters/" + ID + "/persons")
                ])
                    .then(function (results) {
                        var subjects = Array.isArray(results[0])
                            ? results[0]
                            : [];
                        var persons = Array.isArray(results[1])
                            ? results[1]
                            : [];
                        var map = {};
                        for (var i = 0; i < subjects.length; i++) {
                            var s = subjects[i];
                            map[s.id] = {
                                id: s.id,
                                name: s.name || "",
                                name_cn: s.name_cn || "",
                                staff: s.staff || "",
                                type: s.type || 0,
                                person_id: 0,
                                person_name: ""
                            };
                        }
                        for (var i = 0; i < persons.length; i++) {
                            var p = persons[i];
                            map[p.subject_id] = {
                                id: p.subject_id,
                                name: p.subject_name || "",
                                name_cn: p.subject_name_cn || "",
                                staff: p.staff || "",
                                type: p.subject_type || 0,
                                person_id: p.id || 0,
                                person_name: p.name || ""
                            };
                        }
                        var appearAll = [];
                        for (var k in map) appearAll.push(map[k]);
                        appearAll.sort(function (a, b) {
                            var o = { 2: 0, 4: 1, 1: 2, 3: 3, 6: 4 };
                            return (
                                (o[a.type] != null ? o[a.type] : 5) -
                                (o[b.type] != null ? o[b.type] : 5)
                            );
                        });
                        var section = document.getElementById(
                            "appearances-section"
                        );
                        if (!section) return;
                        if (!appearAll.length) {
                            section.innerHTML = "";
                            return;
                        }
                        section.innerHTML =
                            '<div id="character-appearances"></div>';
                        window.dispatchEvent(
                            new CustomEvent("seshat:character-appearances", {
                                detail: {
                                    items: appearAll,
                                    id: ID
                                }
                            })
                        );
                    })
                    .catch(function () {
                        var section = document.getElementById(
                            "appearances-section"
                        );
                        if (section) section.innerHTML = "";
                    });
            }
        </script>
    </body>
</html>
