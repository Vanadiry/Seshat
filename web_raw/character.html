<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>角色详情 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div class="sticky top-0 z-50">
            <div id="topbar"></div>
            <div
                id="detail-header"
                class="bg-surface-raised border-b border-bord"
            ></div>
        </div>
        <main id="view" class="max-w-[1200px] mx-auto p-6"></main>

        <script src="assets/app.min.js"></script>
        <script type="module" src="assets/character.js"></script>
        <script>
            (async () => {
                const ID = new URLSearchParams(location.search).get("id");
                window._charId = ID;
                if (!ID) {
                    document.getElementById("view").innerHTML =
                        '<p class="text-sub text-center py-20">缺少角色 ID</p>';
                    return;
                }

                const c = await api("/v0/characters/" + ID);
                if (!c) {
                    document.getElementById("view").innerHTML =
                        '<p class="text-sub text-center py-10">未找到该角色（ID: ' +
                        ID +
                        "）</p>";
                    return;
                }
                await loadPersonMap();
                var cn = extractCN(c);

                var hdr = document.getElementById("detail-header");
                hdr.innerHTML = '<div id="character-header"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:character-header", {
                        detail: { character: c, id: ID, cn: cn }
                    })
                );

                var items = infoboxData(c);
                document.getElementById("view").innerHTML =
                    '<div id="character-detail"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:character-detail", {
                        detail: {
                            character: c,
                            cn: cn,
                            infoItems: items
                        }
                    })
                );

                loadAppearances(ID);
            })();

            var _appearAll = [],
                _appearShowing = 0;
            function loadAppearances(ID) {
                Promise.all([
                    api("/v0/characters/" + ID + "/subjects"),
                    api("/v0/characters/" + ID + "/persons")
                ])
                    .then(function (results) {
                        console.log("Appearances API results:", results);
                        var subjects = Array.isArray(results[0])
                            ? results[0]
                            : [];
                        var persons = Array.isArray(results[1])
                            ? results[1]
                            : [];
                        // 合并条目，persons 的 subject_id 匹配 subjects 的 id，persons 优先
                        var map = {};
                        for (var i = 0; i < subjects.length; i++) {
                            var s = subjects[i];
                            map[s.id] = {
                                id: s.id,
                                name: escapeHtml(s.name) || "",
                                name_cn: escapeHtml(s.name_cn) || "",
                                staff: s.staff || "",
                                type: s.type || 0,
                                person_id: 0,
                                person_name: ""
                            };
                        }
                        for (var i = 0; i < persons.length; i++) {
                            var p = persons[i];
                            map[p.subject_id] = {
                                id: p.subject_id,
                                name: p.subject_name || "",
                                name_cn: p.subject_name_cn || "",
                                staff: p.staff || "",
                                type: p.subject_type || 0,
                                person_id: p.id || 0,
                                person_name: escapeHtml(p.name) || ""
                            };
                        }
                        _appearAll = [];
                        for (var k in map) {
                            _appearAll.push(map[k]);
                        }
                        _appearAll.sort(function (a, b) {
                            var o = { 2: 0, 4: 1, 1: 2, 3: 3, 6: 4 };
                            return (
                                (o[a.type] != null ? o[a.type] : 5) -
                                (o[b.type] != null ? o[b.type] : 5)
                            );
                        });
                        _appearShowing = 0;
                        renderAppearances();
                    })
                    .catch(function (err) {
                        console.error("loadAppearances failed:", err);
                        document.getElementById(
                            "appearances-section"
                        ).innerHTML = "";
                    });
            }

            function renderAppearances() {
                var section = document.getElementById("appearances-section");
                if (!_appearAll.length) {
                    section.innerHTML = "";
                    return;
                }
                var end = Math.min(_appearShowing + 10, _appearAll.length);
                var items = _appearAll.slice(0, end);
                var typeCls = {
                    1: "bg-tier-gold-bg text-tier-gold",
                    2: "bg-tier-blue-bg text-tier-blue",
                    3: "bg-tier-purple-bg text-tier-purple",
                    4: "bg-tier-green-bg text-tier-green",
                    6: "bg-surface-alt text-sub"
                };
                var cards = [];
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var typeLabel = MSG.subjectTypes[item.type] || "";
                    cards.push(
                        '<div tabindex="0" role="link" data-href="/subject?id=' +
                            item.id +
                            '" onkeydown="cardKeyNav(event)" onclick="location.href=\'/subject?id=' +
                            item.id +
                            '\'" class="border-t border-bord-light overflow-hidden cursor-pointer" style="height:80px">' +
                            '<div class="flex items-center gap-3 h-full">' +
                            // 条目图片和类型徽章
                            '<div class="relative shrink-0 rounded overflow-hidden bg-surface cursor-pointer" style="width:64px;aspect-ratio:1" onclick="location.href=\'/subject?id=' +
                            item.id +
                            "'\">" +
                            '<img alt="" src="' +
                            img("subject", item.id, "grid") +
                            '" ' +
                            imgOnError("subject", item.id, "grid") +
                            ' class="w-full h-full object-cover">' +
                            (typeLabel
                                ? '<span class="absolute top-0.5 right-0.5 text-[9px] font-semibold ' +
                                  typeCls[item.type] +
                                  ' px-1 py-px rounded">' +
                                  typeLabel +
                                  "</span>"
                                : "") +
                            "</div>" +
                            // 文本区
                            '<div class="flex-1 min-w-0">' +
                            '<div class="font-semibold text-[14px] cursor-pointer hover:text-pink truncate" onclick="location.href=\'/subject?id=' +
                            item.id +
                            "'\">" +
                            primaryName(
                                escapeHtml(item.name),
                                escapeHtml(item.name_cn)
                            ) +
                            "</div>" +
                            (function () {
                                var sub = subName(
                                    escapeHtml(item.name),
                                    escapeHtml(item.name_cn)
                                );
                                return sub
                                    ? '<div class="text-xs text-sub truncate mt-0.5">' +
                                          sub +
                                          "</div>"
                                    : "";
                            })() +
                            '<div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-1"><span class="bg-pink-solid text-white px-1.5 py-px rounded text-[11px] font-semibold">' +
                            (item.staff || "") +
                            "</span></div>" +
                            "</div>" +
                            // 人物区
                            (item.person_id
                                ? '<div tabindex="0" role="link" data-href="/person?id=' +
                                  item.person_id +
                                  '" onkeydown="cardKeyNav(event)" class="flex items-start gap-2 shrink-0 cursor-pointer self-start mt-2" onclick="event.stopPropagation();location.href=\'/person?id=' +
                                  item.person_id +
                                  "'\">" +
                                  '<span class="text-[14px] font-semibold hover:text-pink">' +
                                  item.person_name +
                                  "</span>" +
                                  '<img alt="" src="' +
                                  img("person", item.person_id, "grid") +
                                  '" ' +
                                  imgOnError("person", item.person_id, "grid") +
                                  ' class="w-10 h-10 rounded-lg object-cover bg-surface">' +
                                  "</div>"
                                : "") +
                            "</div></div>"
                    );
                }
                // 两列配对
                var html = "";
                for (var i = 0; i < cards.length; i += 2) {
                    html +=
                        '<div class="flex gap-4">' +
                        '<div class="flex-1 min-w-0">' +
                        cards[i] +
                        "</div>" +
                        '<div class="flex-1 min-w-0">' +
                        (cards[i + 1] || "") +
                        "</div>" +
                        "</div>";
                }
                // 标题行和地球标记
                var remoteIcon =
                    isRemote(
                        "/v0/characters/" + window._charId + "/subjects"
                    ) ||
                    isRemote("/v0/characters/" + window._charId + "/persons")
                        ? globeIcon("w-4 h-4")
                        : "";
                var titleHtml = sectionTitle("出演", { extra: remoteIcon });
                // 分页
                var pagerHtml = "";
                _appearShowing = end;
                if (_appearAll.length > 10) {
                    pagerHtml =
                        '<div class="mt-3 text-center"><span class="text-xs text-sub">共 ' +
                        _appearAll.length +
                        " 个条目</span>";
                    if (_appearShowing < _appearAll.length) {
                        var remaining = _appearAll.length - _appearShowing;
                        pagerHtml +=
                            ' <button onclick="showMoreAppearances()" class="ml-3 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开更多</button>';
                        if (remaining > 10)
                            pagerHtml +=
                                ' <button onclick="showAllAppearances()" class="ml-2 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开全部</button>';
                    }
                    pagerHtml += "</div>";
                }
                section.innerHTML = titleHtml + html + pagerHtml;
            }

            function showMoreAppearances() {
                renderAppearances();
            }
            function showAllAppearances() {
                _appearShowing = _appearAll.length;
                renderAppearances();
            }
        </script>
    </body>
</html>
