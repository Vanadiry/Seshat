<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>管理 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .radio-pink {
                appearance: none;
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                border: 2px solid var(--c-sub);
                border-radius: 9999px;
                background: transparent;
                cursor: pointer;
                position: relative;
                flex: none;
            }
            .radio-pink:checked {
                border-color: var(--c-pink);
            }
            .radio-pink:checked::after {
                content: "";
                position: absolute;
                inset: 3px;
                border-radius: 9999px;
                background: var(--c-pink);
            }
            .radio-pink:focus-visible {
                outline: 2px solid var(--c-pink);
                outline-offset: 2px;
            }
            .danger-lock {
                position: relative;
                overflow: hidden;
            }
            .lock-fill {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                width: 0;
                background: rgba(220, 38, 38, 0.18);
                transition: width 0.05s linear;
                pointer-events: none;
            }
            .lock-label {
                position: relative;
                transition: color 0.5s ease;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <main class="relative max-w-[1000px] mx-auto p-6">
            <div id="manage-content" class="flex flex-col sm:flex-row gap-8">
                <div class="flex-1 min-w-0">
                    <section class="mb-8 sm:mb-0">
                        <div class="flex items-center gap-2 mb-3">
                            <span
                                class="w-[3px] h-[18px] bg-pink rounded-sm"
                            ></span>
                            <h2 class="font-bold text-sm">拉取</h2>
                        </div>

                        <div class="text-xs text-sub mb-2">来源</div>
                        <div class="flex flex-col gap-2 mb-3">
                            <label
                                data-feature="tracker"
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="tracker_new"
                                    class="radio-pink"
                                />
                                所有 Tracker 中的新增 ID
                            </label>
                            <label
                                data-feature="tracker"
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="tracker_all"
                                    class="radio-pink"
                                />
                                所有 Tracker
                            </label>
                            <label
                                data-feature="tracker"
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="tracker_names"
                                    class="radio-pink"
                                />
                                指定 Tracker
                            </label>
                            <div
                                id="row-fetch-names"
                                data-feature="tracker"
                                style="display: none"
                                class="ml-6 flex flex-col gap-2"
                            >
                                <div
                                    id="fetch-tracker-status"
                                    class="text-xs text-sub"
                                ></div>
                                <div
                                    id="fetch-tracker-items"
                                    class="flex flex-col gap-2 max-h-80 overflow-y-auto"
                                ></div>
                                <div class="flex items-stretch gap-2">
                                    <input
                                        id="fetch-names"
                                        placeholder="也可以填写 Tracker id，逗号分隔"
                                        class="flex-1 px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                                    />
                                    <button
                                        id="btn-add-trackers"
                                        type="button"
                                        title="添加 Tracker"
                                        aria-label="添加 Tracker"
                                        class="w-9 shrink-0 rounded-lg border border-bord bg-transparent text-sub text-lg leading-none cursor-pointer hover:bg-active hover:text-text flex items-center justify-center"
                                    >
                                        +
                                    </button>
                                </div>
                            </div>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="ids"
                                    checked
                                    class="radio-pink"
                                />
                                指定 ID
                            </label>
                            <div
                                id="row-fetch-ids"
                                style="display: none"
                                class="ml-6"
                            >
                                <input
                                    id="fetch-ids"
                                    placeholder="动画 ID，如 51 或 51, 288"
                                    class="w-full px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                                />
                            </div>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="local"
                                    class="radio-pink"
                                />
                                本地存在的条目
                            </label>
                        </div>

                        <div class="text-xs text-sub mb-2">JSON</div>
                        <div class="flex flex-col gap-2 mb-3">
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-json"
                                    value="fill"
                                    checked
                                    class="radio-pink"
                                />
                                补充缺失
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-json"
                                    value="overwrite"
                                    class="radio-pink"
                                />
                                全量下载并覆盖
                            </label>
                        </div>

                        <div class="text-xs text-sub mb-2">图片</div>
                        <div class="flex flex-col gap-2 mb-3">
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-images"
                                    value="none"
                                    class="radio-pink"
                                />
                                跳过
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-images"
                                    value="fill"
                                    checked
                                    class="radio-pink"
                                />
                                补充缺失
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-images"
                                    value="overwrite"
                                    class="radio-pink"
                                />
                                全量下载并覆盖
                            </label>
                        </div>

                        <button
                            id="btn-page-fetch"
                            class="w-full px-4 py-2 rounded-lg bg-pink text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90"
                        >
                            开始拉取
                        </button>
                    </section>
                </div>

                <div class="hidden sm:block w-px bg-bord-light shrink-0"></div>

                <div class="flex-1 min-w-0">
                    <section class="mb-8">
                        <div class="flex items-center gap-2 mb-3">
                            <span
                                class="w-[3px] h-[18px] bg-pink rounded-sm"
                            ></span>
                            <h2 class="font-bold text-sm">用户数据</h2>
                        </div>
                        <p class="text-xs text-sub mb-3">
                            重新拉取当前用户的信息、头像和收藏，或把收藏导入为
                            Tracker。
                        </p>
                        <div class="flex flex-col gap-2">
                            <button
                                id="btn-page-user"
                                class="w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text"
                            >
                                刷新用户数据
                            </button>
                            <button
                                id="btn-page-import"
                                data-feature="tracker"
                                class="w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text"
                            >
                                导入收藏为 Tracker
                            </button>
                        </div>
                    </section>

                    <section class="mb-8">
                        <div class="flex items-center gap-2 mb-3">
                            <span
                                class="w-[3px] h-[18px] bg-[#dc2626] rounded-sm"
                            ></span>
                            <h2 class="font-bold text-sm text-[#dc2626]">
                                危险区
                            </h2>
                        </div>
                        <p class="text-xs text-sub mb-3">
                            这些操作会影响大量数据，请先确认。
                        </p>
                        <div class="flex flex-col gap-2">
                            <button
                                id="btn-page-index"
                                data-lock-kind="index"
                                class="danger-lock w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text select-none"
                            >
                                <span class="lock-fill"></span>
                                <span class="lock-label">重建索引</span>
                            </button>
                            <button
                                id="btn-page-elo"
                                data-feature="elo"
                                data-lock-kind="elo"
                                class="danger-lock w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text select-none"
                            >
                                <span class="lock-fill"></span>
                                <span class="lock-label">重建 ELO</span>
                            </button>
                            <button
                                id="btn-page-deep"
                                data-lock-kind="deep"
                                class="danger-lock w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text select-none"
                            >
                                <span class="lock-fill"></span>
                                <span class="lock-label">重建全部</span>
                            </button>
                        </div>
                    </section>
                </div>
            </div>

            <div
                id="task-overlay"
                class="fixed inset-x-0 bottom-0 z-20 flex items-center justify-center bg-bg/40 backdrop-blur-xl p-6"
                style="display: none"
            >
                <div
                    class="w-full max-w-[420px] flex flex-col items-center text-center"
                >
                    <p
                        id="task-overlay-label"
                        class="text-lg font-bold mb-1"
                    ></p>
                    <div
                        id="task-overlay-phase"
                        class="text-xs text-sub mb-3"
                    ></div>
                    <div
                        class="w-full h-2 rounded-full bg-[rgba(128,128,128,.2)] overflow-hidden mb-2"
                    >
                        <div
                            id="task-overlay-fill"
                            class="h-full rounded-full"
                            style="
                                width: 0;
                                background: var(--c-toast-progress);
                                transition: width 0.2s linear;
                            "
                        ></div>
                    </div>
                    <div
                        id="task-overlay-detail"
                        class="text-xs text-sub mb-5"
                    ></div>
                    <button
                        id="btn-task-abort"
                        type="button"
                        class="px-5 py-2 rounded-lg border border-[#dc2626] bg-transparent text-[#dc2626] text-sm cursor-pointer hover:bg-pink-bg"
                    >
                        中止任务
                    </button>
                </div>
            </div>
        </main>

        <div
            id="confirm-overlay"
            class="fixed inset-0 bg-black/70 flex items-center justify-center z-[400] transition-opacity duration-200"
            style="display: none; opacity: 0"
        >
            <div
                class="bg-surface-alt border border-bord rounded-lg p-5 w-[340px] max-w-[85vw]"
            >
                <p
                    id="confirm-msg"
                    class="text-sm mb-4 leading-relaxed whitespace-pre-line"
                ></p>
                <button
                    id="btn-confirm-exec"
                    class="w-full px-4 py-2 rounded-lg bg-pink text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90 mb-2"
                >
                    执行
                </button>
                <button
                    id="btn-confirm-cancel"
                    class="w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active"
                >
                    取消
                </button>
            </div>
        </div>

        <script src="assets/app.min.js"></script>
        <script>
            function radioValue(name) {
                var el = document.querySelector(
                    'input[name="' + name + '"]:checked'
                );
                return el ? el.value : "";
            }

            function splitList(value) {
                return value
                    .split(",")
                    .map(function (s) {
                        return s.trim();
                    })
                    .filter(Boolean);
            }

            function splitIDs(value) {
                return splitList(value)
                    .map(function (s) {
                        return parseInt(s, 10);
                    })
                    .filter(function (n) {
                        return n > 0;
                    });
            }

            var _trackers = [];
            var _trackerIndex = {};
            var _selectedTrackerIDs = {};
            var _trackersLoaded = false;
            var _trackerLoading = false;

            function trackerLabel(t) {
                return t.name || t.id;
            }

            function setTrackerStatus(text, retry) {
                var el = document.getElementById("fetch-tracker-status");
                el.textContent = text;
                if (!retry) return;
                var btn = document.createElement("button");
                btn.type = "button";
                btn.className =
                    "ml-2 text-pink bg-transparent border-0 p-0 text-xs cursor-pointer";
                btn.textContent = "重试";
                btn.onclick = function () {
                    loadTrackerList(true);
                };
                el.appendChild(btn);
            }

            function updateTrackerSelectionStatus() {
                if (!_trackers.length) {
                    setTrackerStatus(
                        "暂无 Tracker，可以直接填写 id 或用加号创建",
                        false
                    );
                    return;
                }
                var available = _trackers.some(function (t) {
                    return t.count > 0;
                });
                if (!available) {
                    setTrackerStatus(
                        "暂无可用 Tracker，可以直接填写 id 或用加号创建",
                        false
                    );
                    return;
                }
                setTrackerStatus(
                    "已选择 " + Object.keys(_selectedTrackerIDs).length + " 个",
                    false
                );
            }

            function renderTrackerList() {
                var box = document.getElementById("fetch-tracker-items");
                box.textContent = "";
                for (var id in _selectedTrackerIDs) {
                    var selected = _trackerIndex[id];
                    if (!selected || selected.count <= 0) {
                        delete _selectedTrackerIDs[id];
                    }
                }
                var list = _trackers.slice().sort(function (a, b) {
                    if (a.type !== b.type) return a.type === "manual" ? -1 : 1;
                    var an = trackerLabel(a);
                    var bn = trackerLabel(b);
                    if (an !== bn) return an.localeCompare(bn, "zh-Hans-CN");
                    return a.id.localeCompare(b.id);
                });
                for (var i = 0; i < list.length; i++) {
                    (function (t) {
                        var enabled = t.count > 0;
                        var label = document.createElement("label");
                        label.className =
                            "w-full flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm min-w-0 " +
                            (enabled
                                ? "cursor-pointer hover:bg-active hover:text-text"
                                : "opacity-50");
                        var cb = document.createElement("input");
                        cb.type = "checkbox";
                        cb.className = "w-4 h-4 accent-pink shrink-0";
                        cb.value = t.id;
                        cb.checked = !!_selectedTrackerIDs[t.id];
                        cb.disabled = !enabled;
                        cb.addEventListener("change", function () {
                            if (cb.checked) {
                                _selectedTrackerIDs[t.id] = true;
                            } else {
                                delete _selectedTrackerIDs[t.id];
                            }
                            updateTrackerSelectionStatus();
                        });
                        label.appendChild(cb);

                        var meta = document.createElement("span");
                        meta.className =
                            "flex items-center gap-2 flex-1 min-w-0";

                        var name = document.createElement("span");
                        name.className = "truncate min-w-0";
                        name.textContent = trackerLabel(t);
                        meta.appendChild(name);

                        if (t.name && t.name !== t.id) {
                            var idEl = document.createElement("span");
                            idEl.className =
                                "text-xs text-sub font-mono shrink-0";
                            idEl.textContent = t.id;
                            meta.appendChild(idEl);
                        }
                        label.appendChild(meta);

                        var count = document.createElement("span");
                        count.className = "ml-auto text-xs text-right shrink-0";
                        count.textContent = enabled ? t.count + " 条" : "空";
                        label.appendChild(count);

                        var typeEl = document.createElement("span");
                        typeEl.className =
                            "w-7 sm:w-8 text-right text-xs shrink-0";
                        typeEl.textContent =
                            t.type === "auto" ? "自动" : "手动";
                        label.appendChild(typeEl);

                        box.appendChild(label);
                    })(list[i]);
                }
                updateTrackerSelectionStatus();
            }

            async function loadTrackerList(force) {
                if (_trackerLoading) return;
                if (_trackersLoaded && !force) return;
                _trackerLoading = true;
                setTrackerStatus("加载中...", false);
                try {
                    var res = await fetch(API + "/v0/tracker");
                    var d = await readJSON(res);
                    if (!res.ok || !d) {
                        setTrackerStatus("Tracker 列表加载失败", true);
                        return;
                    }
                    _trackers = Array.isArray(d.data) ? d.data : [];
                    _trackersLoaded = true;
                    _trackerIndex = {};
                    for (var i = 0; i < _trackers.length; i++) {
                        _trackerIndex[_trackers[i].id] = _trackers[i];
                    }
                    renderTrackerList();
                } catch (e) {
                    setTrackerStatus("Tracker 列表加载失败", true);
                } finally {
                    _trackerLoading = false;
                }
            }

            function updateFetchRows() {
                var source = radioValue("fetch-source");
                var showNames = source === "tracker_names";
                document.getElementById("row-fetch-names").style.display =
                    showNames ? "" : "none";
                document.getElementById("row-fetch-ids").style.display =
                    source === "ids" ? "" : "none";
                if (showNames) loadTrackerList(false);
            }

            function buildFetchBody() {
                var source = radioValue("fetch-source");
                var body = {
                    source: source,
                    json: radioValue("fetch-json"),
                    images: radioValue("fetch-images")
                };
                if (source === "tracker_names") {
                    var names = [];
                    var seen = {};
                    var selected = Object.keys(_selectedTrackerIDs);
                    for (var i = 0; i < selected.length; i++) {
                        if (!seen[selected[i]]) {
                            seen[selected[i]] = true;
                            names.push(selected[i]);
                        }
                    }
                    var manual = splitList(
                        document.getElementById("fetch-names").value
                    );
                    for (var j = 0; j < manual.length; j++) {
                        if (!seen[manual[j]]) {
                            seen[manual[j]] = true;
                            names.push(manual[j]);
                        }
                    }
                    if (!names.length) {
                        showError("请选择或填写 Tracker");
                        return null;
                    }
                    for (var k = 0; k < names.length; k++) {
                        if (!/^[a-zA-Z0-9_-]+$/.test(names[k])) {
                            showError(MSG.errInvalidTrackerName);
                            return null;
                        }
                    }
                    if (_trackersLoaded) {
                        var missing = [];
                        for (var m = 0; m < names.length; m++) {
                            if (!_trackerIndex[names[m]]) {
                                missing.push(names[m]);
                            }
                        }
                        if (missing.length) {
                            showError("未找到 Tracker：" + missing.join("、"));
                            return null;
                        }
                        var empty = [];
                        for (var n = 0; n < names.length; n++) {
                            var info = _trackerIndex[names[n]];
                            if (info && info.count === 0) {
                                empty.push(names[n]);
                            }
                        }
                        if (empty.length) {
                            showError("Tracker 为空：" + empty.join("、"));
                            return null;
                        }
                    }
                    body.names = names;
                }
                if (source === "ids") {
                    body.ids = splitIDs(
                        document.getElementById("fetch-ids").value
                    );
                    if (!body.ids.length) {
                        showError("请填写动画 ID");
                        return null;
                    }
                }
                return body;
            }

            function fetchSummary(body) {
                var lines = [
                    "来源：" +
                        {
                            tracker_new: "所有 Tracker 中的新增 ID",
                            tracker_all: "所有 Tracker",
                            tracker_names: "指定 Tracker",
                            ids: "指定 ID",
                            local: "本地存在的条目"
                        }[body.source]
                ];
                if (body.names && body.names.length) {
                    lines.push("Tracker：" + body.names.join("、"));
                }
                if (body.ids && body.ids.length) {
                    lines.push("ID：" + body.ids.join("、"));
                }
                lines.push(
                    "JSON：" +
                        (body.json === "fill" ? "补充缺失" : "全量下载并覆盖")
                );
                lines.push(
                    "图片：" +
                        {
                            none: "跳过",
                            fill: "补充缺失",
                            overwrite: "全量下载并覆盖"
                        }[body.images]
                );
                lines.push("");
                lines.push("确定开始拉取？");
                return lines.join("\n");
            }

            function requestStartFetch() {
                var body = buildFetchBody();
                if (!body) return;
                confirmAction(fetchSummary(body), function () {
                    startFetch(body);
                });
            }

            async function startFetch(body) {
                body = body || buildFetchBody();
                if (!body) return;
                var res = await fetch(API + "/v0/fetch", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                var d = await readJSON(res);
                if (!res.ok || !d) {
                    showError(errText(d, res.status));
                    return;
                }
                if (d.task_id) {
                    startProgress(d.task_id);
                } else {
                    showInfo("没有需要处理的条目");
                }
            }

            function requestAddTrackers() {
                var names = splitList(
                    document.getElementById("fetch-names").value
                );
                if (!names.length) {
                    showError("请填写 Tracker id");
                    return;
                }
                for (var i = 0; i < names.length; i++) {
                    if (!/^[a-zA-Z0-9_-]+$/.test(names[i])) {
                        showError(MSG.errInvalidTrackerName);
                        return;
                    }
                }
                confirmAction(
                    "将创建以下 Tracker：\n" +
                        names.join("、") +
                        "\n已存在的会跳过",
                    function () {
                        addTrackers(names);
                    }
                );
            }

            async function addTrackers(names) {
                var created = 0,
                    existed = 0,
                    failed = 0;
                for (var i = 0; i < names.length; i++) {
                    var r = await fetch(API + "/v0/tracker/create", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ id: names[i] })
                    });
                    if (r.ok) created++;
                    else if (r.status === 409) existed++;
                    else failed++;
                }
                if (failed > 0) {
                    showWarn(
                        "已添加 " +
                            created +
                            " 个，已存在 " +
                            existed +
                            " 个，失败 " +
                            failed +
                            " 个"
                    );
                } else {
                    showSuccess(
                        "已添加 " +
                            created +
                            " 个 Tracker" +
                            (existed > 0 ? "，已存在 " + existed + " 个" : "")
                    );
                }
                loadTrackerList(true);
            }

            var _dangerLocks = [];

            function setupDangerLock(btn, onComplete) {
                var label = btn.querySelector(".lock-label");
                var fill = btn.querySelector(".lock-fill");
                var original = label.textContent;
                var state = "idle";
                var holdStart = 0;
                var raf = 0;
                var armTimer = 0;
                var highlightTimer = 0;
                var completeTimer = 0;
                var suppressClick = false;

                function setFill(pct) {
                    fill.style.width = pct + "%";
                }
                function cancelTimers() {
                    cancelAnimationFrame(raf);
                    clearTimeout(armTimer);
                    clearTimeout(highlightTimer);
                    clearTimeout(completeTimer);
                }
                function reset() {
                    cancelTimers();
                    state = "idle";
                    label.textContent = original;
                    label.classList.remove("text-pink");
                    setFill(0);
                }
                function arm() {
                    if (state !== "idle") return;
                    for (var i = 0; i < _dangerLocks.length; i++) {
                        if (_dangerLocks[i] !== controller) {
                            _dangerLocks[i].reset();
                        }
                    }
                    state = "armed";
                    label.textContent = "按住来应用此项";
                    label.classList.add("text-pink");
                    highlightTimer = setTimeout(function () {
                        label.classList.remove("text-pink");
                    }, 900);
                    armTimer = setTimeout(function () {
                        if (state === "armed") reset();
                    }, 5000);
                }
                function cancelHold() {
                    if (state !== "holding") return;
                    cancelAnimationFrame(raf);
                    setFill(0);
                    state = "armed";
                    label.textContent = "按住来应用此项";
                    label.classList.add("text-pink");
                    clearTimeout(highlightTimer);
                    highlightTimer = setTimeout(function () {
                        label.classList.remove("text-pink");
                    }, 900);
                    clearTimeout(armTimer);
                    armTimer = setTimeout(function () {
                        if (state === "armed") reset();
                    }, 5000);
                }
                function startHold(e) {
                    if (state !== "idle" && state !== "armed") return;
                    if (e) e.preventDefault();
                    if (state === "idle") {
                        for (var i = 0; i < _dangerLocks.length; i++) {
                            if (_dangerLocks[i] !== controller) {
                                _dangerLocks[i].reset();
                            }
                        }
                    }
                    state = "holding";
                    clearTimeout(armTimer);
                    clearTimeout(highlightTimer);
                    label.textContent = "按住来应用此项";
                    label.classList.remove("text-pink");
                    holdStart = performance.now();
                    function frame(now) {
                        if (state !== "holding") return;
                        var pct = Math.min(
                            100,
                            ((now - holdStart) / 1500) * 100
                        );
                        setFill(pct);
                        if (pct >= 100) {
                            state = "idle";
                            suppressClick = true;
                            setFill(100);
                            clearTimeout(armTimer);
                            clearTimeout(highlightTimer);
                            completeTimer = setTimeout(function () {
                                reset();
                                onComplete();
                                setTimeout(function () {
                                    suppressClick = false;
                                }, 500);
                            }, 120);
                            return;
                        }
                        raf = requestAnimationFrame(frame);
                    }
                    raf = requestAnimationFrame(frame);
                }

                btn.addEventListener("click", function () {
                    if (suppressClick) {
                        suppressClick = false;
                        return;
                    }
                    if (state === "idle") arm();
                });
                btn.addEventListener("pointerdown", startHold);
                btn.addEventListener("pointerup", cancelHold);
                btn.addEventListener("pointercancel", cancelHold);
                btn.addEventListener("pointerleave", function () {
                    if (state === "holding") cancelHold();
                });
                btn.addEventListener("keydown", function (e) {
                    if (e.key !== " " && e.key !== "Enter") return;
                    if (state === "idle" || state === "armed") {
                        e.preventDefault();
                        startHold(e);
                    }
                });
                btn.addEventListener("keyup", function (e) {
                    if (e.key !== " " && e.key !== "Enter") return;
                    if (state === "holding") {
                        e.preventDefault();
                        cancelHold();
                    }
                });
                btn.addEventListener("blur", function () {
                    if (state === "armed" || state === "holding") reset();
                });

                var controller = { reset: reset };
                _dangerLocks.push(controller);
                return controller;
            }

            function confirmDeepDanger() {
                api("/v0/tracker")
                    .then(function (d) {
                        var msg = MSG.confirmRebuildAll().replace(/。$/, "");
                        if (d && typeof d.total === "number") {
                            msg += "，Tracker 数量：" + d.total;
                        }
                        msg += "，此操作不可恢复";
                        confirmAction(msg, doDeepRebuild);
                    })
                    .catch(function () {
                        confirmAction(
                            MSG.confirmRebuildAll().replace(/。$/, "") +
                                "，此操作不可恢复",
                            doDeepRebuild
                        );
                    });
            }

            var _activeTaskId = "";
            var _overlayHideTimer = 0;
            var _overlayVisible = false;
            var _bodyOverflow = "";

            function showTaskOverlay(id, label) {
                if (!id) return;
                var overlay = document.getElementById("task-overlay");
                var content = document.getElementById("manage-content");
                var same = _activeTaskId === id;
                clearTimeout(_overlayHideTimer);
                _activeTaskId = id;
                document.getElementById("task-overlay-label").textContent =
                    label || "任务进行中";
                if (!same) {
                    document.getElementById("task-overlay-phase").textContent =
                        "";
                    document.getElementById("task-overlay-detail").textContent =
                        "";
                    var fill = document.getElementById("task-overlay-fill");
                    fill.style.width = "0";
                    fill.style.background = "var(--c-toast-progress)";
                }
                var topbar = document.getElementById("topbar");
                overlay.style.top =
                    Math.max(
                        0,
                        Math.round(topbar.getBoundingClientRect().bottom)
                    ) + "px";
                if (!_overlayVisible) {
                    _bodyOverflow = document.body.style.overflow;
                    _overlayVisible = true;
                }
                document.body.style.overflow = "hidden";
                overlay.style.display = "flex";
                content.inert = true;
                document.getElementById("btn-task-abort").focus();
            }

            function hideTaskOverlay() {
                clearTimeout(_overlayHideTimer);
                _activeTaskId = "";
                var overlay = document.getElementById("task-overlay");
                if (overlay) overlay.style.display = "none";
                var content = document.getElementById("manage-content");
                if (content) content.inert = false;
                if (_overlayVisible) {
                    document.body.style.overflow = _bodyOverflow;
                    _overlayVisible = false;
                }
            }

            function updateTaskOverlay(detail) {
                if (!_activeTaskId || detail.id !== _activeTaskId) return;
                var d = detail.data || {};
                if (d.label) {
                    document.getElementById("task-overlay-label").textContent =
                        d.label;
                }
                var fill = document.getElementById("task-overlay-fill");
                var phase = document.getElementById("task-overlay-phase");
                var text = document.getElementById("task-overlay-detail");
                if (d.step === "complete" || d.step === "done") {
                    phase.textContent = "完成";
                    text.textContent = "";
                    fill.style.width = "100%";
                    fill.style.background = "#22c55e";
                    var doneId = _activeTaskId;
                    _overlayHideTimer = setTimeout(function () {
                        if (_activeTaskId === doneId) hideTaskOverlay();
                    }, 800);
                    return;
                }
                if (d.step === "cancelled") {
                    phase.textContent = "任务已终止";
                    text.textContent = "";
                    fill.style.width = "100%";
                    fill.style.background = "var(--c-toast-warning)";
                    var cancelId = _activeTaskId;
                    _overlayHideTimer = setTimeout(function () {
                        if (_activeTaskId === cancelId) hideTaskOverlay();
                    }, 1200);
                    return;
                }
                var phaseText = d.phase_name || "";
                if (d.phase && d.phases) {
                    phaseText +=
                        (phaseText ? " " : "") +
                        "(" +
                        d.phase +
                        "/" +
                        d.phases +
                        ")";
                }
                phase.textContent = phaseText;
                if (typeof d.done === "number" && d.total) {
                    fill.style.width =
                        Math.round((d.done / d.total) * 100) + "%";
                    var parts = [];
                    parts.push(d.done + "/" + d.total);
                    if (d.speed) parts.push(d.speed);
                    text.textContent = parts.join("，");
                } else if (d.status) {
                    text.textContent = d.status;
                }
            }

            (async () => {
                if (!(await requireFeature("fetch"))) return;
                if (!(await requireFeature("task"))) return;
                applyFeatureVisibility(document);

                var sourceRadios = document.querySelectorAll(
                    'input[name="fetch-source"]'
                );
                for (var i = 0; i < sourceRadios.length; i++) {
                    sourceRadios[i].addEventListener("change", updateFetchRows);
                }
                var optionRadios = document.querySelectorAll(
                    'input[name="fetch-json"], input[name="fetch-images"]'
                );
                for (var i = 0; i < optionRadios.length; i++) {
                    optionRadios[i].addEventListener("change", updateFetchRows);
                }
                updateFetchRows();

                document.getElementById("btn-page-fetch").onclick =
                    requestStartFetch;
                document.getElementById("btn-add-trackers").onclick =
                    requestAddTrackers;
                window.addEventListener("seshat:trackers-changed", function () {
                    loadTrackerList(true);
                });
                window.addEventListener("seshat:task-start", function (e) {
                    showTaskOverlay(e.detail.id, e.detail.label);
                });
                window.addEventListener("seshat:task-progress", function (e) {
                    updateTaskOverlay(e.detail);
                });
                window.addEventListener("seshat:task-error", function (e) {
                    if (!_activeTaskId || e.detail.id !== _activeTaskId) return;
                    document.getElementById("task-overlay-phase").textContent =
                        "进度连接中断";
                    document.getElementById("task-overlay-detail").textContent =
                        "请刷新页面重试";
                });
                window.addEventListener("resize", function () {
                    if (!_activeTaskId) return;
                    var topbar = document
                        .getElementById("topbar")
                        .getBoundingClientRect();
                    document.getElementById("task-overlay").style.top =
                        Math.max(0, Math.round(topbar.bottom)) + "px";
                });
                document.getElementById("btn-task-abort").onclick =
                    function () {
                        confirmAction(
                            "将终止 Seshat 后端进程，当前任务会中断，已完成的数据保留。",
                            function () {
                                fetch(API + "/v0/task/cancel", {
                                    method: "POST"
                                }).then(function () {
                                    showInfo("已发送中止请求");
                                });
                            }
                        );
                    };
                apiFor("task", "/v0/tasks").then(function (d) {
                    if (!d || !d.data || !d.data.length) return;
                    var task = d.data[0];
                    showTaskOverlay(task.id, task.label);
                    updateTaskOverlay({
                        id: task.id,
                        data: {
                            step: "snapshot",
                            label: task.label,
                            done: task.done,
                            total: task.total,
                            phase: task.phase,
                            phases: task.phases,
                            phase_name: task.phase_name
                        }
                    });
                });

                document.getElementById("btn-page-import").onclick =
                    function () {
                        confirmAction(
                            "将用户收藏列表导入为 Tracker，之后可参与其他拉取行为。",
                            doImportCollections
                        );
                    };
                document.getElementById("btn-page-user").onclick = function () {
                    if (!window.USERNAME) {
                        showError(MSG.errNoUsername);
                        return;
                    }
                    confirmAction(MSG.confirmUserFetch(), doUserFetch);
                };
                setupDangerLock(
                    document.getElementById("btn-page-index"),
                    function () {
                        confirmAction(MSG.confirmRebuildIndex, doFetchIndex);
                    }
                );
                setupDangerLock(
                    document.getElementById("btn-page-elo"),
                    function () {
                        confirmAction(
                            "将清空当前 ELO 分数并从对战历史完整重建",
                            doRebuildELO
                        );
                    }
                );
                setupDangerLock(
                    document.getElementById("btn-page-deep"),
                    confirmDeepDanger
                );
                document.getElementById("btn-confirm-cancel").onclick =
                    closeConfirm;
            })();
        </script>
    </body>
</html>
