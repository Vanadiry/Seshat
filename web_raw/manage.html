<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>管理 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .radio-pink {
                appearance: none;
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                border: 2px solid var(--c-sub);
                border-radius: 9999px;
                background: transparent;
                cursor: pointer;
                position: relative;
                flex: none;
            }
            .radio-pink:checked {
                border-color: var(--c-pink);
            }
            .radio-pink:checked::after {
                content: "";
                position: absolute;
                inset: 3px;
                border-radius: 9999px;
                background: var(--c-pink);
            }
            .radio-pink:focus-visible {
                outline: 2px solid var(--c-pink);
                outline-offset: 2px;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <main class="max-w-[1000px] mx-auto p-6">
            <div class="flex flex-col sm:flex-row gap-8">
                <div class="flex-1 min-w-0">
                    <section class="mb-8 sm:mb-0">
                        <div class="flex items-center gap-2 mb-3">
                            <span
                                class="w-[3px] h-[18px] bg-pink rounded-sm"
                            ></span>
                            <h2 class="font-bold text-sm">拉取</h2>
                        </div>

                        <div class="text-xs text-sub mb-2">来源</div>
                        <div class="flex flex-col gap-2 mb-3">
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="tracker_new"
                                    class="radio-pink"
                                />
                                所有 Tracker 中的新增 ID
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="tracker_all"
                                    class="radio-pink"
                                />
                                所有 Tracker
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="tracker_names"
                                    class="radio-pink"
                                />
                                指定 Tracker
                            </label>
                            <div
                                id="row-fetch-names"
                                style="display: none"
                                class="ml-6 flex items-stretch gap-2"
                            >
                                <input
                                    id="fetch-names"
                                    placeholder="Tracker 名称，逗号分隔"
                                    class="flex-1 px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                                />
                                <button
                                    id="btn-add-trackers"
                                    type="button"
                                    title="添加 Tracker"
                                    aria-label="添加 Tracker"
                                    class="w-9 shrink-0 rounded-lg border border-bord bg-transparent text-sub text-lg leading-none cursor-pointer hover:bg-active hover:text-text flex items-center justify-center"
                                >
                                    +
                                </button>
                            </div>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="ids"
                                    checked
                                    class="radio-pink"
                                />
                                指定 ID
                            </label>
                            <div
                                id="row-fetch-ids"
                                style="display: none"
                                class="ml-6"
                            >
                                <input
                                    id="fetch-ids"
                                    placeholder="动画 ID，如 51 或 51, 288"
                                    class="w-full px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                                />
                            </div>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="local"
                                    class="radio-pink"
                                />
                                本地存在的条目
                            </label>
                        </div>

                        <div class="text-xs text-sub mb-2">JSON</div>
                        <div class="flex flex-col gap-2 mb-3">
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-json"
                                    value="fill"
                                    checked
                                    class="radio-pink"
                                />
                                补充缺失
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-json"
                                    value="overwrite"
                                    class="radio-pink"
                                />
                                全量下载并覆盖
                            </label>
                        </div>

                        <div class="text-xs text-sub mb-2">图片</div>
                        <div class="flex flex-col gap-2 mb-3">
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-images"
                                    value="none"
                                    class="radio-pink"
                                />
                                跳过
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-images"
                                    value="fill"
                                    checked
                                    class="radio-pink"
                                />
                                补充缺失
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-images"
                                    value="overwrite"
                                    class="radio-pink"
                                />
                                全量下载并覆盖
                            </label>
                        </div>

                        <button
                            id="btn-page-fetch"
                            class="w-full px-4 py-2 rounded-lg bg-pink text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90"
                        >
                            开始拉取
                        </button>
                    </section>
                </div>

                <div class="hidden sm:block w-px bg-bord-light shrink-0"></div>

                <div class="flex-1 min-w-0">
                    <section class="mb-8">
                        <div class="flex items-center gap-2 mb-3">
                            <span
                                class="w-[3px] h-[18px] bg-pink rounded-sm"
                            ></span>
                            <h2 class="font-bold text-sm">用户数据</h2>
                        </div>
                        <p class="text-xs text-sub mb-3">
                            重新拉取当前用户的信息、头像和收藏，或把收藏导入为
                            Tracker。
                        </p>
                        <div class="flex flex-col gap-2">
                            <button
                                id="btn-page-user"
                                class="w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text"
                            >
                                刷新用户数据
                            </button>
                            <button
                                id="btn-page-import"
                                data-feature="tracker"
                                class="w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text"
                            >
                                导入收藏为 Tracker
                            </button>
                        </div>
                    </section>

                    <section class="mb-8">
                        <div class="flex items-center gap-2 mb-3">
                            <span
                                class="w-[3px] h-[18px] bg-[#dc2626] rounded-sm"
                            ></span>
                            <h2 class="font-bold text-sm text-[#dc2626]">
                                危险区
                            </h2>
                        </div>
                        <p class="text-xs text-sub mb-3">
                            这些操作会影响大量数据，请先确认。
                        </p>
                        <div class="flex flex-col gap-2">
                            <button
                                id="btn-page-index"
                                class="w-full px-3 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text"
                            >
                                重建索引
                            </button>
                            <button
                                id="btn-page-elo"
                                data-feature="elo"
                                class="w-full px-3 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text"
                            >
                                重建 ELO
                            </button>
                            <button
                                id="btn-page-deep"
                                class="w-full px-3 py-2 rounded-lg bg-[#dc2626] text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90"
                            >
                                重建全部
                            </button>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <div
            id="confirm-overlay"
            class="fixed inset-0 bg-black/70 flex items-center justify-center z-[400] transition-opacity duration-200"
            style="display: none; opacity: 0"
        >
            <div
                class="bg-surface-alt border border-bord rounded-lg p-5 w-[340px] max-w-[85vw]"
            >
                <p id="confirm-msg" class="text-sm mb-4 leading-relaxed"></p>
                <button
                    id="btn-confirm-exec"
                    class="w-full px-4 py-2 rounded-lg bg-pink text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90 mb-2"
                >
                    执行
                </button>
                <button
                    id="btn-confirm-cancel"
                    class="w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active"
                >
                    取消
                </button>
            </div>
        </div>

        <script src="assets/app.min.js"></script>
        <script>
            function radioValue(name) {
                var el = document.querySelector(
                    'input[name="' + name + '"]:checked'
                );
                return el ? el.value : "";
            }

            function splitList(value) {
                return value
                    .split(",")
                    .map(function (s) {
                        return s.trim();
                    })
                    .filter(Boolean);
            }

            function splitIDs(value) {
                return splitList(value)
                    .map(function (s) {
                        return parseInt(s, 10);
                    })
                    .filter(function (n) {
                        return n > 0;
                    });
            }

            function updateFetchRows() {
                var source = radioValue("fetch-source");
                document.getElementById("row-fetch-names").style.display =
                    source === "tracker_names" ? "" : "none";
                document.getElementById("row-fetch-ids").style.display =
                    source === "ids" ? "" : "none";
            }

            async function startFetch() {
                var source = radioValue("fetch-source");
                var body = {
                    source: source,
                    json: radioValue("fetch-json"),
                    images: radioValue("fetch-images")
                };
                if (source === "tracker_names") {
                    body.names = splitList(
                        document.getElementById("fetch-names").value
                    );
                    if (!body.names.length) {
                        showError("请填写 Tracker 名称");
                        return;
                    }
                }
                if (source === "ids") {
                    body.ids = splitIDs(
                        document.getElementById("fetch-ids").value
                    );
                    if (!body.ids.length) {
                        showError("请填写动画 ID");
                        return;
                    }
                }
                var res = await fetch(API + "/v0/fetch", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                var d = await readJSON(res);
                if (!res.ok || !d) {
                    showError(errText(d, res.status));
                    return;
                }
                if (d.task_id) startProgress(d.task_id);
                if (d.count > 0) {
                    showSuccess("已开始，处理 " + d.count + " 个条目");
                }
            }

            async function addTrackers() {
                var names = splitList(
                    document.getElementById("fetch-names").value
                );
                if (!names.length) {
                    showError("请填写 Tracker 名称");
                    return;
                }
                for (var i = 0; i < names.length; i++) {
                    if (!/^[a-zA-Z0-9_-]+$/.test(names[i])) {
                        showError(MSG.errInvalidTrackerName);
                        return;
                    }
                }
                var created = 0,
                    existed = 0,
                    failed = 0;
                for (var i = 0; i < names.length; i++) {
                    var r = await fetch(API + "/v0/tracker/create", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name: names[i] })
                    });
                    if (r.ok) created++;
                    else if (r.status === 409) existed++;
                    else failed++;
                }
                if (failed > 0) {
                    showWarn(
                        "已添加 " +
                            created +
                            " 个，已存在 " +
                            existed +
                            " 个，失败 " +
                            failed +
                            " 个"
                    );
                } else {
                    showSuccess(
                        "已添加 " +
                            created +
                            " 个 Tracker" +
                            (existed > 0 ? "，已存在 " + existed + " 个" : "")
                    );
                }
            }

            (async () => {
                if (!(await requireFeature("fetch"))) return;
                if (!(await requireFeature("task"))) return;
                applyFeatureVisibility(document);

                var sourceRadios = document.querySelectorAll(
                    'input[name="fetch-source"]'
                );
                for (var i = 0; i < sourceRadios.length; i++) {
                    sourceRadios[i].addEventListener("change", updateFetchRows);
                }
                var optionRadios = document.querySelectorAll(
                    'input[name="fetch-json"], input[name="fetch-images"]'
                );
                for (var i = 0; i < optionRadios.length; i++) {
                    optionRadios[i].addEventListener("change", updateFetchRows);
                }
                updateFetchRows();

                document.getElementById("btn-page-fetch").onclick = startFetch;
                document.getElementById("btn-add-trackers").onclick =
                    addTrackers;

                document.getElementById("btn-page-import").onclick =
                    function () {
                        confirmAction(
                            "将用户收藏列表导入为 Tracker，之后可参与其他拉取行为。",
                            doImportCollections
                        );
                    };
                document.getElementById("btn-page-user").onclick = function () {
                    if (!window.USERNAME) {
                        showError(MSG.errNoUsername);
                        return;
                    }
                    confirmAction(MSG.confirmUserFetch(), doUserFetch);
                };
                document.getElementById("btn-page-index").onclick =
                    function () {
                        confirmAction(MSG.confirmRebuildIndex, doFetchIndex);
                    };
                document.getElementById("btn-page-elo").onclick = function () {
                    confirmAction(
                        "将清空当前 ELO 分数并从对战历史完整重建",
                        doRebuildELO
                    );
                };
                document.getElementById("btn-page-deep").onclick = function () {
                    confirmAction(MSG.confirmRebuildAll(), doDeepRebuild);
                };
                document.getElementById("btn-confirm-cancel").onclick =
                    closeConfirm;
            })();
        </script>
    </body>
</html>
