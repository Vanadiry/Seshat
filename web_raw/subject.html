<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>动画详情 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .line-clamp-3 {
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .ep-tip {
                transition: opacity 0.15s ease;
                pointer-events: auto;
            }
            .ep-close {
                position: absolute;
                top: 4px;
                right: 4px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                border: none;
                background: rgba(128, 128, 128, 0.3);
                color: rgba(128, 128, 128, 0.8);
                font-size: 13px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .ep-close:hover {
                background: rgba(128, 128, 128, 0.5);
                color: #fff;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div class="sticky top-0 z-50">
            <div id="topbar"></div>
            <div
                id="subject-header"
                class="bg-surface-raised border-b border-bord"
            ></div>
        </div>
        <main id="view" class="max-w-[1200px] mx-auto p-6"></main>

        <div
            id="confirm-overlay"
            class="fixed inset-0 bg-black/70 flex items-center justify-center z-[400] transition-opacity duration-200"
            style="display: none; opacity: 0"
        >
            <div
                class="bg-surface-alt border border-bord rounded-lg p-5 w-[340px] max-w-[85vw]"
                role="dialog"
                aria-modal="true"
                aria-labelledby="confirm-msg"
            >
                <p
                    id="confirm-msg"
                    class="text-sm mb-4 leading-relaxed whitespace-pre-line"
                ></p>
                <button
                    id="btn-confirm-exec"
                    class="h-10 w-full px-4 py-2 rounded-lg bg-pink-solid text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90 mb-2"
                >
                    执行
                </button>
                <button
                    id="btn-confirm-cancel"
                    class="h-10 w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active"
                >
                    取消
                </button>
            </div>
        </div>

        <script src="assets/app.min.js"></script>
        <script type="module" src="assets/subject.js"></script>
        <script>
            var SID = new URLSearchParams(location.search).get("id");
            var tab =
                new URLSearchParams(location.search).get("tab") || "overview";
            var epCount = 0,
                charCount = 0,
                persCount = 0;
            var _myColl = null;
            var _myCollLoaded = false;

            function exportSubjectBundle() {
                if (!SID) return;
                confirmAction(
                    "导出 #" + SID + " 的本地数据包？",
                    async function () {
                        var btn = document.getElementById("btn-export-bundle");
                        if (btn) btn.disabled = true;
                        showInfo("正在导出数据包...");
                        try {
                            var res = await fetch(API + "/v0/bundle/export", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    source: "ids",
                                    ids: [parseInt(SID, 10)]
                                })
                            });
                            var d = await readJSON(res);
                            if (!res.ok || !d) {
                                showError(errText(d, res.status));
                                return;
                            }
                            showSuccess(
                                "已导出 " +
                                    escapeHtml(d.filename) +
                                    "<br><span class='text-xs'>路径：" +
                                    escapeHtml(d.path) +
                                    "</span>"
                            );
                        } catch (e) {
                            showError("导出失败");
                        } finally {
                            if (btn) btn.disabled = false;
                        }
                    }
                );
            }

            async function loadMyCollection() {
                if (_myCollLoaded) return _myColl;
                _myCollLoaded = true;
                if (!window.USERNAME || !SID) return null;
                try {
                    var d = await api(
                        "/v0/users/" +
                            window.USERNAME +
                            "/collections?view=summary"
                    );
                    if (!d || !d.data) return null;
                    for (var i = 0; i < d.data.length; i++) {
                        if (String(d.data[i].subject_id) !== String(SID)) {
                            continue;
                        }
                        _myColl = {
                            type: d.data[i].type,
                            rate: d.data[i].rate
                        };
                        break;
                    }
                } catch (_) {}
                return _myColl;
            }

            function switchTab(t) {
                tab = t;
                history.replaceState({}, "", "?id=" + SID + "&tab=" + t);
                render();
            }

            function tabsHtml() {
                var counts = {
                    ep: epCount,
                    chars: charCount,
                    persons: persCount
                };
                var items = [
                    ["overview", "概览"],
                    ["ep", "剧集"],
                    ["chars", "角色"],
                    ["persons", "制作人员"]
                ];
                return items
                    .map(function (i) {
                        var label = i[1];
                        if (counts[i[0]] && tab === i[0])
                            label += " (" + counts[i[0]] + ")";
                        var cls =
                            tab === i[0]
                                ? "text-text border-b-2 border-pink"
                                : "text-sub hover:text-text";
                        return (
                            "<a href=\"javascript:switchTab('" +
                            i[0] +
                            '\')" id="tab-' +
                            i[0] +
                            '" class="' +
                            cls +
                            ' no-underline px-3 py-1 text-sm inline-block whitespace-nowrap">' +
                            label +
                            "</a>"
                        );
                    })
                    .join("");
            }

            function updateTabCount(kind, count) {
                if (tab !== kind) return; // 只更新当前激活的标签页
                var el = document.getElementById("tab-" + kind);
                if (!el || count <= 0) return;
                var base =
                    { ep: "剧集", chars: "角色", persons: "制作人员" }[kind] ||
                    "";
                el.textContent = base + " (" + count + ")";
            }

            async function render() {
                try {
                    var s = await api("/v0/subjects/" + SID);
                    if (!s) {
                        document.getElementById("view").innerHTML =
                            '<div class="select-text fade-in">' +
                            '<p class="text-sub text-center py-20">未找到</p>';
                        return;
                    }
                    await loadPersonMap();
                    var infoItems = infoboxData(s);
                    var hdr = document.getElementById("subject-header");
                    hdr.innerHTML =
                        '<div class="max-w-[1200px] mx-auto px-6 h-12 py-0 flex items-center gap-3 overflow-x-auto">' +
                        '<a href="/" onclick="backNav(event)" class="w-7 h-7 rounded-full border border-bord-strong flex items-center justify-center text-sub hover:text-text hover:border-bord-xstrong shrink-0 no-underline text-xs" title="返回">←</a>' +
                        (isRemote("/v0/subjects/" + SID)
                            ? globeIcon("w-6 h-6")
                            : "") +
                        (s.nsfw
                            ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-warn-bg text-warn shrink-0">NSFW</span>'
                            : "") +
                        '<span class="select-text text-xl font-bold truncate">' +
                        primaryName(escapeHtml(s.name), escapeHtml(s.name_cn)) +
                        "</span>" +
                        (function () {
                            var sub = subName(
                                escapeHtml(s.name),
                                escapeHtml(s.name_cn)
                            );
                            return sub
                                ? '<span class="select-text text-sm text-sub truncate hidden sm:inline">' +
                                      sub +
                                      "</span>"
                                : "";
                        })() +
                        (escapeHtml(s.platform)
                            ? '<span class="text-sub text-xs shrink-0">｜</span><span class="text-xs text-sub shrink-0">' +
                              escapeHtml(s.platform) +
                              "</span>"
                            : "") +
                        '<span class="text-sub text-xs shrink-0">｜</span><span class="select-text text-xs text-sub shrink-0">ID: ' +
                        SID +
                        "</span>" +
                        '<span class="flex-1"></span>' +
                        (resolve("bundle") !== "hidden"
                            ? '<button id="btn-export-bundle" type="button" onclick="exportSubjectBundle()" class="w-7 h-7 rounded-full border border-bord-strong flex items-center justify-center text-sub hover:text-text hover:border-bord-xstrong shrink-0 cursor-pointer bg-transparent" title="导出数据包" aria-label="导出数据包">' +
                              '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>' +
                              "</button>"
                            : "") +
                        '<span class="flex gap-0 shrink-0 ml-2">' +
                        tabsHtml() +
                        "</span></div>";
                    var myColl = await loadMyCollection();
                    if (tab === "overview")
                        await overview(s, infoItems, myColl);
                    else if (tab === "ep") await episodes();
                    else if (tab === "chars") await characters();
                    else if (tab === "persons") await personsList();
                } catch (e) {
                    document.getElementById("view").innerHTML =
                        '<div class="select-text fade-in">' +
                        '<p class="text-sub text-center py-20">渲染出错: ' +
                        e.message +
                        "</p>";
                }
            }

            async function overview(s, infoItems, myColl) {
                var myRate =
                    myColl && myColl.rate > 0 ? Number(myColl.rate) : 0;
                var myType = myColl ? COLL_TYPES[myColl.type] || "" : "";
                var epsRaw = await api("/v0/episodes?subject_id=" + SID);
                var charsRaw = await api(
                    "/v0/subjects/" + SID + "/characters"
                );
                var relsRaw = await api("/v0/subjects/" + SID + "/subjects");
                var eloData = await apiFor("elo", "/v0/elo/ranking");
                var eps = Array.isArray(epsRaw)
                    ? epsRaw
                    : epsRaw && epsRaw.data
                      ? epsRaw.data
                      : [];
                var chars = Array.isArray(charsRaw)
                    ? charsRaw
                    : charsRaw && charsRaw.data
                      ? charsRaw.data
                      : [];
                var rels = Array.isArray(relsRaw)
                    ? relsRaw
                    : relsRaw && relsRaw.data
                      ? relsRaw.data
                      : [];
                var eloInfo = null;
                if (eloData && eloData.data) {
                    for (var i = 0; i < eloData.data.length; i++) {
                        if (eloData.data[i].id == SID) {
                            eloInfo = eloData.data[i];
                            break;
                        }
                    }
                }
                epCount = eps.length;
                charCount = chars.length;
                updateTabCount("ep", epCount);
                updateTabCount("chars", charCount);
                api("/v0/subjects/" + SID + "/persons").then(function (pRaw) {
                    var p = Array.isArray(pRaw)
                        ? pRaw
                        : pRaw && pRaw.data
                          ? pRaw.data
                          : [];
                    persCount = p.length;
                    updateTabCount("persons", persCount);
                });
                var mainChars = chars
                    .filter(function (c) {
                        return c.relation === "主角" || c.relation === "配角";
                    })
                    .slice(0, 12);
                document.getElementById("view").innerHTML =
                    '<div id="subject-overview"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:subject-overview", {
                        detail: {
                            subject: s,
                            infoItems: infoItems,
                            myRate: myRate,
                            myType: myType,
                            hasColl: !!myColl,
                            eloInfo: eloInfo,
                            eps: eps,
                            mainChars: mainChars,
                            rels: rels
                        }
                    })
                );
            }

            var _epPinned = null;
            function initEpTooltips() {
                var cells = document.querySelectorAll(".ep-cell");
                for (var i = 0; i < cells.length; i++) {
                    (function (cell) {
                        var tip = cell.querySelector(".ep-tip");
                        var num = cell.querySelector(".ep-num");
                        if (!tip || !num) return;
                        function show() {
                            if (_epPinned && _epPinned !== cell) return;
                            tip.style.display = "block";
                            requestAnimationFrame(function () {
                                tip.style.opacity = "1";
                            });
                        }
                        function hide() {
                            if (_epPinned === cell) return;
                            tip.style.opacity = "0";
                            setTimeout(function () {
                                if (_epPinned !== cell)
                                    tip.style.display = "none";
                            }, 150);
                        }
                        function unpin(c) {
                            if (_epPinned === c) _epPinned = null;
                            var n = c.querySelector(".ep-num");
                            var t = c.querySelector(".ep-tip");
                            if (n) n.classList.remove("ring-1", "ring-pink");
                            if (t) {
                                t.style.opacity = "0";
                                setTimeout(function () {
                                    t.style.display = "none";
                                }, 150);
                            }
                            var cb = t && t.querySelector(".ep-close");
                            if (cb) cb.remove();
                        }
                        num.addEventListener("click", function (e) {
                            e.stopPropagation();
                            if (_epPinned === cell) {
                                unpin(cell);
                                return;
                            }
                            if (_epPinned) unpin(_epPinned);
                            _epPinned = cell;
                            num.classList.add("ring-1", "ring-pink");
                            tip.style.display = "block";
                            tip.style.opacity = "1";
                            if (!tip.querySelector(".ep-close")) {
                                var closeBtn = document.createElement("button");
                                closeBtn.className = "ep-close";
                                closeBtn.textContent = "×";
                                closeBtn.onclick = function (ev) {
                                    ev.stopPropagation();
                                    unpin(cell);
                                };
                                tip.firstElementChild.appendChild(closeBtn);
                            }
                        });
                        num.addEventListener("keydown", function (e) {
                            if (e.key !== "Enter" && e.key !== " ") return;
                            e.preventDefault();
                            num.click();
                        });
                        cell.addEventListener("mouseenter", show);
                        cell.addEventListener("mouseleave", hide);
                    })(cells[i]);
                }
            }

            async function episodes() {
                var epsRaw = await api("/v0/episodes?subject_id=" + SID);
                var eps = Array.isArray(epsRaw)
                    ? epsRaw
                    : epsRaw && epsRaw.data
                      ? epsRaw.data
                      : [];
                var types = MSG.epTypes;

                function epRows(list, label) {
                    if (!list.length) return "";
                    // 构建单个剧集卡片
                    var cards = [];
                    for (var i = 0; i < list.length; i++) {
                        var e = list[i];
                        var epName = primaryName(
                            escapeHtml(e.name),
                            escapeHtml(e.name_cn)
                        );
                        var epSub = subName(
                            escapeHtml(e.name),
                            escapeHtml(e.name_cn)
                        );
                        var desc = e.desc
                            ? linkifyPerson(e.desc).replace(
                                  /\r\n|\n|\\n|\\r\\n/g,
                                  "<br>"
                              )
                            : "";
                        cards.push(
                            '<div class="border-t border-bord-light py-3">' +
                                '<div class="flex items-baseline gap-2"><span class="text-pink text-sm font-bold w-8 shrink-0">' +
                                (e.type === 0
                                    ? String(
                                          Math.floor(e.sort || e.ep || 0)
                                      ).padStart(2, "0")
                                    : types[e.type]) +
                                '</span><span class="font-semibold text-[14px]">' +
                                epName +
                                "</span>" +
                                (epSub
                                    ? '<span class="text-xs text-sub">' +
                                      epSub +
                                      "</span>"
                                    : "") +
                                "</div>" +
                                '<div class="text-xs text-sub mt-1 ml-10">' +
                                (e.airdate ? "首播: " + e.airdate : "") +
                                (e.airdate && e.duration ? " ｜ " : "") +
                                (e.duration ? "时长: " + e.duration : "") +
                                "</div>" +
                                (desc
                                    ? '<div class="text-[13px] text-sub mt-1 ml-10 leading-relaxed">' +
                                      desc +
                                      "</div>"
                                    : "") +
                                "</div>"
                        );
                    }
                    // 两列配对
                    var html =
                        '<div class="mb-6"><div class="text-sm text-sub font-semibold mb-3">' +
                        label +
                        "</div>";
                    for (var i = 0; i < cards.length; i += 2) {
                        html +=
                            '<div class="flex gap-4">' +
                            '<div class="flex-1 min-w-0">' +
                            cards[i] +
                            "</div>" +
                            '<div class="flex-1 min-w-0">' +
                            (cards[i + 1] || "") +
                            "</div>" +
                            "</div>";
                    }
                    html += "</div>";
                    return html;
                }

                epCount = eps.length;
                updateTabCount("ep", epCount);
                var sorted = eps.slice().sort(function (a, b) {
                    var ta = a.type || 0,
                        tb = b.type || 0;
                    if (ta !== tb) return ta - tb;
                    return (a.sort || 0) - (b.sort || 0);
                });
                var main = sorted.filter(function (e) {
                    return e.type === 0;
                });
                var sp = sorted.filter(function (e) {
                    return e.type !== 0;
                });

                document.getElementById("view").innerHTML =
                    '<div class="select-text fade-in">' +
                    epRows(main, "本篇 (" + main.length + ")") +
                    epRows(sp, "SP / 其他 (" + sp.length + ")");
                initEpTooltips();
            }

            async function characters() {
                var charsRaw = await api("/v0/subjects/" + SID + "/characters");
                var chars = Array.isArray(charsRaw) ? charsRaw : [];
                charCount = chars.length;
                updateTabCount("chars", charCount);
                window._chars = chars;

                // 根据关系字段构建动态筛选项
                var relSet = {};
                for (var i = 0; i < chars.length; i++) {
                    var rel = chars[i].relation || "其他";
                    relSet[rel] = (relSet[rel] || 0) + 1;
                }
                var relKeys = Object.keys(relSet);
                var curFilter = "all";

                function filterBar(active) {
                    curFilter = active;
                    var html = '<div class="flex flex-wrap gap-1.5 mb-3">';
                    html +=
                        '<span tabindex="0" role="button" onkeydown="clickKeyNav(event)" onclick="window.filterChars(\'all\')" class="px-3 py-1 rounded-full text-xs cursor-pointer ' +
                        (active === "all"
                            ? "bg-pink-solid text-white"
                            : "bg-surface-alt text-sub hover:text-text") +
                        '">全部 (' +
                        chars.length +
                        ")</span>";
                    for (var k = 0; k < relKeys.length; k++) {
                        var rk = relKeys[k];
                        html +=
                            '<span tabindex="0" role="button" onkeydown="clickKeyNav(event)" onclick="window.filterChars(\'' +
                            rk +
                            '\')" class="px-3 py-1 rounded-full text-xs cursor-pointer ' +
                            (active === rk
                                ? "bg-pink-solid text-white"
                                : "bg-surface-alt text-sub hover:text-text") +
                            '">' +
                            rk +
                            " (" +
                            relSet[rk] +
                            ")</span>";
                    }
                    html += "</div>";
                    return html;
                }

                function renderCharList(list) {
                    var cards = [];
                    for (var i = 0; i < list.length; i++) {
                        var c = list[i];
                        var actorsHtml = "";
                        if (c.actors && c.actors.length) {
                            actorsHtml =
                                '<div class="flex gap-3 overflow-x-auto mt-2 thin-scroll" style="max-width:100%">';
                            for (var j = 0; j < c.actors.length; j++) {
                                var a = c.actors[j];
                                actorsHtml +=
                                    '<div tabindex="0" role="link" data-href="/person?id=' +
                                    a.id +
                                    '" onkeydown="cardKeyNav(event)" class="flex items-center gap-2 cursor-pointer hover:opacity-80 shrink-0" onclick="event.stopPropagation();location.href=\'/person?id=' +
                                    a.id +
                                    "'\">" +
                                    '<img alt="" src="' +
                                    img("person", a.id, "grid") +
                                    '" ' +
                                    imgOnError("person", a.id, "grid") +
                                    ' class="w-8 h-8 rounded-lg object-cover bg-surface shrink-0">' +
                                    '<div class="shrink-0"><div class="text-[13px] font-semibold hover:text-pink">' +
                                    escapeHtml(a.name) +
                                    '</div><div class="text-[11px] text-sub">CV</div></div></div>';
                            }
                            actorsHtml += "</div>";
                        }
                        var infoExtra = "";
                        if (c.gender)
                            infoExtra +=
                                '<span class="text-[12px] text-sub">性别:' +
                                c.gender +
                                "</span> ";
                        if (c.infobox) {
                            try {
                                var d = JSON.parse(c.infobox);
                                for (var j = 0; j < d.length; j++) {
                                    if (
                                        d[j].key === "生日" ||
                                        d[j].key === "身高"
                                    )
                                        infoExtra +=
                                            '<span class="text-[12px] text-sub">' +
                                            d[j].value +
                                            "</span> ";
                                }
                            } catch (e) {}
                        }
                        cards.push(
                            '<div tabindex="0" role="link" data-href="/character?id=' +
                                c.id +
                                '" onkeydown="cardKeyNav(event)" onclick="location.href=\'/character?id=' +
                                c.id +
                                '\'" class="border-t border-bord-light cursor-pointer" style="height:128px">' +
                                '<div class="flex items-center gap-3 h-full">' +
                                '<img alt="" src="' +
                                img("character", c.id, "small") +
                                '" ' +
                                imgOnError("character", c.id, "small") +
                                ' class="shrink-0 rounded object-cover object-top bg-surface cursor-pointer" style="width:80px;aspect-ratio:1/1.414" onclick="location.href=\'/character?id=' +
                                c.id +
                                "'\">" +
                                '<div class="flex-1 min-w-0 py-2 ml-1">' +
                                '<div class="font-semibold text-[14px] cursor-pointer hover:text-pink inline-block truncate" onclick="location.href=\'/character?id=' +
                                c.id +
                                "'\">" +
                                escapeHtml(c.name) +
                                "</div>" +
                                '<div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-0.5"><span class="bg-pink-solid text-white px-1.5 py-px rounded text-[11px] font-semibold">' +
                                c.relation +
                                "</span>" +
                                infoExtra +
                                "</div>" +
                                (actorsHtml || "") +
                                "</div></div></div>"
                        );
                    }
                    // 两列配对布局
                    var html = "";
                    for (var i = 0; i < cards.length; i += 2) {
                        html +=
                            '<div class="flex gap-4">' +
                            '<div class="flex-1 min-w-0">' +
                            cards[i] +
                            "</div>" +
                            '<div class="flex-1 min-w-0">' +
                            (cards[i + 1] || "") +
                            "</div>" +
                            "</div>";
                    }
                    return html;
                }

                document.getElementById("view").innerHTML =
                    '<div class="select-text fade-in">' +
                    filterBar("all") +
                    '<div id="char-list">' +
                    renderCharList(chars) +
                    "</div>";

                window.filterChars = function (rel) {
                    var list =
                        rel === "all"
                            ? window._chars
                            : window._chars.filter(function (c) {
                                  return c.relation === rel;
                              });
                    document.getElementById("view").innerHTML =
                        '<div class="select-text fade-in">' +
                        filterBar(rel) +
                        '<div id="char-list">' +
                        renderCharList(list) +
                        "</div>";
                };
            }

            async function personsList() {
                var personsRaw = await api("/v0/subjects/" + SID + "/persons");
                var persons = Array.isArray(personsRaw) ? personsRaw : [];
                persCount = persons.length;
                updateTabCount("persons", persCount);
                var groups = {};
                for (var i = 0; i < persons.length; i++) {
                    var key = persons[i].relation || "其他";
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(persons[i]);
                }
                var entries = Object.entries(groups);

                var sideLinks =
                    '<div class="bg-surface-alt rounded-lg overflow-hidden"><div class="p-3 max-h-[calc(100vh-8rem)] overflow-y-auto thin-scroll">';
                for (var i = 0; i < entries.length; i++) {
                    sideLinks +=
                        '<a href="#g-' +
                        i +
                        '" class="text-sub text-xs no-underline block py-0.5 hover:text-text">' +
                        entries[i][0] +
                        " (" +
                        entries[i][1].length +
                        ")</a>";
                }
                sideLinks += "</div></div>";

                var mainHtml = "";
                for (var i = 0; i < entries.length; i++) {
                    var k = entries[i][0],
                        v = entries[i][1];
                    // 每个分区内名称使用两列网格
                    var nameHtml =
                        '<div class="grid grid-cols-2 gap-x-4 gap-y-0.5">';
                    for (var j = 0; j < v.length; j++) {
                        var p = v[j];
                        nameHtml +=
                            '<a href="/person?id=' +
                            p.id +
                            '" class="flex items-center gap-2 py-1 border-b border-bord-light cursor-pointer hover:text-pink text-sm truncate no-underline">' +
                            escapeHtml(p.name) +
                            (p.eps
                                ? '<span class="text-xs text-sub ml-1 shrink-0">(' +
                                  p.eps +
                                  ")</span>"
                                : "") +
                            "</a>";
                    }
                    nameHtml += "</div>";
                    mainHtml +=
                        '<div class="mb-4 bg-surface-alt rounded-lg p-3 scroll-mt-28" id="g-' +
                        i +
                        '" style="break-inside:avoid">' +
                        sectionTitle(k, {
                            outer: "mb-2",
                            extra:
                                '<span class="text-xs text-sub">(' +
                                v.length +
                                ")</span>"
                        }) +
                        nameHtml +
                        "</div>";
                }

                document.getElementById("view").innerHTML =
                    '<div class="select-text fade-in">' +
                    '<div class="flex gap-6"><div class="flex-1" style="column-count:2;column-gap:1.5rem">' +
                    mainHtml +
                    '</div><div class="w-[140px] shrink-0 hidden md:block sticky sticky-below-detail-header self-start">' +
                    sideLinks +
                    "</div></div>";
            }

            render();
        </script>
    </body>
</html>
