<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>动画详情 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .thin-scroll::-webkit-scrollbar {
                height: 4px;
            }
            .thin-scroll::-webkit-scrollbar-track {
                background: transparent;
            }
            .thin-scroll::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.15);
                border-radius: 2px;
            }
            .thin-scroll::-webkit-scrollbar-thumb:hover {
                background: rgba(255, 255, 255, 0.4);
            }
            .thin-scroll::-webkit-scrollbar-thumb:active {
                background: rgba(255, 255, 255, 0.5);
            }
            .thin-scroll {
                scrollbar-width: thin;
                scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
            }
            .line-clamp-3 {
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>
        <div
            id="subject-header"
            class="sticky top-12 z-40 bg-surface-raised border-b border-bord"
        ></div>
        <main id="view" class="max-w-[1200px] mx-auto p-6"></main>

        <script src="assets/app.min.js"></script>
        <script>
            var SID = new URLSearchParams(location.search).get("id");
            var tab =
                new URLSearchParams(location.search).get("tab") || "overview";
            var epCount = 0,
                charCount = 0,
                persCount = 0;

            function switchTab(t) {
                tab = t;
                history.replaceState({}, "", "?id=" + SID + "&tab=" + t);
                render();
            }

            function tabsHtml() {
                var counts = {
                    ep: epCount,
                    chars: charCount,
                    persons: persCount
                };
                var items = [
                    ["overview", "概览"],
                    ["ep", "剧集"],
                    ["chars", "角色"],
                    ["persons", "制作人员"]
                ];
                return items
                    .map(function (i) {
                        var label = i[1];
                        if (counts[i[0]] && tab === i[0])
                            label += " (" + counts[i[0]] + ")";
                        var cls =
                            tab === i[0]
                                ? "text-text border-b-2 border-pink"
                                : "text-sub hover:text-text";
                        return (
                            "<a href=\"javascript:switchTab('" +
                            i[0] +
                            '\')" id="tab-' +
                            i[0] +
                            '" class="' +
                            cls +
                            ' no-underline px-3 py-1 text-sm inline-block whitespace-nowrap">' +
                            label +
                            "</a>"
                        );
                    })
                    .join("");
            }

            function updateTabCount(kind, count) {
                if (tab !== kind) return; // Only update the currently active tab
                var el = document.getElementById("tab-" + kind);
                if (!el || count <= 0) return;
                var base =
                    { ep: "剧集", chars: "角色", persons: "制作人员" }[kind] ||
                    "";
                el.textContent = base + " (" + count + ")";
            }

            async function render() {
                try {
                    var s = await api("/v0/subjects/" + SID);
                    if (!s) {
                        document.getElementById("view").innerHTML =
                            '<p class="text-sub text-center py-20">未找到</p>';
                        return;
                    }
                    await loadPersonMap();
                    var infoItems = infoboxData(s);
                    var hdr = document.getElementById("subject-header");
                    hdr.innerHTML =
                        '<div class="max-w-[1200px] mx-auto px-6 h-12 py-0 flex items-center gap-3">' +
                        '<a href="javascript:history.back()" class="w-7 h-7 rounded-full border border-bord-strong flex items-center justify-center text-sub hover:text-text hover:border-bord-xstrong shrink-0 no-underline text-xs" title="返回">←</a>' +
                        (isRemote("/v0/subjects/" + SID)
                            ? globeIcon("w-6 h-6")
                            : "") +
                        (s.nsfw
                            ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-warn-bg text-warn shrink-0">NSFW</span>'
                            : "") +
                        '<span class="text-xl font-bold truncate">' +
                        primaryName(s.name, s.name_cn) +
                        "</span>" +
                        (function () {
                            var sub = subName(s.name, s.name_cn);
                            return sub
                                ? '<span class="text-sm text-sub truncate hidden sm:inline">' +
                                      sub +
                                      "</span>"
                                : "";
                        })() +
                        (s.platform
                            ? '<span class="text-sub text-xs shrink-0">｜</span><span class="text-xs text-sub shrink-0">' +
                              s.platform +
                              "</span>"
                            : "") +
                        '<span class="text-sub text-xs shrink-0">｜</span><span class="text-xs text-sub shrink-0">ID: ' +
                        SID +
                        "</span>" +
                        '<span class="flex-1"></span>' +
                        '<span class="flex gap-0 shrink-0 ml-2">' +
                        tabsHtml() +
                        "</span></div>";
                    if (tab === "overview") await overview(s, infoItems);
                    else if (tab === "ep") await episodes();
                    else if (tab === "chars") await characters();
                    else if (tab === "persons") await personsList();
                } catch (e) {
                    document.getElementById("view").innerHTML =
                        '<p class="text-sub text-center py-20">渲染出错: ' +
                        e.message +
                        "</p>";
                }
            }

            async function overview(s, infoItems) {
                var epsRaw = await api("/v0/episodes?subject_id=" + SID);
                var charsRaw = await api("/v0/subjects/" + SID + "/characters");
                var relsRaw = await api("/v0/subjects/" + SID + "/subjects");
                var eloData = await api("/v0/elo/ranking");
                var eps = Array.isArray(epsRaw)
                    ? epsRaw
                    : epsRaw && epsRaw.data
                      ? epsRaw.data
                      : [];
                var chars = Array.isArray(charsRaw)
                    ? charsRaw
                    : charsRaw && charsRaw.data
                      ? charsRaw.data
                      : [];
                var rels = Array.isArray(relsRaw)
                    ? relsRaw
                    : relsRaw && relsRaw.data
                      ? relsRaw.data
                      : [];
                var eloInfo = null;
                if (eloData && eloData.entries) {
                    for (var i = 0; i < eloData.entries.length; i++) {
                        if (eloData.entries[i].id == SID) {
                            eloInfo = eloData.entries[i];
                            break;
                        }
                    }
                }
                epCount = eps.length;
                charCount = chars.length;
                updateTabCount("ep", epCount);
                updateTabCount("chars", charCount);
                // Load persons count asynchronously
                api("/v0/subjects/" + SID + "/persons").then(function (pRaw) {
                    var p = Array.isArray(pRaw)
                        ? pRaw
                        : pRaw && pRaw.data
                          ? pRaw.data
                          : [];
                    persCount = p.length;
                    updateTabCount("persons", persCount);
                });

                var mainChars = chars
                    .filter(function (c) {
                        return c.relation === "主角" || c.relation === "配角";
                    })
                    .slice(0, 12);

                // Episode grid — sorted by sort, inline type separators
                var epGrid = "";
                var allEps = eps.slice().sort(function (a, b) {
                    var ta = a.type || 0,
                        tb = b.type || 0;
                    if (ta !== tb) return ta - tb;
                    return (a.sort || 0) - (b.sort || 0);
                });
                if (allEps.length) {
                    var epCls = {
                        0: "bg-surface-alt text-sub",
                        1: "bg-tier-gold-bg text-tier-gold",
                        2: "bg-tier-blue-bg text-tier-blue",
                        3: "bg-tier-purple-bg text-tier-purple",
                        4: "bg-tier-green-bg text-tier-green",
                        5: "bg-pink-bg text-pink",
                        6: "bg-surface-alt text-sub"
                    };
                    var sepCls = {
                        1: "text-tier-gold",
                        2: "text-tier-blue",
                        3: "text-tier-purple",
                        4: "text-tier-green",
                        5: "text-pink",
                        6: "text-sub"
                    };
                    var lastType = -1;
                    epGrid += '<div class="flex flex-wrap gap-1.5">';
                    for (var i = 0; i < allEps.length; i++) {
                        var e = allEps[i];
                        var t = e.type || 0;
                        if (t !== lastType && t !== 0) {
                            // Type marker cell with vertical line + label
                            var sepGap = "gap-1",
                                sepText = "text-[9px]";
                            if (t >= 1 && t <= 3) {
                                sepGap = "gap-1.5";
                                sepText = "text-[14px]";
                            } else if (t === 4 || t === 6) {
                                sepGap = "gap-1";
                                sepText = "text-[12px]";
                            } else if (t === 5) {
                                sepGap = "gap-0.5";
                                sepText = "text-[10px]";
                            }
                            epGrid +=
                                '<span class="w-8 h-8 flex items-center pl-0 font-semibold cursor-default ' +
                                sepGap +
                                " " +
                                sepText +
                                " " +
                                (sepCls[t] || "text-sub") +
                                '"><span class="border-l border-current h-7"></span>' +
                                MSG.epTypes[t] +
                                "</span>";
                        }
                        lastType = t;
                        var epNum = String(Math.floor(e.sort || e.ep || 0));
                        var num = epNum.padStart(2, "0");
                        var cls = epCls[t];
                        var epName = primaryName(e.name, e.name_cn);
                        var epSub = subName(e.name, e.name_cn);
                        epGrid +=
                            '<div class="relative group">' +
                            '<span class="w-8 h-8 flex items-center justify-center rounded text-xs font-semibold cursor-default ' +
                            cls +
                            '">' +
                            num +
                            "</span>" +
                            '<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 hidden group-hover:block z-50">' +
                            '<div class="bg-surface-raised border border-bord-strong rounded-lg px-3 py-2 text-xs whitespace-nowrap shadow-lg">' +
                            '<div class="text-sub">第 ' +
                            epNum +
                            " 话 · " +
                            (MSG.epTypes[t] || "") +
                            "</div>" +
                            '<div class="text-sm font-semibold mt-1">' +
                            epName +
                            "</div>" +
                            (epSub
                                ? '<div class="text-sub mt-0.5">' +
                                  epSub +
                                  "</div>"
                                : "") +
                            (e.airdate
                                ? '<div class="text-sub mt-1">首播: ' +
                                  e.airdate +
                                  "</div>"
                                : "") +
                            (e.duration
                                ? '<div class="text-sub">时长: ' +
                                  e.duration +
                                  "</div>"
                                : "") +
                            "</div></div></div>";
                    }
                    epGrid += "</div>";
                }

                // Tags
                var tagsHtml = "";
                if (s.tags && s.tags.length) {
                    var shown = s.tags.slice(0, 20);
                    tagsHtml = '<div class="flex flex-wrap gap-x-2 gap-y-1">';
                    for (var i = 0; i < shown.length; i++) {
                        tagsHtml +=
                            '<a href="/tag?tag=' +
                            encodeURIComponent(shown[i].name) +
                            '" class="no-underline bg-surface-alt rounded-full px-2.5 py-0.5 text-[14px] text-sub border border-transparent hover:border-pink hover:bg-elo-bg transition-all">' +
                            shown[i].name +
                            '<small class="text-xs text-sub ml-1">' +
                            shown[i].count +
                            "</small></a>";
                    }
                    tagsHtml += "</div>";
                }

                // Rating histogram — vertical bars with hover tooltip
                var histHtml = "";
                var cnt = s.rating && s.rating.count;
                if (cnt) {
                    var totalVotes = 0;
                    for (var k in cnt) {
                        totalVotes += cnt[k];
                    }
                    var max = 1;
                    for (var k2 in cnt) {
                        if (cnt[k2] > max) max = cnt[k2];
                    }
                    histHtml =
                        '<div class="flex items-end gap-px mt-2" style="height:80px">';
                    for (var i = 10; i >= 1; i--) {
                        var v = cnt[String(i)] || 0;
                        var h = Math.max((v / max) * 100, 4);
                        var pct =
                            totalVotes > 0
                                ? ((v / totalVotes) * 100).toFixed(1)
                                : "0.0";
                        histHtml +=
                            '<div class="flex-1 flex flex-col items-center justify-end group relative" style="height:100%">' +
                            '<span class="block w-full bg-pink rounded-t-sm group-hover:bg-pink transition-colors" style="height:' +
                            h +
                            '%"></span>' +
                            '<div class="absolute bottom-full mb-1 hidden group-hover:block z-50">' +
                            '<div class="bg-surface-raised border border-bord-strong rounded-lg px-2 py-1 text-xs whitespace-nowrap shadow-lg">' +
                            pct +
                            "% · " +
                            v +
                            " 人</div></div>" +
                            "</div>";
                    }
                    histHtml += "</div>";
                    histHtml += '<div class="flex gap-px mt-0.5">';
                    for (var j = 10; j >= 1; j--) {
                        histHtml +=
                            '<span class="flex-1 text-center text-[10px] text-sub">' +
                            j +
                            "</span>";
                    }
                    histHtml += "</div>";
                    // Standard deviation
                    var mean = (s.rating && s.rating.score) || 0;
                    var sumSq = 0;
                    for (var k3 = 1; k3 <= 10; k3++) {
                        var c = cnt[String(k3)] || 0;
                        sumSq += c * (k3 - mean) * (k3 - mean);
                    }
                    var stddev =
                        totalVotes > 0
                            ? Math.sqrt(sumSq / totalVotes).toFixed(4)
                            : "-";
                    histHtml +=
                        '<div class="text-xs text-sub text-center mt-2">标准差: ' +
                        stddev +
                        "</div>";
                }

                // Infobox entries
                var infoHtml = "";
                for (var i = 0; i < infoItems.length; i++) {
                    infoHtml +=
                        '<div class="py-1 border-b border-bord-light text-[14px]' +
                        (infoItems[i][2] ? " ml-4" : "") +
                        '"><span class="text-sub">' +
                        (infoItems[i][0] ? infoItems[i][0] + ": " : "") +
                        "</span><span>" +
                        infoItems[i][1] +
                        "</span></div>";
                }

                // Rating panel
                var scoreHtml =
                    s.rating && s.rating.score
                        ? s.rating.score.toFixed(1)
                        : "-";
                var totalHtml = s.rating && s.rating.total ? s.rating.total : 0;
                var rankHtml =
                    s.rating && s.rating.rank ? "#" + s.rating.rank : "-";

                // ── 整体布局：左右两栏 ──
                var html = '<div class="flex flex-col md:flex-row gap-6">';

                // ── 左栏：海报 + infobox ──
                html += '<div class="w-full md:w-[260px] shrink-0">';
                html +=
                    '<img src="' +
                    img("subject", SID, "large") +
                    '" ' +
                    imgOnError("subject", SID, "large") +
                    ' class="w-full rounded-xl">';
                if (infoHtml)
                    html +=
                        '<div class="mt-3 flex flex-col gap-0.5">' +
                        infoHtml +
                        "</div>";
                html += "</div>";

                // ── 右栏 ──
                html += '<div class="flex-1 min-w-0 flex flex-col gap-5">';

                // ── 右上栏：左（剧集 + 简介 + 标签）| 右（评分）──
                html += '<div class="flex flex-col md:flex-row gap-5">';
                html += '<div class="flex-1 min-w-0">';
                if (epGrid)
                    html +=
                        '<div class="mb-4"><div class="flex items-center gap-2 mb-2"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">剧集</span>' +
                        (isRemote("/v0/episodes?subject_id=" + SID)
                            ? globeIcon("w-4 h-4")
                            : "") +
                        '<span class="text-xs text-sub">(' +
                        eps.length +
                        ")</span></div>" +
                        epGrid +
                        "</div>";
                html +=
                    '<div class="flex items-center gap-2 mb-2"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">简介</span></div>';
                html +=
                    '<p class="text-[14px] leading-relaxed text-sub mb-4">' +
                    formatSummary(s.summary || "暂无简介") +
                    "</p>";
                if (tagsHtml)
                    html +=
                        '<div class="mb-2"><div class="flex items-center gap-2 mb-2"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">标签</span></div>' +
                        tagsHtml +
                        "</div>";
                html += "</div>";
                // ── 右上右栏：评分面板 ──
                html +=
                    '<div class="w-full md:w-[230px] shrink-0 self-start bg-surface-alt border border-bord rounded-xl">';
                // Header strip
                html +=
                    '<div class="bg-surface-alt px-4 py-2 rounded-t-xl"><span class="font-bold">评分</span></div>';
                html += '<div class="border-t border-bord-mid"></div>';
                // Content
                html += '<div class="px-4 pt-2 pb-2">';
                if (eloInfo && eloInfo.rating) {
                    html +=
                        '<div class="text-xs text-sub text-center">ELO Rating</div>';
                    html +=
                        '<div class="flex items-baseline justify-center"><span class="text-3xl font-bold">' +
                        Math.round(eloInfo.rating) +
                        '</span><span class="text-xs text-sub ml-1">' +
                        (eloInfo.rank_pct || 0).toFixed(1) +
                        "%</span></div>";
                    html +=
                        '<div class="border-t border-bord mt-2 mb-2"></div>';
                }
                html +=
                    '<div class="text-xs text-sub text-center">BGM Rank</div>';
                html +=
                    '<div class="flex items-baseline justify-center"><span class="text-3xl font-bold">' +
                    scoreHtml +
                    '</span><span class="text-xs text-sub ml-1">/ 10</span></div>';
                html +=
                    '<div class="text-xs text-sub text-center mt-1">' +
                    totalHtml +
                    " 人评分 · 排名 " +
                    rankHtml +
                    "</div>";
                if (histHtml)
                    html +=
                        '<div class="border-t border-bord mt-3 mb-1"></div>';
                if (histHtml) html += "<div>" + histHtml + "</div>";
                html += "</div>";
                html += "</div>";
                html += "</div>";

                // ── 右下栏：主要角色 + 关联条目 ──
                if (mainChars.length) {
                    html +=
                        '<div><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">主要角色</span>' +
                        (isRemote("/v0/subjects/" + SID + "/characters")
                            ? globeIcon("w-4 h-4")
                            : "") +
                        '<a href="javascript:switchTab(\'chars\')" class="text-pink text-xs ml-auto no-underline">更多角色 &raquo;</a></div>';
                    html +=
                        '<div class="flex gap-3 overflow-x-auto pb-2 thin-scroll" style="padding-top:4px">';
                    for (var i = 0; i < mainChars.length; i++) {
                        var c = mainChars[i];
                        var actorName =
                            c.actors && c.actors.length ? c.actors[0].name : "";
                        html +=
                            "<div onclick=\"location.href='/character?id=" +
                            c.id +
                            '\'" class="shrink-0 w-[96px] cursor-pointer group rounded-lg hover:-translate-y-1 transition-transform">' +
                            // Image with floating badge
                            '<div class="relative rounded-lg overflow-hidden bg-surface" style="aspect-ratio:1/1.414">' +
                            '<img src="' +
                            img("character", c.id, "small") +
                            '" ' +
                            imgOnError("character", c.id, "small") +
                            ' class="w-full h-full object-cover object-top">' +
                            '<span class="absolute top-1 right-1 bg-black/60 text-white px-1.5 py-0.5 rounded text-[10px] font-semibold">' +
                            c.relation +
                            "</span>" +
                            "</div>" +
                            // Name + CV
                            '<div class="mt-1.5 px-0.5">' +
                            '<div class="text-[13px] font-semibold truncate">' +
                            primaryName(c.name, "") +
                            "</div>" +
                            (actorName
                                ? '<div class="text-[11px] text-sub truncate">CV: ' +
                                  actorName +
                                  "</div>"
                                : "") +
                            "</div></div>";
                    }
                    html += "</div></div>";
                }

                if (rels.length) {
                    // Sort by type priority: 续→番外→书→游戏→其他, same types cluster
                    function relPriority(r) {
                        if (!r) return 99;
                        if (r.indexOf("续") !== -1) return 0;
                        if (r.indexOf("番外") !== -1) return 1;
                        if (r.indexOf("书") !== -1) return 2;
                        if (r.indexOf("游戏") !== -1) return 3;
                        return 99;
                    }
                    rels.sort(function (a, b) {
                        var pa = relPriority(a.relation),
                            pb = relPriority(b.relation);
                        if (pa !== pb) return pa - pb;
                        var ra = a.relation || "",
                            rb = b.relation || "";
                        if (ra < rb) return -1;
                        if (ra > rb) return 1;
                        return 0;
                    });
                    html +=
                        '<div><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">关联条目</span>' +
                        (isRemote("/v0/subjects/" + SID + "/subjects")
                            ? globeIcon("w-4 h-4")
                            : "") +
                        '</div><div class="flex items-start gap-3 overflow-x-auto pb-2 thin-scroll" style="padding-top:4px">';
                    var relLastRel = "";
                    for (var i = 0; i < rels.length; i++) {
                        var r = rels[i];
                        var rel = r.relation || "";
                        if (relLastRel !== "" && rel !== relLastRel) {
                            html +=
                                '<div class="border-l border-bord self-stretch shrink-0 -mx-1"></div>';
                        }
                        relLastRel = rel;
                        html +=
                            "<div onclick=\"location.href='/subject?id=" +
                            r.id +
                            '\'" class="shrink-0 w-[96px] cursor-pointer group rounded-lg hover:-translate-y-1 transition-transform">' +
                            // Image with floating badge
                            '<div class="relative rounded-lg overflow-hidden bg-surface aspect-square">' +
                            '<img src="' +
                            img("subject", r.id, "small") +
                            '" ' +
                            imgOnError("subject", r.id, "small") +
                            ' class="w-full h-full object-cover">' +
                            (r.relation
                                ? '<span class="absolute top-1 right-1 bg-black/60 text-white px-1.5 py-0.5 rounded text-[10px] font-semibold">' +
                                  r.relation +
                                  "</span>"
                                : "") +
                            "</div>" +
                            // Title
                            '<div class="mt-1.5 px-0.5">' +
                            '<div class="text-[13px] font-semibold line-clamp-3">' +
                            (r.name_cn || r.name || "#" + r.id) +
                            "</div>" +
                            "</div></div>";
                    }
                    html += "</div></div>";
                }

                html += "</div></div>";

                document.getElementById("view").innerHTML = html;
            }

            async function episodes() {
                var epsRaw = await api("/v0/episodes?subject_id=" + SID);
                var eps = Array.isArray(epsRaw)
                    ? epsRaw
                    : epsRaw && epsRaw.data
                      ? epsRaw.data
                      : [];
                var types = MSG.epTypes;

                function epRows(list, label) {
                    if (!list.length) return "";
                    // Build individual episode cards
                    var cards = [];
                    for (var i = 0; i < list.length; i++) {
                        var e = list[i];
                        var epName = primaryName(e.name, e.name_cn);
                        var epSub = subName(e.name, e.name_cn);
                        var desc = e.desc
                            ? linkifyPerson(e.desc).replace(
                                  /\r\n|\n|\\n|\\r\\n/g,
                                  "<br>"
                              )
                            : "";
                        cards.push(
                            '<div class="border-t border-bord-light py-3">' +
                                '<div class="flex items-baseline gap-2"><span class="text-pink text-sm font-bold w-8 shrink-0">' +
                                (e.type === 0
                                    ? String(
                                          Math.floor(e.sort || e.ep || 0)
                                      ).padStart(2, "0")
                                    : types[e.type]) +
                                '</span><span class="font-semibold text-[14px]">' +
                                epName +
                                "</span>" +
                                (epSub
                                    ? '<span class="text-xs text-sub">' +
                                      epSub +
                                      "</span>"
                                    : "") +
                                "</div>" +
                                '<div class="text-xs text-sub mt-1 ml-10">' +
                                (e.airdate ? "首播: " + e.airdate : "") +
                                (e.airdate && e.duration ? " ｜ " : "") +
                                (e.duration ? "时长: " + e.duration : "") +
                                "</div>" +
                                (desc
                                    ? '<div class="text-[13px] text-sub mt-1 ml-10 leading-relaxed">' +
                                      desc +
                                      "</div>"
                                    : "") +
                                "</div>"
                        );
                    }
                    // Pair into 2-column rows
                    var html =
                        '<div class="mb-6"><div class="text-sm text-sub font-semibold mb-3">' +
                        label +
                        "</div>";
                    for (var i = 0; i < cards.length; i += 2) {
                        html +=
                            '<div class="flex gap-4">' +
                            '<div class="flex-1 min-w-0">' +
                            cards[i] +
                            "</div>" +
                            '<div class="flex-1 min-w-0">' +
                            (cards[i + 1] || "") +
                            "</div>" +
                            "</div>";
                    }
                    html += "</div>";
                    return html;
                }

                epCount = eps.length;
                updateTabCount("ep", epCount);
                var sorted = eps.slice().sort(function (a, b) {
                    var ta = a.type || 0,
                        tb = b.type || 0;
                    if (ta !== tb) return ta - tb;
                    return (a.sort || 0) - (b.sort || 0);
                });
                var main = sorted.filter(function (e) {
                    return e.type === 0;
                });
                var sp = sorted.filter(function (e) {
                    return e.type !== 0;
                });

                document.getElementById("view").innerHTML =
                    epRows(main, "本篇 (" + main.length + ")") +
                    epRows(sp, "SP / 其他 (" + sp.length + ")");
            }

            async function characters() {
                var charsRaw = await api("/v0/subjects/" + SID + "/characters");
                var chars = Array.isArray(charsRaw) ? charsRaw : [];
                charCount = chars.length;
                updateTabCount("chars", charCount);
                window._chars = chars;

                // Build dynamic filter list from relation fields
                var relSet = {};
                for (var i = 0; i < chars.length; i++) {
                    var rel = chars[i].relation || "其他";
                    relSet[rel] = (relSet[rel] || 0) + 1;
                }
                var relKeys = Object.keys(relSet);
                var curFilter = "all";

                function filterBar(active) {
                    curFilter = active;
                    var html = '<div class="flex flex-wrap gap-1.5 mb-3">';
                    html +=
                        '<span onclick="window.filterChars(\'all\')" class="px-3 py-1 rounded-full text-xs cursor-pointer ' +
                        (active === "all"
                            ? "bg-pink text-white"
                            : "bg-surface-alt text-sub hover:text-text") +
                        '">全部 (' +
                        chars.length +
                        ")</span>";
                    for (var k = 0; k < relKeys.length; k++) {
                        var rk = relKeys[k];
                        html +=
                            "<span onclick=\"window.filterChars('" +
                            rk +
                            '\')" class="px-3 py-1 rounded-full text-xs cursor-pointer ' +
                            (active === rk
                                ? "bg-pink text-white"
                                : "bg-surface-alt text-sub hover:text-text") +
                            '">' +
                            rk +
                            " (" +
                            relSet[rk] +
                            ")</span>";
                    }
                    html += "</div>";
                    return html;
                }

                function renderCharList(list) {
                    var cards = [];
                    for (var i = 0; i < list.length; i++) {
                        var c = list[i];
                        var actorsHtml = "";
                        if (c.actors && c.actors.length) {
                            actorsHtml =
                                '<div class="flex gap-3 overflow-x-auto mt-2 thin-scroll" style="max-width:100%">';
                            for (var j = 0; j < c.actors.length; j++) {
                                var a = c.actors[j];
                                actorsHtml +=
                                    '<div class="flex items-center gap-2 cursor-pointer hover:opacity-80 shrink-0" onclick="event.stopPropagation();location.href=\'/person?id=' +
                                    a.id +
                                    "'\">" +
                                    '<img src="' +
                                    img("person", a.id, "grid") +
                                    '" ' +
                                    imgOnError("person", a.id, "grid") +
                                    ' class="w-8 h-8 rounded-lg object-cover bg-surface shrink-0">' +
                                    '<div class="shrink-0"><div class="text-[13px] font-semibold hover:text-pink">' +
                                    a.name +
                                    '</div><div class="text-[11px] text-sub">CV</div></div></div>';
                            }
                            actorsHtml += "</div>";
                        }
                        var infoExtra = "";
                        if (c.gender)
                            infoExtra +=
                                '<span class="text-[12px] text-sub">性别:' +
                                c.gender +
                                "</span> ";
                        if (c.infobox) {
                            try {
                                var d = JSON.parse(c.infobox);
                                for (var j = 0; j < d.length; j++) {
                                    if (
                                        d[j].key === "生日" ||
                                        d[j].key === "身高"
                                    )
                                        infoExtra +=
                                            '<span class="text-[12px] text-sub">' +
                                            d[j].value +
                                            "</span> ";
                                }
                            } catch (e) {}
                        }
                        cards.push(
                            '<div class="border-t border-bord-light" style="height:128px">' +
                                '<div class="flex items-center gap-3 h-full">' +
                                '<img src="' +
                                img("character", c.id, "small") +
                                '" ' +
                                imgOnError("character", c.id, "small") +
                                ' class="shrink-0 rounded object-cover bg-surface cursor-pointer" style="width:80px;aspect-ratio:1/1.414" onclick="location.href=\'/character?id=' +
                                c.id +
                                "'\">" +
                                '<div class="flex-1 min-w-0 py-2 ml-1">' +
                                '<div class="font-semibold text-[14px] cursor-pointer hover:text-pink inline-block truncate" onclick="location.href=\'/character?id=' +
                                c.id +
                                "'\">" +
                                c.name +
                                "</div>" +
                                '<div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-0.5"><span class="bg-pink text-white px-1.5 py-px rounded text-[11px] font-semibold">' +
                                c.relation +
                                "</span>" +
                                infoExtra +
                                "</div>" +
                                (actorsHtml || "") +
                                "</div></div></div>"
                        );
                    }
                    // Paired 2-column layout
                    var html = "";
                    for (var i = 0; i < cards.length; i += 2) {
                        html +=
                            '<div class="flex gap-4">' +
                            '<div class="flex-1 min-w-0">' +
                            cards[i] +
                            "</div>" +
                            '<div class="flex-1 min-w-0">' +
                            (cards[i + 1] || "") +
                            "</div>" +
                            "</div>";
                    }
                    return html;
                }

                document.getElementById("view").innerHTML =
                    filterBar("all") +
                    '<div id="char-list">' +
                    renderCharList(chars) +
                    "</div>";

                window.filterChars = function (rel) {
                    var list =
                        rel === "all"
                            ? window._chars
                            : window._chars.filter(function (c) {
                                  return c.relation === rel;
                              });
                    document.getElementById("view").innerHTML =
                        filterBar(rel) +
                        '<div id="char-list">' +
                        renderCharList(list) +
                        "</div>";
                };
            }

            async function personsList() {
                var personsRaw = await api("/v0/subjects/" + SID + "/persons");
                var persons = Array.isArray(personsRaw) ? personsRaw : [];
                persCount = persons.length;
                updateTabCount("persons", persCount);
                var groups = {};
                for (var i = 0; i < persons.length; i++) {
                    var key = persons[i].relation || "其他";
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(persons[i]);
                }
                var entries = Object.entries(groups);

                var sideLinks =
                    '<div class="bg-surface-alt rounded-lg overflow-hidden"><div class="p-3 max-h-[calc(100vh-14rem)] overflow-y-auto thin-scroll">';
                for (var i = 0; i < entries.length; i++) {
                    sideLinks +=
                        '<a href="#g-' +
                        entries[i][0] +
                        '" class="text-sub text-xs no-underline block py-0.5 hover:text-text">' +
                        entries[i][0] +
                        " (" +
                        entries[i][1].length +
                        ")</a>";
                }
                sideLinks += "</div></div>";

                var mainHtml = "";
                for (var i = 0; i < entries.length; i++) {
                    var k = entries[i][0],
                        v = entries[i][1];
                    // 2-column grid for names within each section
                    var nameHtml =
                        '<div class="grid grid-cols-2 gap-x-4 gap-y-0.5">';
                    for (var j = 0; j < v.length; j++) {
                        var p = v[j];
                        nameHtml +=
                            "<div onclick=\"location.href='/person?id=" +
                            p.id +
                            '\'" class="flex items-center gap-2 py-1 border-b border-bord-light cursor-pointer hover:text-pink text-sm truncate">' +
                            p.name +
                            (p.eps
                                ? '<span class="text-xs text-sub ml-1 shrink-0">(' +
                                  p.eps +
                                  ")</span>"
                                : "") +
                            "</div>";
                    }
                    nameHtml += "</div>";
                    mainHtml +=
                        '<div class="mb-4 bg-surface-alt rounded-lg p-3" id="g-' +
                        k +
                        '" style="break-inside:avoid"><div class="flex items-center gap-2 mb-2"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">' +
                        k +
                        '</span><span class="text-xs text-sub">(' +
                        v.length +
                        ")</span></div>" +
                        nameHtml +
                        "</div>";
                }

                document.getElementById("view").innerHTML =
                    '<div class="flex gap-6"><div class="flex-1" style="column-count:2;column-gap:1.5rem">' +
                    mainHtml +
                    '</div><div class="w-[140px] shrink-0 hidden md:block sticky top-44 self-start">' +
                    sideLinks +
                    "</div></div>";
            }

            render();
        </script>
    </body>
</html>
