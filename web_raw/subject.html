<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>动画详情 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .line-clamp-3 {
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .ep-tip {
                transition: opacity 0.15s ease;
                pointer-events: auto;
            }
            .ep-close {
                position: absolute;
                top: 4px;
                right: 4px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                border: none;
                background: rgba(128, 128, 128, 0.3);
                color: rgba(128, 128, 128, 0.8);
                font-size: 13px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .ep-close:hover {
                background: rgba(128, 128, 128, 0.5);
                color: #fff;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div class="sticky top-0 z-50">
            <div id="topbar"></div>
            <div
                id="subject-header"
                class="bg-surface-raised border-b border-bord"
            ></div>
        </div>
        <main id="view" class="max-w-[1200px] mx-auto p-6"></main>

        <div
            id="confirm-overlay"
            class="fixed inset-0 bg-black/70 flex items-center justify-center z-[400] transition-opacity duration-200"
            style="display: none; opacity: 0"
        >
            <div
                class="bg-surface-alt border border-bord rounded-lg p-5 w-[340px] max-w-[85vw]"
                role="dialog"
                aria-modal="true"
                aria-labelledby="confirm-msg"
            >
                <p
                    id="confirm-msg"
                    class="text-sm mb-4 leading-relaxed whitespace-pre-line"
                ></p>
                <button
                    id="btn-confirm-exec"
                    class="h-10 w-full px-4 py-2 rounded-lg bg-pink-solid text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90 mb-2"
                >
                    执行
                </button>
                <button
                    id="btn-confirm-cancel"
                    class="h-10 w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active"
                >
                    取消
                </button>
            </div>
        </div>

        <script src="assets/app.min.js"></script>
        <script type="module" src="assets/subject.js"></script>
        <script>
            var SID = new URLSearchParams(location.search).get("id");
            var tab =
                new URLSearchParams(location.search).get("tab") || "overview";
            var epCount = 0,
                charCount = 0,
                persCount = 0;
            var _myColl = null;
            var _myCollLoaded = false;

            function exportSubjectBundle() {
                if (!SID) return;
                confirmAction(
                    "导出 #" + SID + " 的本地数据包？",
                    async function () {
                        var btn = document.getElementById("btn-export-bundle");
                        if (btn) btn.disabled = true;
                        showInfo("正在导出数据包...");
                        try {
                            var res = await fetch(API + "/v0/bundle/export", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    source: "ids",
                                    ids: [parseInt(SID, 10)]
                                })
                            });
                            var d = await readJSON(res);
                            if (!res.ok || !d) {
                                showError(errText(d, res.status));
                                return;
                            }
                            showSuccess(
                                "已导出 " +
                                    escapeHtml(d.filename) +
                                    "<br><span class='text-xs'>路径：" +
                                    escapeHtml(d.path) +
                                    "</span>"
                            );
                        } catch (e) {
                            showError("导出失败");
                        } finally {
                            if (btn) btn.disabled = false;
                        }
                    }
                );
            }

            async function loadMyCollection() {
                if (_myCollLoaded) return _myColl;
                _myCollLoaded = true;
                if (!window.USERNAME || !SID) return null;
                try {
                    var d = await api(
                        "/v0/users/" +
                            window.USERNAME +
                            "/collections?view=summary"
                    );
                    if (!d || !d.data) return null;
                    for (var i = 0; i < d.data.length; i++) {
                        if (String(d.data[i].subject_id) !== String(SID)) {
                            continue;
                        }
                        _myColl = {
                            type: d.data[i].type,
                            rate: d.data[i].rate
                        };
                        break;
                    }
                } catch (_) {}
                return _myColl;
            }

            function switchTab(t) {
                tab = t;
                history.replaceState({}, "", "?id=" + SID + "&tab=" + t);
                updateHeader();
                render();
            }

            var _subject = null;

            function updateHeader() {
                if (!_subject) return;
                window.dispatchEvent(
                    new CustomEvent("seshat:subject-header", {
                        detail: {
                            subject: _subject,
                            sid: SID,
                            tab: tab,
                            counts: {
                                ep: epCount,
                                chars: charCount,
                                persons: persCount
                            },
                            showBundle: resolve("bundle") !== "hidden"
                        }
                    })
                );
            }

            async function render() {
                try {
                    var s = await api("/v0/subjects/" + SID);
                    if (!s) {
                        document.getElementById("view").innerHTML =
                            '<div class="select-text fade-in">' +
                            '<p class="text-sub text-center py-20">未找到</p>';
                        return;
                    }
                    _subject = s;
                    await loadPersonMap();
                    var infoItems = infoboxData(s);
                    updateHeader();
                    var myColl = await loadMyCollection();
                    if (tab === "overview")
                        await overview(s, infoItems, myColl);
                    else if (tab === "ep") await episodes();
                    else if (tab === "chars") await characters();
                    else if (tab === "persons") await personsList();
                } catch (e) {
                    document.getElementById("view").innerHTML =
                        '<div class="select-text fade-in">' +
                        '<p class="text-sub text-center py-20">渲染出错: ' +
                        e.message +
                        "</p>";
                }
            }

            async function overview(s, infoItems, myColl) {
                var myRate =
                    myColl && myColl.rate > 0 ? Number(myColl.rate) : 0;
                var myType = myColl ? COLL_TYPES[myColl.type] || "" : "";
                var epsRaw = await api("/v0/episodes?subject_id=" + SID);
                var charsRaw = await api("/v0/subjects/" + SID + "/characters");
                var relsRaw = await api("/v0/subjects/" + SID + "/subjects");
                var eloData = await apiFor("elo", "/v0/elo/ranking");
                var eps = Array.isArray(epsRaw)
                    ? epsRaw
                    : epsRaw && epsRaw.data
                      ? epsRaw.data
                      : [];
                var chars = Array.isArray(charsRaw)
                    ? charsRaw
                    : charsRaw && charsRaw.data
                      ? charsRaw.data
                      : [];
                var rels = Array.isArray(relsRaw)
                    ? relsRaw
                    : relsRaw && relsRaw.data
                      ? relsRaw.data
                      : [];
                var eloInfo = null;
                if (eloData && eloData.data) {
                    for (var i = 0; i < eloData.data.length; i++) {
                        if (eloData.data[i].id == SID) {
                            eloInfo = eloData.data[i];
                            break;
                        }
                    }
                }
                epCount = eps.length;
                charCount = chars.length;
                updateHeader();
                api("/v0/subjects/" + SID + "/persons").then(function (pRaw) {
                    var p = Array.isArray(pRaw)
                        ? pRaw
                        : pRaw && pRaw.data
                          ? pRaw.data
                          : [];
                    persCount = p.length;
                    updateHeader();
                });
                var mainChars = chars
                    .filter(function (c) {
                        return c.relation === "主角" || c.relation === "配角";
                    })
                    .slice(0, 12);
                document.getElementById("view").innerHTML =
                    '<div id="subject-overview"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:subject-overview", {
                        detail: {
                            subject: s,
                            infoItems: infoItems,
                            myRate: myRate,
                            myType: myType,
                            hasColl: !!myColl,
                            eloInfo: eloInfo,
                            eps: eps,
                            mainChars: mainChars,
                            rels: rels
                        }
                    })
                );
            }

            var _epPinned = null;
            function initEpTooltips() {
                var cells = document.querySelectorAll(".ep-cell");
                for (var i = 0; i < cells.length; i++) {
                    (function (cell) {
                        var tip = cell.querySelector(".ep-tip");
                        var num = cell.querySelector(".ep-num");
                        if (!tip || !num) return;
                        function show() {
                            if (_epPinned && _epPinned !== cell) return;
                            tip.style.display = "block";
                            requestAnimationFrame(function () {
                                tip.style.opacity = "1";
                            });
                        }
                        function hide() {
                            if (_epPinned === cell) return;
                            tip.style.opacity = "0";
                            setTimeout(function () {
                                if (_epPinned !== cell)
                                    tip.style.display = "none";
                            }, 150);
                        }
                        function unpin(c) {
                            if (_epPinned === c) _epPinned = null;
                            var n = c.querySelector(".ep-num");
                            var t = c.querySelector(".ep-tip");
                            if (n) n.classList.remove("ring-1", "ring-pink");
                            if (t) {
                                t.style.opacity = "0";
                                setTimeout(function () {
                                    t.style.display = "none";
                                }, 150);
                            }
                            var cb = t && t.querySelector(".ep-close");
                            if (cb) cb.remove();
                        }
                        num.addEventListener("click", function (e) {
                            e.stopPropagation();
                            if (_epPinned === cell) {
                                unpin(cell);
                                return;
                            }
                            if (_epPinned) unpin(_epPinned);
                            _epPinned = cell;
                            num.classList.add("ring-1", "ring-pink");
                            tip.style.display = "block";
                            tip.style.opacity = "1";
                            if (!tip.querySelector(".ep-close")) {
                                var closeBtn = document.createElement("button");
                                closeBtn.className = "ep-close";
                                closeBtn.textContent = "×";
                                closeBtn.onclick = function (ev) {
                                    ev.stopPropagation();
                                    unpin(cell);
                                };
                                tip.firstElementChild.appendChild(closeBtn);
                            }
                        });
                        num.addEventListener("keydown", function (e) {
                            if (e.key !== "Enter" && e.key !== " ") return;
                            e.preventDefault();
                            num.click();
                        });
                        cell.addEventListener("mouseenter", show);
                        cell.addEventListener("mouseleave", hide);
                    })(cells[i]);
                }
            }

            async function episodes() {
                var epsRaw = await api("/v0/episodes?subject_id=" + SID);
                var eps = Array.isArray(epsRaw)
                    ? epsRaw
                    : epsRaw && epsRaw.data
                      ? epsRaw.data
                      : [];
                epCount = eps.length;
                updateHeader();
                document.getElementById("view").innerHTML =
                    '<div id="subject-episodes"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:subject-episodes", {
                        detail: { eps: eps }
                    })
                );
            }

            async function characters() {
                var charsRaw = await api("/v0/subjects/" + SID + "/characters");
                var chars = Array.isArray(charsRaw) ? charsRaw : [];
                charCount = chars.length;
                updateHeader();
                document.getElementById("view").innerHTML =
                    '<div id="subject-characters"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:subject-characters", {
                        detail: { chars: chars }
                    })
                );
            }

            async function personsList() {
                var personsRaw = await api("/v0/subjects/" + SID + "/persons");
                var persons = Array.isArray(personsRaw) ? personsRaw : [];
                persCount = persons.length;
                updateHeader();
                document.getElementById("view").innerHTML =
                    '<div id="subject-persons"></div>';
                window.dispatchEvent(
                    new CustomEvent("seshat:subject-persons", {
                        detail: { persons: persons }
                    })
                );
            }

            render();
        </script>
    </body>
</html>
