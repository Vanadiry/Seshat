<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>统计 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .sn {
                font-variant-numeric: tabular-nums;
            }
            /* 表头补齐透明边框，与数据行同宽 */
            #stats-list > div:first-child {
                border-top: 1px solid transparent;
                border-left: 1px solid transparent;
                border-right: 1px solid transparent;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>
        <main class="max-w-[900px] mx-auto p-6">
            <div
                id="stats-dash"
                class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 text-xs text-sub"
            ></div>
            <div id="stats-list">
                <div class="text-center py-20 text-sub">
                    <span class="spin"></span>加载中…
                </div>
            </div>
        </main>
        <script src="assets/app.min.js"></script>
        <script>
            var _entries = [],
                _noRating = [],
                _orphans = [];
            var _orphanNames = {};
            var _myRates = {};
            var sortKey = "elo";
            var sortDir = "desc";
            var _nameCollator = new Intl.Collator("zh-Hans", {
                numeric: true,
                sensitivity: "base"
            });

            function sortBy(key) {
                if (sortKey === key) {
                    sortDir = sortDir === "asc" ? "desc" : "asc";
                } else {
                    sortKey = key;
                    sortDir = "desc";
                }
                render();
            }

            function sortHeader(label, key, cls) {
                var active = sortKey === key;
                var mark = active ? (sortDir === "asc" ? " ↑" : " ↓") : "";
                return (
                    '<div class="' +
                    cls +
                    " text-center cursor-pointer select-none hover:text-text" +
                    (active ? " text-pink font-semibold" : "") +
                    '" title="点击排序" onclick="sortBy(\'' +
                    key +
                    "')\">" +
                    label +
                    mark +
                    "</div>"
                );
            }

            function loadStats() {
                api("/v0/stats").then(function (s) {
                    if (!s) return;
                    var cards = [];
                    if (s.data_entries) {
                        var total =
                            s.data_entries.subjects +
                            s.data_entries.characters +
                            s.data_entries.persons;
                        cards.push({
                            label: "条目（共" + total + "项）",
                            value:
                                s.data_entries.subjects +
                                " / " +
                                s.data_entries.characters +
                                " / " +
                                s.data_entries.persons,
                            sub: "动画 / 角色 / 人物"
                        });
                    }
                    if (s.images) {
                        cards.push({
                            label: "图片（共" + (s.images.total || 0) + "项）",
                            value:
                                s.images.unique_subjects +
                                " / " +
                                s.images.unique_characters +
                                " / " +
                                s.images.unique_persons,
                            sub: "动画 / 角色 / 人物"
                        });
                    }
                    if (s.elo_scores != null) {
                        cards.push({
                            label: "ELO 评分",
                            value: s.elo_scores + " / " + s.elo_comparisons,
                            sub: "有评分条目 / 评分次数"
                        });
                    }
                    if (s.trackers) {
                        cards.push({
                            label: "Tracker",
                            value: s.trackers.length + " / " + s.tracker_total,
                            sub: "Tracker / 条目总数"
                        });
                    }
                    var html = "";
                    for (var i = 0; i < cards.length; i++) {
                        html +=
                            '<div class="bg-surface border border-bord-light rounded-xl p-3 flex items-center" style="max-width:260px;max-height:100px"><div class="min-w-0 flex-1"><div class="text-sub truncate">' +
                            cards[i].label +
                            '</div><div class="text-lg font-bold mt-1 truncate">' +
                            cards[i].value +
                            "</div>" +
                            (cards[i].sub
                                ? '<div class="text-xs text-sub mt-0.5 truncate">' +
                                  cards[i].sub +
                                  "</div>"
                                : "") +
                            "</div>" +
                            (cards[i].total != null
                                ? '<div class="text-2xl font-bold text-pink shrink-0 ml-3">' +
                                  cards[i].total +
                                  "</div>"
                                : "") +
                            "</div>";
                    }
                    document.getElementById("stats-dash").innerHTML = html;
                });
            }

            async function load() {
                try {
                    var data = (await apiFor("elo", "/v0/elo/ranking")) || {};
                    _entries = data && data.data ? data.data : [];
                    _noRating = data && data.no_rating ? data.no_rating : [];
                    _orphans = data && data.orphans ? data.orphans : [];
                    _myRates = {};
                    if (window.USERNAME) {
                        try {
                            var summary = await api(
                                "/v0/users/" +
                                    window.USERNAME +
                                    "/collections?view=summary"
                            );
                            if (summary && summary.data) {
                                for (var i = 0; i < summary.data.length; i++) {
                                    var rate = Number(summary.data[i].rate);
                                    if (rate > 0) {
                                        _myRates[summary.data[i].subject_id] =
                                            rate;
                                    }
                                }
                            }
                        } catch (_) {}
                    }
                    render();
                } catch (e) {
                    document.getElementById("stats-list").innerHTML =
                        '<div class="text-center py-20 text-sub">加载失败</div>';
                }
            }

            function render() {
                // 列宽在表头与两种数据行之间共用
                var COL_ELO = "w-[120px] shrink-0";
                var COL_MY = "w-[90px] shrink-0";
                var COL_BGM = "w-[100px] shrink-0";
                var COL_ID = "w-[60px] shrink-0";
                // ELO 单元格：两项都有就并排，只有一项就单独右对齐，都没有显示短横线
                function eloCellInner(rating, pct) {
                    if (rating && pct)
                        return (
                            '<span class="flex-1 text-right font-mono">' +
                            rating +
                            '</span><span class="text-sub flex-1 text-right font-mono">' +
                            pct +
                            "</span>"
                        );
                    if (pct)
                        return (
                            '<span class="flex-1 text-right font-mono text-sub">' +
                            pct +
                            "</span>"
                        );
                    return (
                        '<span class="flex-1 text-right font-mono">' +
                        (rating || "-") +
                        "</span>"
                    );
                }
                var items = [];
                for (var i = 0; i < _entries.length; i++)
                    items.push(_entries[i]);
                for (var i = 0; i < _noRating.length; i++)
                    items.push(_noRating[i]);

                var _orphanPromises = [];
                for (var i = 0; i < _orphans.length; i++) {
                    var cached = _orphanNames[_orphans[i].id];
                    items.push({
                        id: _orphans[i].id,
                        name: cached ? escapeHtml(cached.name) : undefined,
                        name_cn: cached
                            ? escapeHtml(cached.name_cn)
                            : undefined,
                        score: cached ? cached.score : undefined,
                        rating: _orphans[i].rating,
                        _orphan: true
                    });
                    if (!cached) {
                        (function (id) {
                            _orphanPromises.push(
                                api("/v0/subjects/" + id)
                                    .then(function (s) {
                                        var score =
                                            s && s.rating && s.rating.score
                                                ? s.rating.score
                                                : null;
                                        _orphanNames[id] =
                                            s && s.id
                                                ? {
                                                      name:
                                                          escapeHtml(s.name) ||
                                                          "",
                                                      name_cn:
                                                          escapeHtml(
                                                              s.name_cn
                                                          ) || "",
                                                      score: score
                                                  }
                                                : {
                                                      name: null,
                                                      name_cn: null,
                                                      score: null
                                                  };
                                    })
                                    .catch(function () {
                                        _orphanNames[id] = {
                                            name: null,
                                            name_cn: null,
                                            score: null
                                        };
                                    })
                            );
                        })(_orphans[i].id);
                    }
                }
                if (_orphanPromises.length > 0) {
                    Promise.all(_orphanPromises).then(function () {
                        render();
                    });
                }

                function sortValue(it, key) {
                    if (key === "elo") {
                        if (
                            it.rating == null ||
                            it.rating === 0 ||
                            it.rating === ""
                        )
                            return null;
                        return Number(it.rating);
                    }
                    if (key === "my") {
                        var rate = _myRates[it.id];
                        if (rate == null || rate === 0 || rate === "")
                            return null;
                        return Number(rate);
                    }
                    if (key === "score") {
                        if (
                            it.score == null ||
                            it.score === 0 ||
                            it.score === ""
                        )
                            return null;
                        return Number(it.score);
                    }
                    return null;
                }
                var sortOrder = ["elo", "my", "score"];
                items.sort(function (a, b) {
                    var keys = [sortKey].concat(
                        sortOrder.filter(function (k) {
                            return k !== sortKey;
                        })
                    );
                    for (var k = 0; k < keys.length; k++) {
                        var av = sortValue(a, keys[k]);
                        var bv = sortValue(b, keys[k]);
                        var am = av === null;
                        var bm = bv === null;
                        if (am && bm) continue;
                        if (am) return 1;
                        if (bm) return -1;
                        if (av !== bv) {
                            return sortDir === "asc" ? av - bv : bv - av;
                        }
                    }
                    var an = primaryName(a.name || "", a.name_cn || "");
                    var bn = primaryName(b.name || "", b.name_cn || "");
                    var d = _nameCollator.compare(an, bn);
                    if (d !== 0) return d;
                    return (a.id || 0) - (b.id || 0);
                });

                var html =
                    '<div class="flex items-center gap-4 px-3 py-1.5 text-xs text-sub border-b border-bord-light">' +
                    '<div class="w-10 shrink-0"></div>' +
                    '<div class="flex-1 min-w-0">动画</div>' +
                    sortHeader("ELO 评分", "elo", COL_ELO) +
                    sortHeader("我的评分", "my", COL_MY) +
                    sortHeader("番组计划评分", "score", COL_BGM) +
                    '<div class="' +
                    COL_ID +
                    ' text-center">ID</div></div>';
                for (var i = 0; i < items.length; i++) {
                    var it = items[i];
                    var bg = i % 2 === 0 ? "bg-surface" : "bg-surface-raised";
                    var eloCls =
                        sortKey === "elo"
                            ? "text-sm font-semibold"
                            : "text-sm text-sub";
                    var myCls =
                        sortKey === "my"
                            ? "text-sm font-semibold"
                            : "text-sm text-sub";
                    var bkgCls =
                        sortKey === "score"
                            ? "text-sm font-semibold"
                            : "text-sm text-sub";
                    if (it._orphan) {
                        var oTitle = "加载中…",
                            oSub = "";
                        if (escapeHtml(it.name) !== undefined) {
                            if (escapeHtml(it.name)) {
                                oTitle = primaryName(
                                    escapeHtml(it.name),
                                    escapeHtml(it.name_cn)
                                );
                                oSub = subName(
                                    escapeHtml(it.name),
                                    escapeHtml(it.name_cn)
                                );
                            } else {
                                oTitle = "无标题";
                                oSub =
                                    "未能获取此条目的数据，可能是未储存此条目，或数据端点异常";
                            }
                        }
                        html +=
                            '<div id="orphan-' +
                            it.id +
                            '" class="flex items-center gap-4 px-3 py-1.5 border border-transparent ' +
                            bg +
                            '">' +
                            '<img src="' +
                            img("subject", it.id, "grid") +
                            '" ' +
                            imgOnError("subject", it.id, "grid") +
                            ' class="w-10 h-10 rounded object-cover bg-input shrink-0">' +
                            '<div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate' +
                            (escapeHtml(it.name) ? "" : " text-sub") +
                            '">' +
                            oTitle +
                            "</div>" +
                            (oSub
                                ? '<div class="text-xs text-sub truncate">' +
                                  oSub +
                                  "</div>"
                                : "") +
                            "</div>" +
                            '<span class="' +
                            eloCls +
                            " " +
                            COL_ELO +
                            ' flex justify-center gap-1 font-mono">' +
                            eloCellInner(
                                it.rating ? it.rating.toFixed(1) : "1500",
                                it.rank_pct != null
                                    ? it.rank_pct.toFixed(1) + "%"
                                    : ""
                            ) +
                            "</span>" +
                            '<span class="' +
                            myCls +
                            " " +
                            COL_MY +
                            ' text-center font-mono">' +
                            (_myRates[it.id] || "-") +
                            "</span>" +
                            '<span class="' +
                            bkgCls +
                            " " +
                            COL_BGM +
                            ' text-center font-mono">' +
                            (it.score != null ? it.score.toFixed(1) : "-") +
                            "</span>" +
                            '<span class="text-xs text-sub ' +
                            COL_ID +
                            ' text-center font-mono">#' +
                            it.id +
                            "</span></div>";
                    } else {
                        var primary = primaryName(
                            escapeHtml(it.name),
                            escapeHtml(it.name_cn)
                        );
                        var sub = subName(
                            escapeHtml(it.name),
                            escapeHtml(it.name_cn)
                        );
                        var ratingVal = it.rating
                            ? typeof it.rating === "number"
                                ? it.rating.toFixed(1)
                                : it.rating
                            : "";
                        var pctVal =
                            it.rank_pct != null
                                ? it.rank_pct.toFixed(1) + "%"
                                : "";
                        html +=
                            "<div onclick=\"location.href='/subject?id=" +
                            it.id +
                            '\'" class="flex items-center gap-4 px-3 py-1.5 cursor-pointer hover:border-pink border border-transparent ' +
                            bg +
                            '">' +
                            '<img src="' +
                            img("subject", it.id, "grid") +
                            '" ' +
                            imgOnError("subject", it.id, "grid") +
                            ' class="w-10 h-10 rounded object-cover bg-input shrink-0">' +
                            '<div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">' +
                            primary +
                            "</div>" +
                            (sub
                                ? '<div class="text-xs text-sub truncate">' +
                                  sub +
                                  "</div>"
                                : "") +
                            "</div>" +
                            '<span class="' +
                            eloCls +
                            " " +
                            COL_ELO +
                            ' flex justify-center gap-1 font-mono">' +
                            eloCellInner(ratingVal, pctVal) +
                            "</span>" +
                            '<span class="' +
                            myCls +
                            " " +
                            COL_MY +
                            ' text-center font-mono">' +
                            (_myRates[it.id] || "-") +
                            "</span>" +
                            '<span class="' +
                            bkgCls +
                            " " +
                            COL_BGM +
                            ' text-center font-mono">' +
                            (it.score ? it.score.toFixed(1) : "-") +
                            "</span>" +
                            '<span class="text-xs text-sub ' +
                            COL_ID +
                            ' text-center font-mono">#' +
                            it.id +
                            "</span></div>";
                    }
                }
                document.getElementById("stats-list").innerHTML = html;
            }

            (async () => {
                if (!(await requireFeature("stats"))) return;
                loadStats();
                load();
            })();
        </script>
    </body>
</html>
