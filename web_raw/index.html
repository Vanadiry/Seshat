<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <main class="max-w-[1200px] mx-auto p-6">
            <div
                id="grid"
                class="grid grid-cols-[repeat(auto-fill,minmax(175px,1fr))] gap-4"
            ></div>
            <div id="pager" class="mt-6 text-center"></div>
        </main>

        <script src="assets/app.min.js"></script>
        <script>
            var pageSize = 100;
            var allItems = [];
            var showing = 0;

            function onFetchDone() {
                load();
            }

            // ── 卡片渲染：海报 + 标题 + 评分/平台/年份 ──
            var _collTypes = { 1: "想看", 2: "看过", 3: "抛弃" };
            var _collCls = {
                1: "bg-pink-bg text-tier-gold",
                2: "bg-pink-bg text-tier-green",
                3: "bg-surface-raised text-sub"
            };
            function renderItem(s) {
                var sub = subName(s.name, s.name_cn);
                var badges = "";
                if (s._elo)
                    badges +=
                        '<span class="bg-elo-bg text-elo-text px-1.5 py-px rounded text-[10px] font-semibold">ELO ' +
                        s._elo +
                        "</span>";
                if (s._coll)
                    badges +=
                        '<span class="' +
                        (_collCls[s._coll] || "") +
                        ' px-1.5 py-px rounded text-[10px] font-semibold">' +
                        (_collTypes[s._coll] || "") +
                        "</span>";
                return (
                    "<div onclick=\"location.href='/subject?id=" +
                    s.id +
                    '\'" class="bg-surface rounded-xl overflow-hidden cursor-pointer border border-bord hover:border-pink hover:-translate-y-0.5 hover:shadow-[0_4px_20px_rgba(254,138,149,.1)] transition-all">' +
                    '<div class="relative">' +
                    '<img src="' +
                    img("subject", s.id, "small") +
                    '\" loading=\"lazy\" ' +
                    imgOnError("subject", s.id, "small") +
                    ' class="w-full object-cover bg-surface" style="aspect-ratio:1/1.414">' +
                    (badges
                        ? '<div class="absolute top-1 right-1 flex flex-col items-end gap-0.5">' +
                          badges +
                          "</div>"
                        : "") +
                    "</div>" +
                    '<div class="p-2.5"><div class="text-sm font-semibold truncate">' +
                    primaryName(s.name, s.name_cn) +
                    "</div>" +
                    '<div class="text-xs text-sub truncate mt-0.5' +
                    (sub ? "" : " invisible") +
                    '">' +
                    (sub || " ") +
                    "</div>" +
                    '<div class="text-xs text-sub mt-1 flex gap-1.5 items-center truncate">' +
                    (s.score
                        ? '<span class="bg-pink text-white px-1.5 py-px rounded-md text-[12px] font-bold shrink-0">★ ' +
                          s.score.toFixed(1) +
                          "</span>"
                        : "") +
                    (s.platform
                        ? '<span class="bg-pink-bg text-pink px-1.5 py-px rounded-md text-[12px] shrink-0">' +
                          s.platform +
                          "</span>"
                        : "") +
                    (s.date
                        ? '<span class="text-sub text-[12px] shrink-0">' +
                          s.date.slice(0, 4) +
                          "</span>"
                        : "") +
                    "</div></div></div>"
                );
            }

            function showMore(n) {
                var grid = document.getElementById("grid");
                var end = Math.min(showing + n, allItems.length);
                var html = "";
                for (var i = showing; i < end; i++) {
                    html += renderItem(allItems[i]);
                }
                grid.innerHTML += html;
                showing = end;
                updatePager();
            }

            function showAll() {
                showMore(allItems.length - showing);
            }

            function updatePager() {
                var pager = document.getElementById("pager");
                if (allItems.length <= pageSize) {
                    pager.innerHTML =
                        '<span class="text-xs text-sub">共 ' +
                        allItems.length +
                        " 个项目</span>";
                    return;
                }
                var html =
                    '<span class="text-xs text-sub">当前展示 ' +
                    showing +
                    "，共 " +
                    allItems.length +
                    " 个项目</span>";
                if (showing < allItems.length) {
                    html +=
                        ' <button onclick="showMore(' +
                        pageSize +
                        ')" class="ml-3 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开更多</button>';
                    html +=
                        ' <button onclick="showAll()" class="ml-2 px-3 py-1 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text">展开全部</button>';
                }
                pager.innerHTML = html;
            }

            async function load() {
                var q = new URLSearchParams(location.search).get("q");
                if (q) {
                    searchLoad(q);
                    return;
                }
                document.getElementById("grid").innerHTML =
                    '<div class="col-span-full text-center py-20 text-sub">加载中…</div>';
                try {
                    var subjects = (await apiLocal("/v0/subjects/list")) || [];
                    // Merge ELO ratings + collections
                    Promise.all([
                        api("/v0/elo/ranking"),
                        window.USERNAME
                            ? api(
                                  "/v0/users/" +
                                      window.USERNAME +
                                      "/collections"
                              )
                            : Promise.resolve(null)
                    ])
                        .then(function (results) {
                            var eloData = results[0],
                                collData = results[1];
                            if (eloData && eloData.entries) {
                                var eloMap = {};
                                for (
                                    var i = 0;
                                    i < eloData.entries.length;
                                    i++
                                ) {
                                    var e = eloData.entries[i];
                                    eloMap[e.id] = e.rating
                                        ? Math.round(e.rating)
                                        : null;
                                }
                                for (var i = 0; i < subjects.length; i++) {
                                    if (eloMap[subjects[i].id])
                                        subjects[i]._elo =
                                            eloMap[subjects[i].id];
                                }
                            }
                            if (collData && collData.data) {
                                var collMap = {};
                                for (var i = 0; i < collData.data.length; i++) {
                                    collMap[collData.data[i].subject_id] =
                                        collData.data[i].type;
                                }
                                for (var i = 0; i < subjects.length; i++) {
                                    if (collMap[subjects[i].id])
                                        subjects[i]._coll =
                                            collMap[subjects[i].id];
                                }
                            }
                            finishLoad(subjects);
                        })
                        .catch(function () {
                            finishLoad(subjects);
                        });
                } catch (e) {
                    document.getElementById("grid").innerHTML =
                        '<div class="col-span-full text-center py-20 text-sub">无法连接</div>';
                }
            }

            function finishLoad(items) {
                allItems = items;
                if (!allItems.length) {
                    document.getElementById("grid").innerHTML =
                        '<div class="col-span-full text-center py-20 text-sub">暂无数据。点击「管理数据」添加</div>';
                    document.getElementById("pager").innerHTML = "";
                    return;
                }
                var sort = window.SUBJECT_SORT || "elo";
                if (sort === "elo") {
                    allItems.sort(function (a, b) {
                        var ae = a._elo || 0,
                            be = b._elo || 0;
                        if (ae !== be) return be - ae;
                        return (b.score || 0) - (a.score || 0);
                    });
                } else if (sort === "bgm_rank") {
                    allItems.sort(function (a, b) {
                        return (b.score || 0) - (a.score || 0);
                    });
                } else if (sort === "random") {
                    allItems.sort(function () { return Math.random() - 0.5; });
                }
                document.getElementById("grid").innerHTML = "";
                showing = 0;
                showMore(pageSize);
            }

            async function searchLoad(q) {
                document.getElementById("grid").innerHTML =
                    '<div class="col-span-full text-center py-20 text-sub">搜索中…</div>';
                try {
                    var d = await api(
                        "/v0/search?q=" +
                            encodeURIComponent(q) +
                            "&type=subjects"
                    );
                    if (!d) {
                        document.getElementById("grid").innerHTML =
                            '<div class="col-span-full text-center py-20 text-sub">搜索出错</div>';
                        return;
                    }
                    allItems = d.subjects || [];
                    if (!allItems.length) {
                        document.getElementById("grid").innerHTML =
                            '<div class="col-span-full text-center py-20 text-sub">未找到结果</div>';
                        document.getElementById("pager").innerHTML = "";
                        return;
                    }
                    document.getElementById("grid").innerHTML = "";
                    showing = 0;
                    showMore(pageSize);
                } catch (e) {
                    document.getElementById("grid").innerHTML =
                        '<div class="col-span-full text-center py-20 text-sub">无法连接</div>';
                }
            }

            load();
        </script>
    </body>
</html>
