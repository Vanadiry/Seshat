<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>设置 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>
        <main class="max-w-[900px] mx-auto p-6 flex gap-8">
            <div class="flex-1 min-w-0">
                <div id="settings-form">
                    <div class="text-center py-20 text-sub">加载中…</div>
                </div>
            </div>
            <div class="w-[260px] shrink-0 hidden lg:block">
                <div id="settings-sidebar" class="sticky top-6"></div>
            </div>
        </main>
        <script src="assets/app.min.js"></script>
        <script>
            var _settingsData = {};

            function loadSettings() {
                fetch(API + "/v0/settings")
                    .then(function (r) {
                        return r.json();
                    })
                    .then(function (data) {
                        _settingsData = data || {};
                        render();
                    });
            }

            function render() {
                var fields = [];
                for (var k in _settingsData) {
                    var v = _settingsData[k];
                    if (typeof v === "object" && v.value !== undefined) {
                        var choices = null;
                        if (v._choice && Array.isArray(v._choice)) {
                            choices = [];
                            for (var c = 0; c < v._choice.length; c++) {
                                var co = v._choice[c];
                                choices.push({ key: Object.keys(co)[0], label: co[Object.keys(co)[0]] });
                            }
                        }
                        fields.push({ key: k, comment: v._comment || "", value: v.value, choices: choices });
                    }
                }

                var html =
                    '<h2 class="text-lg font-bold text-text mb-1">前端设置</h2>' +
                    '<p class="text-xs text-sub mb-6">修改后刷新页面即可生效，无需重启后端</p>';

                for (var i = 0; i < fields.length; i++) {
                    var f = fields[i];
                    html +=
                        '<div class="flex items-center gap-3 py-3 border-b border-bord-light last:border-0">' +
                        '<label class="flex-1 min-w-0 text-sm text-text truncate">' +
                        f.comment +
                        "</label>";
                    if (f.choices) {
                        html +=
                            '<select id="f-' + f.key +
                            '" class="custom-select w-[140px] shrink-0 px-3 py-2 rounded-lg border border-bord bg-input text-sm outline-none">';
                        for (var j = 0; j < f.choices.length; j++) {
                            html +=
                                '<option value="' + f.choices[j].key + '"' +
                                (f.value === f.choices[j].key ? " selected" : "") +
                                ">" + f.choices[j].label + "</option>";
                        }
                        html += "</select>";
                    } else {
                        html +=
                            '<input id="f-' + f.key + '" value="' + f.value +
                            '" class="flex-1 shrink-0 px-3 py-2 rounded-lg border border-bord bg-input text-sm outline-none">';
                    }
                    html += "</div>";
                }

                html +=
                    '<button onclick="saveSettings()" class="w-full mt-6 px-4 py-2.5 rounded-xl bg-pink text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90 transition-all active:scale-[0.98]">保存设置</button>' +
                    '<p id="save-msg" class="text-xs text-sub mt-3 text-center"></p>';
                document.getElementById("settings-form").innerHTML = html;
            }

            function saveSettings() {
                var updates = {};
                for (var k in _settingsData) {
                    if (k === "_comment") continue;
                    var v = _settingsData[k];
                    if (typeof v !== "object" || v.value === undefined)
                        continue;
                    var el = document.getElementById("f-" + k);
                    if (!el) continue;
                    updates[k] = el.type === "checkbox" ? el.checked : el.value;
                }
                var msg = document.getElementById("save-msg");
                fetch(API + "/v0/settings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updates)
                })
                    .then(function (r) {
                        return r.json();
                    })
                    .then(function (d) {
                        if (d.error && !d.success) {
                            msg.textContent = d.error;
                            return;
                        }
                        var text = "";
                        if (d.success) text += "✓ " + d.success;
                        if (d.error)
                            text += (text ? "  " : "") + "✗ " + d.error;
                        msg.textContent = text || "保存成功";
                        // 同步主题到 localStorage 供防闪屏脚本使用
                        if (updates.theme) {
                            localStorage.setItem("theme", updates.theme);
                            var isLight =
                                updates.theme === "light" ||
                                (updates.theme === "auto" &&
                                    window.matchMedia(
                                        "(prefers-color-scheme: light)"
                                    ).matches);
                            document.documentElement.classList.toggle(
                                "light",
                                isLight
                            );
                        }
                        if (!d.error) loadSettings();
                    });
            }

            loadSettings();
        </script>
    </body>
</html>
