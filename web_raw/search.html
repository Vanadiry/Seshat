<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>搜索 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            #search-area {
                transition: margin-top 0.35s ease;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <main class="max-w-[640px] mx-auto p-6">
            <div id="search-area" class="mt-[25vh]">
                <div
                    class="flex items-stretch bg-input border border-bord-strong rounded-xl overflow-hidden focus-within:border-pink transition-colors"
                >
                    <select
                        id="search-type"
                        class="search-type bg-surface text-sub text-sm font-semibold pl-4 pr-6 rounded-l-xl border-0 outline-none cursor-pointer shrink-0 hover:text-text"
                        style="
                            width: 72px;
                            text-align: center;
                            text-align-last: center;
                        "
                    >
                        <option value="subjects">动画</option>
                        <option value="characters">角色</option>
                        <option value="persons">人物</option>
                        <option value="tags" id="opt-tags">标签</option>
                    </select>
                    <input
                        id="q"
                        placeholder="搜索…"
                        class="flex-1 px-4 py-3 bg-transparent text-base outline-none border-0 min-w-0"
                        onkeydown="if (event.key === 'Enter') doSearch();"
                        autofocus
                    />
                    <button
                        onclick="doSearch()"
                        class="bg-pink text-white font-semibold cursor-pointer border-0 hover:opacity-90 shrink-0 py-3"
                        style="width: 72px"
                    >
                        搜索
                    </button>
                </div>
            </div>
            <div id="results" class="mt-6"></div>
        </main>

        <script src="assets/app.min.js"></script>
        <script>
            if (window.BACKEND_URL)
                document.getElementById("opt-tags").style.display = "none";

            var qp = new URLSearchParams(location.search);
            var initQ = qp.get("q");
            if (initQ) {
                document.getElementById("q").value = initQ;
                doSearch();
            }

            async function doSearch() {
                var q = document.getElementById("q").value.trim();
                if (!q) return;
                var type = document.getElementById("search-type").value;
                if (!type) return;
                document.getElementById("search-area").style.marginTop = "0";
                var res = document.getElementById("results");
                res.innerHTML =
                    '<div class="text-center py-10 text-sub">搜索中…</div>';

                var body = { keyword: q };
                if (type === "subjects") body.filter = { type: [2] };

                try {
                    var resp = await fetch(API + "/v0/search/" + type, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body)
                    });
                    var d = await resp.json();
                    if (!d || !d.data) {
                        res.innerHTML =
                            '<div class="text-center py-16 text-sub">搜索出错</div>';
                        return;
                    }
                    renderResults(d.data, type);
                } catch (e) {
                    res.innerHTML =
                        '<div class="text-center py-16 text-sub">搜索出错</div>';
                }
            }

            var typeLabels = {
                subjects: "动画",
                characters: "角色",
                persons: "人物",
                tags: "标签"
            };
            var typeLinks = {
                subjects: "/subject?id=",
                characters: "/character?id=",
                persons: "/person?id="
            };

            function renderResults(data, type) {
                var res = document.getElementById("results");
                if (!data.length) {
                    res.innerHTML =
                        '<div class="text-center py-16 text-sub">未找到结果</div>';
                    return;
                }
                var label = typeLabels[type] || type;
                var link = typeLinks[type] || "";
                var html =
                    '<div class="mb-6"><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">' +
                    label +
                    '</span><span class="text-xs text-sub">(' +
                    data.length +
                    ")</span></div>";
                html += '<div class="flex flex-col gap-1">';
                for (var i = 0; i < data.length; i++) {
                    var it = data[i];
                    if (type === "tags") {
                        html +=
                            '<a href="/tag?tag=' +
                            encodeURIComponent(it.name) +
                            '" class="no-underline flex gap-3 items-center bg-surface border border-bord-mid rounded-lg py-1.5 px-2 cursor-pointer hover:border-pink"><div class="text-sm font-semibold">' +
                            it.name +
                            '</div><div class="text-xs text-sub">' +
                            it.count +
                            " 个条目</div></a>";
                    } else {
                        var imgSrc = img(
                            type === "subjects"
                                ? "subject"
                                : type === "characters"
                                  ? "character"
                                  : "person",
                            it.id,
                            "grid"
                        );
                        var imgErr = imgOnError(
                            type === "subjects"
                                ? "subject"
                                : type === "characters"
                                  ? "character"
                                  : "person",
                            it.id,
                            "grid"
                        );
                        html +=
                            "<div onclick=\"location.href='" +
                            link +
                            it.id +
                            '\'" class="flex gap-3 items-center bg-surface border border-bord-mid rounded-lg py-1.5 px-2 cursor-pointer hover:border-pink">' +
                            '<img src="' +
                            imgSrc +
                            '" ' +
                            imgErr +
                            ' class="w-10 h-10 rounded-lg object-cover bg-surface shrink-0">' +
                            '<div class="flex-1 min-w-0">' +
                            '<div class="text-sm font-semibold truncate">' +
                            it.name +
                            "</div>" +
                            (it.name_cn
                                ? '<div class="text-xs text-sub truncate mt-0.5">' +
                                  it.name_cn +
                                  "</div>"
                                : "") +
                            "</div>" +
                            '<div class="text-xs text-sub shrink-0">#' +
                            it.id +
                            "</div>" +
                            "</div>";
                    }
                }
                html += "</div></div>";
                res.innerHTML = html;
            }
        </script>
    </body>
</html>
