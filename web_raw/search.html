<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>搜索 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            #search-area {
                transition: margin-top 0.35s ease;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <main class="max-w-[720px] mx-auto p-6">
            <div id="search-area" class="mt-[25vh]">
                <div
                    class="flex items-stretch bg-input border border-bord-strong rounded-xl overflow-hidden focus-within:border-pink transition-colors"
                >
                    <input
                        id="q"
                        placeholder="搜索…"
                        class="flex-1 px-4 py-3 bg-transparent text-base outline-none border-0 min-w-0"
                        onkeydown="if (event.key === 'Enter') doSearch();"
                        autofocus
                    />
                    <button
                        onclick="doSearch()"
                        class="bg-pink-solid text-white font-semibold cursor-pointer border-0 hover:opacity-90 shrink-0 py-3"
                        style="width: 72px"
                    >
                        搜索
                    </button>
                </div>
                <div
                    id="search-types"
                    class="mt-3 flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-sm text-sub"
                >
                    <label
                        class="flex items-center gap-1.5 cursor-pointer select-none"
                    >
                        <input
                            type="checkbox"
                            data-type="subjects"
                            checked
                            class="cursor-pointer"
                            style="accent-color: var(--c-pink)"
                        />
                        条目
                    </label>
                    <label
                        class="flex items-center gap-1.5 cursor-pointer select-none"
                    >
                        <input
                            type="checkbox"
                            data-type="characters"
                            checked
                            class="cursor-pointer"
                            style="accent-color: var(--c-pink)"
                        />
                        角色
                    </label>
                    <label
                        class="flex items-center gap-1.5 cursor-pointer select-none"
                    >
                        <input
                            type="checkbox"
                            data-type="persons"
                            class="cursor-pointer"
                            style="accent-color: var(--c-pink)"
                        />
                        人物
                    </label>
                    <label
                        id="type-tags"
                        class="flex items-center gap-1.5 cursor-pointer select-none"
                    >
                        <input
                            type="checkbox"
                            data-type="tags"
                            class="cursor-pointer"
                            style="accent-color: var(--c-pink)"
                        />
                        标签
                    </label>
                </div>
            </div>
            <div id="results" class="mt-6"></div>
        </main>

        <script src="assets/app.min.js"></script>
        <script>
            var TYPE_LABELS = {
                subjects: "条目",
                characters: "角色",
                persons: "人物",
                tags: "标签"
            };
            var TYPE_LINKS = {
                subjects: "/subject?id=",
                characters: "/character?id=",
                persons: "/person?id="
            };
            var TYPE_IMAGES = {
                subjects: "subject",
                characters: "character",
                persons: "person"
            };
            var _searchAbort = null;
            var _searchSeq = 0;

            function selectedTypes() {
                var out = [];
                var boxes = document.querySelectorAll(
                    "#search-types input[type=checkbox]"
                );
                for (var i = 0; i < boxes.length; i++) {
                    if (boxes[i].checked && boxes[i].offsetParent !== null) {
                        out.push(boxes[i].getAttribute("data-type"));
                    }
                }
                return out;
            }

            function initTypeChecks() {
                var boxes = document.querySelectorAll(
                    "#search-types input[type=checkbox]"
                );
                for (var i = 0; i < boxes.length; i++) {
                    boxes[i].addEventListener("change", function () {
                        var checked = document.querySelectorAll(
                            "#search-types input[type=checkbox]:checked"
                        );
                        if (!checked.length) {
                            this.checked = true;
                            return;
                        }
                        // 勾选变化时丢弃上一轮结果
                        _searchSeq++;
                        if (_searchAbort) {
                            _searchAbort.abort();
                            _searchAbort = null;
                        }
                    });
                }
            }

            async function searchType(type, keyword, signal) {
                var body = { keyword: keyword };
                if (type === "subjects") body.filter = { type: [2] };
                var resp = await fetch(API + "/v0/search/" + type, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                    signal: signal
                });
                if (!resp.ok) throw new Error("search failed");
                var d = await resp.json();
                if (!d || !Array.isArray(d.data)) {
                    throw new Error("bad response");
                }
                return {
                    data: d.data,
                    total: typeof d.total === "number" ? d.total : d.data.length
                };
            }

            function sectionHeader(type, total, dataLen) {
                var count = total > dataLen ? "500+" : String(total);
                return (
                    '<div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">' +
                    TYPE_LABELS[type] +
                    '</span><span class="text-xs text-sub">(' +
                    count +
                    ")</span></div>"
                );
            }

            function renderItem(type, it) {
                if (type === "tags") {
                    return (
                        '<a href="/tag?tag=' +
                        encodeURIComponent(escapeHtml(it.name)) +
                        '" class="fade-in no-underline flex gap-3 items-center bg-surface border border-bord-mid rounded-lg py-1.5 px-2 cursor-pointer hover:border-pink"><div class="text-sm font-semibold">' +
                        escapeHtml(it.name) +
                        '</div><div class="text-xs text-sub">' +
                        it.count +
                        " 个条目</div></a>"
                    );
                }
                var kind = TYPE_IMAGES[type];
                return (
                    '<a href="' +
                    TYPE_LINKS[type] +
                    it.id +
                    '" class="fade-in flex gap-3 items-center bg-surface border border-bord-mid rounded-lg py-1.5 px-2 cursor-pointer hover:border-pink no-underline">' +
                    '<img src="' +
                    img(kind, it.id, "grid") +
                    '" ' +
                    imgOnError(kind, it.id, "grid") +
                    ' class="w-10 h-10 rounded-lg object-cover bg-surface shrink-0">' +
                    '<div class="flex-1 min-w-0">' +
                    '<div class="text-sm font-semibold truncate">' +
                    escapeHtml(it.name) +
                    "</div>" +
                    (escapeHtml(it.name_cn)
                        ? '<div class="text-xs text-sub truncate mt-0.5">' +
                          escapeHtml(it.name_cn) +
                          "</div>"
                        : "") +
                    "</div>" +
                    '<div class="text-xs text-sub shrink-0">#' +
                    it.id +
                    "</div>" +
                    "</a>"
                );
            }

            function renderSection(type, result) {
                var html =
                    '<div class="mb-6">' +
                    sectionHeader(type, result.total, result.data.length) +
                    '<div class="flex flex-col gap-1">';
                for (var i = 0; i < result.data.length; i++) {
                    html += renderItem(type, result.data[i]);
                }
                return html + "</div></div>";
            }

            function renderErrorSection(type) {
                return (
                    '<div class="mb-6"><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-pink rounded-sm"></span><span class="font-bold">' +
                    TYPE_LABELS[type] +
                    '</span></div><div class="text-center py-6 text-sub">搜索出错</div></div>'
                );
            }

            async function doSearch() {
                var keyword = document.getElementById("q").value.trim();
                if (!keyword) return;
                var types = selectedTypes();
                if (!types.length) return;
                document.getElementById("search-area").style.marginTop = "0";
                var res = document.getElementById("results");
                res.innerHTML =
                    '<div class="text-center py-10 text-sub"><span class="spin"></span>搜索中…</div>';

                if (_searchAbort) _searchAbort.abort();
                var ctl = new AbortController();
                _searchAbort = ctl;
                var seq = ++_searchSeq;

                var settled = await Promise.allSettled(
                    types.map(function (type) {
                        return searchType(type, keyword, ctl.signal);
                    })
                );
                if (seq !== _searchSeq) return;

                var html = "",
                    hasSection = false;
                for (var i = 0; i < settled.length; i++) {
                    var type = types[i];
                    var r = settled[i];
                    if (r.status === "fulfilled") {
                        if (r.value.data.length) {
                            hasSection = true;
                            html += renderSection(type, r.value);
                        }
                    } else if (!r.reason || r.reason.name !== "AbortError") {
                        hasSection = true;
                        html += renderErrorSection(type);
                    }
                }
                res.innerHTML = hasSection
                    ? html
                    : '<div class="text-center py-16 text-sub">未找到结果</div>';
            }

            async function initSearch() {
                await capabilitiesReady();
                if (resolve("tags") === "hidden") {
                    var wrap = document.getElementById("type-tags");
                    if (wrap) wrap.style.display = "none";
                    var tagBox = wrap
                        ? wrap.querySelector("input[type=checkbox]")
                        : null;
                    if (tagBox) tagBox.checked = false;
                }
                var q = new URLSearchParams(location.search).get("q");
                if (q) {
                    document.getElementById("q").value = q;
                    doSearch();
                }
            }

            initTypeChecks();
            initSearch();
        </script>
    </body>
</html>
