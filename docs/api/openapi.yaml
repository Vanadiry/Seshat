        offset: { type: integer, example: 0 }
        data:
          type: array
          items:
            $ref: "#/components/schemas/ELOEntry"
        no_rating:
          type: array
          items:
            $ref: "#/components/schemas/ELOEntry"
        orphans:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 999 }
              rating: { type: number, example: 1520.0 }
    EloPairEntry:
      type: object
      properties:
        id: { type: integer, example: 51 }
        name: { type: string, example: "CLANNAD" }
        name_cn: { type: string, example: "CLANNAD" }
    EloHistory:
      type: object
      properties:
        winner: { type: integer, example: 51 }
        loser: { type: integer, example: 68 }
        time: { type: string, example: "2026-05-14T12:00:00Z" }

    TrackerItem:
      type: object
      properties:
        id:
          type: string
          example: "_seshat"
          description: 文件名去掉扩展名的稳定标识
        name:
          type: string
          example: "seshat"
          description: 展示名称，为空时回退到 id
        type:
          type: string
          enum: [auto, manual]
          description: auto 为后端自动记录，manual 为用户手动编辑
        count: { type: integer, example: 5 }
