openapi: "3.0.0"
info:
  title: Seshat API
  description: |
    离线优先的 Bangumi 数据管理与浏览工具。
    错误响应统一为 ErrorDetail，包含 title、description、details 和 request_id。
  version: "2.0.0-dev.4"
servers:
  - url: http://127.0.0.1:12500
    description: Seshat 本地后端
tags:
  - name: 条目
  - name: 角色
  - name: 人物
  - name: 用户
  - name: 标签
  - name: 拉取
  - name: Tracker
  - name: ELO
  - name: 事件
  - name: 其他

paths:
  # 条目
  /api/v0/subjects/list: # 所有条目
    get:
      tags: [条目]
      summary: 所有条目
      operationId: listSubjects
      responses:
        "200":
          description: 条目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_SubjectListItem"
  /api/v0/subjects/name: # 条目对应ID索引
    get:
      tags: [条目]
      summary: 条目对应ID索引
      operationId: subjectNames
      responses:
        "200":
          description: NAME对应ID字典
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
  /api/v0/subjects/{id}: # 条目详情
    get:
      tags: [条目]
      summary: 条目详情
      operationId: getSubject
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 51
      responses:
        "200":
          description: 完整条目数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v0/subjects/{id}/image: # 条目图像
    get:
      tags: [条目]
      summary: 条目图像
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: type,
            in: query,
            schema: { type: string, enum: [large, grid, small], default: grid },
          }
      responses:
        "200": { description: 图像文件 }
        "404": { description: 图片不存在 }
  /api/v0/subjects/{id}/characters: # 条目关联的角色
    get:
      tags: [条目]
      summary: 条目关联的角色
      parameters:
        [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 角色数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedCharacter"
  /api/v0/subjects/{id}/persons: # 条目关联的人物
    get:
      tags: [条目]
      summary: 条目关联的人物
      parameters:
        [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 人物数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedPerson"
  /api/v0/subjects/{id}/subjects: # 条目关联的条目
    get:
      tags: [条目]
      summary: 条目关联的条目
      parameters:
        [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 关联条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectRelation"
  /api/v0/search/subjects: # 搜索条目
    post:
      tags: [条目]
      summary: 搜索条目
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string, example: "CLANNAD" }
                filter: { type: object, example: { type: [2] } }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_SearchItem"
  /api/v0/episodes: # 条目关联的剧集
    get:
      tags: [条目]
      summary: 条目关联的剧集列表
      parameters:
        - {
            name: subject_id,
            in: query,
            required: true,
            schema: { type: integer },
            example: 51,
          }
        - {
            name: type,
            in: query,
            required: false,
            schema: { type: integer },
            description: "章节类型，0=本篇 1=SP 2=OP 3=ED 4=预告 5=MAD 6=其他",
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200 },
            description: "不传返回全部",
          }
        - {
            name: offset,
            in: query,
            required: false,
            schema: { type: integer, minimum: 0 },
          }
      responses:
        "200":
          description: 剧集分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_Episode"
        "400":
          $ref: "#/components/responses/BadRequest"
  # 角色
  /api/v0/characters/list: # 所有角色
    get:
      tags: [角色]
      summary: 所有角色
      operationId: listCharacters
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_NameEntry"
  /api/v0/characters/name: # 角色对应ID索引
    get:
      tags: [角色]
      summary: 角色对应ID索引
      operationId: characterNames
      responses:
        "200":
          description: NAME对应ID字典
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
  /api/v0/characters/{id}: # 角色详情
    get:
      tags: [角色]
      summary: 角色详情
      parameters:
        [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 角色完整数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
  /api/v0/characters/{id}/image: # 角色图像
    get:
      tags: [角色]
      summary: 角色图像
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: type,
            in: query,
            schema: { type: string, enum: [large, grid, small], default: grid },
          }
      responses:
        "200": { description: 图片文件 }
        "404": { description: 图片不存在 }
  /api/v0/characters/{id}/persons: # 角色关联的人物
    get:
      tags: [角色]
      summary: 角色关联的人物
      parameters:
        [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 人物数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string }
                    name: { type: string }
                    id: { type: integer }
                    subject_id: { type: integer }
                    subject_name: { type: string }
  /api/v0/characters/{id}/subjects: # 角色关联的条目
    get:
      tags: [角色]
      summary: 角色关联的条目
      parameters:
        [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string, example: "主角" }
                    name: { type: string, example: "CLANNAD" }
                    name_cn: { type: string }
                    id: { type: integer }
  /api/v0/search/characters: # 搜索角色
    post:
      tags: [角色]
      summary: 搜索角色
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string, example: "古河渚" }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_SearchItem"
  # 人物
  /api/v0/persons/list: # 所有人物
    get:
      tags: [人物]
      summary: 所有人物
      operationId: listPersons
      responses:
        "200":
          description: 人物列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_NameEntry"
  /api/v0/persons/name: # 人物对应ID索引
    get:
      tags: [人物]
      summary: 人物对应ID索引
      operationId: personNames
      responses:
        "200":
          description: NAME对应ID字典
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
  /api/v0/persons/{id}: # 人物详情
    get:
      tags: [人物]
      summary: 人物详情
      parameters:
        [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 人物完整数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
  /api/v0/persons/{id}/image: # 人物图像
    get:
      tags: [人物]
      summary: 人物图像
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: type,
            in: query,
            schema: { type: string, enum: [large, grid, small], default: grid },
          }
      responses:
        "200": { description: 图片文件 }
        "404": { description: 图片不存在 }
  /api/v0/persons/{id}/characters: # 人物关联的角色
    get:
      tags: [人物]
      summary: 人物关联的角色
      parameters:
        [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 角色数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string }
                    name: { type: string }
                    id: { type: integer }
                    subject_id: { type: integer }
                    subject_name: { type: string }
  /api/v0/persons/{id}/subjects: # 人物关联的条目
    get:
      tags: [人物]
      summary: 人物关联的条目
      parameters:
        [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string, example: "导演" }
                    name: { type: string, example: "CLANNAD" }
                    name_cn: { type: string }
                    id: { type: integer }
  /api/v0/search/persons: # 搜索人物
    post:
      tags: [人物]
      summary: 搜索人物
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string, example: "麻枝准" }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_SearchItem"
  # 用户
  /api/v0/users/{username}: # 用户信息
    get:
      tags: [用户]
      summary: 用户信息
      parameters:
        - {
            name: username,
            in: path,
            required: true,
            schema: { type: string },
            example: "vanadiry",
          }
      responses:
        "200":
          description: 用户详细数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v0/users/{username}/collections: # 用户收藏
    get:
      tags: [用户]
      summary: 用户收藏
      parameters:
        - {
            name: username,
            in: path,
            required: true,
            schema: { type: string },
            example: "vanadiry",
          }
        - {
            name: subject_type,
            in: query,
            schema: { type: integer },
            description: "条目类型",
          }
        - {
            name: type,
            in: query,
            schema: { type: integer },
            description: "收藏类型",
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
            description: "不传返回全部",
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - {
            name: view,
            in: query,
            schema: { type: string, enum: [summary] },
            description: "summary 返回收藏摘要",
          }
      responses:
        "200":
          description: 收藏分页；view=summary 时返回 {total, data}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Paged_UserCollection"
                  - $ref: "#/components/schemas/Paged_UserCollectionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v0/users/{username}/avatar: # 用户头像
    get:
      tags: [用户]
      summary: 用户头像
      parameters:
        - {
            name: username,
            in: path,
            required: true,
            schema: { type: string },
            example: "vanadiry",
          }
        - {
            name: type,
            in: query,
            schema:
              { type: string, enum: [small, large, medium], default: large },
            description: "都返回本地保存的 large 文件",
          }
      responses:
        "200":
          description: 头像图片
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  # 标签
  /api/v0/tags: # 所有标签
    get:
      tags: [标签]
      summary: 所有标签
      responses:
        "200":
          description: 数量降序的标签列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_TagItem"
  /api/v0/tags/{name}/subjects: # 标签关联的条目
    get:
      tags: [标签]
      summary: 标签关联的条目
      parameters:
        [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: 条目列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagSubject"
  /api/v0/search/tags: # 搜索标签
    post:
      tags: [标签]
      summary: 搜索标签
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string, example: "治愈" }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_SearchItem"
  # 拉取
  /api/v0/fetch: # 统一拉取
    post:
      tags: [拉取]
      summary: 统一拉取
      description: |
        按来源解析 ID 后拉取条目，结束后始终重建索引。
        返回 `task_id`，进度通过 `GET /api/v0/task/{task_id}` 获取。
        来源为 `ids` 时，成功的 ID 会写入 `_seshat.json`。
        来源为 `tracker_names` 时，`names` 中的 Tracker 必须存在且非空。
        没有待处理 ID 时返回 `status` 为 `done`、`count` 为 0。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, json, images]
              properties:
                source:
                  type: string
                  enum: [tracker_new, tracker_all, tracker_names, ids, local]
                  description: |
                    `tracker_new` 为所有 Tracker 中本地索引缺少或不完整的 ID。
                    `tracker_all` 为所有 Tracker 的全部 ID。
                    `tracker_names` 为 `names` 指定的 Tracker 的全部 ID。
                    `ids` 为 `ids` 指定的 ID。
                    `local` 为本地已存在的全部条目 ID。
                names:
                  type: array
                  items: { type: string }
                  description: Tracker 名称，`source` 为 `tracker_names` 时必填。
                ids:
                  type: array
                  items: { type: integer }
                  description: 条目 ID，`source` 为 `ids` 时必填，且每个 ID 大于 0。
                json:
                  type: string
                  enum: [fill, overwrite]
                  description: |
                    `fill` 为只拉取本地缺失或不完整的条目。
                    `overwrite` 为全量拉取并覆盖已有 JSON。
                images:
                  type: string
                  enum: [none, fill, overwrite]
                  description: |
                    `none` 为跳过图片。
                    `fill` 为只下载缺失的图片。
                    `overwrite` 为全量下载并覆盖已有图片。
            examples:
              ids:
                value: { source: ids, ids: [51, 288], json: fill, images: fill }
              trackerNames:
                value:
                  {
                    source: tracker_names,
                    names: [user],
                    json: overwrite,
                    images: overwrite,
                  }
      responses:
        "200":
          description: 拉取已开始或没有待处理 ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 2 }
                  task_id: { type: string, example: "ae8687f0" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v0/fetch/subject: # 拉取条目
    post:
      tags: [拉取]
      summary: 拉取条目
      description: |
        从Bangumi API拉取条目的全部数据并保存到本地。
        支持`{"id": 51}`拉取单个，`{"ids": [51, 288, 9717]}`拉取多个。
        自动记录到_seshat.json，返回task_id。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, example: 51, description: 单个条目ID }
                ids:
                  {
                    type: array,
                    items: { type: integer },
                    example: [51, 288, 9717],
                    description: 多个条目ID,
                  }
            examples:
              single:
                value: { id: 51 }
              batch:
                value: { ids: [51, 288, 9717] }
      responses:
        "200":
          description: 拉取已开始
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 2 }
                  task_id:
                    {
                      type: string,
                      example: "ae8687f0",
                      description: "用于GET /api/v0/task/{task_id}",
                    }
  /api/v0/fetch/tracker: # 拉取Tracker
    post:
      tags: [拉取]
      summary: 拉取Tracker
      description: 传入Tracker名称数组，刷新其中的全部subject。返回task_id。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  {
                    type: array,
                    items: { type: string },
                    example: ["seshat", "user"],
                  }
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  names: { type: array, items: { type: string } }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/user: # 拉取用户数据
    post:
      tags: [拉取]
      summary: 拉取用户数据
      description: 拉取用户信息、头像和收藏。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  username:
                    type: string
                  task_id:
                    type: string
                    example: "ae8687f0"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v0/fetch/all: # 拉取全部
    post:
      tags: [拉取]
      summary: 拉取全部
      description: 扫描Tracker目录下所有列表，从上游全量拉取数据。覆盖已有，不删除本地多余数据。返回task_id。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/update: # 增量更新
    post:
      tags: [拉取]
      summary: 增量更新
      description: 对比所有Tracker中的ID与本地subjects.json，仅拉取本地不存在的新条目。
      responses:
        "200":
          description: 后台执行或无新增
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 3 }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/gap: # 补充数据
    post:
      tags: [拉取]
      summary: 补充数据
      description: 遍历本地subject关联的角色和人物，仅拉取本地缺失的info.json，然后补全图片并重建索引。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 42 }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/meta: # 刷新元数据
    post:
      tags: [拉取]
      summary: 刷新元数据
      description: 重新拉取所有subject/character/person的info.json，覆盖本地数据。不下载图片。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 156 }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/index: # 重建索引
    post:
      tags: [拉取]
      summary: 重建索引
      description: 扫描 api 目录下所有已保存的 JSON，重建三项索引，不包括images索引。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "rebuilding" }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/deep: # 重建全部
    post:
      tags: [拉取]
      summary: 重建全部
      description: 清空data目录，重新拉取全部Tracker数据。返回task_id。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_clean]
              properties:
                confirm_clean:
                  type: boolean
                  description: 必须为 `true`，否则返回 400。
            example: { confirm_clean: true }
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  task_id: { type: string, example: "ae8687f0" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v0/task/{task_id}: # 任务状态｜SSE
    get:
      tags: [拉取]
      summary: 任务状态｜SSE
      description: 实时推送任务进度。仅含进度信息，错误统一走 GET /api/v0/events。同时只允许一个任务运行。
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
          example: "ae8687f0"
      responses:
        "200":
          description: text/event-stream流式进度
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"step":"start","done":0,"total":326,"task":"fetch_all","label":"刷新全部"}
                  data: {"step":"subjects","done":15,"total":326,"speed":"3.2/s","phase":1,"phases":5,"phase_name":"拉取条目","status":""}
                  data: {"step":"complete","done":326,"total":326}
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v0/tasks: # 当前任务
    get:
      tags: [拉取]
      summary: 当前任务
      description: 返回正在运行的任务ID、类型和描述。页面刷新后可由此重连进度。
      responses:
        "200":
          description: 活跃任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_ActiveTask"
  /api/v0/task/cancel: # 终止任务
    post:
      tags: [拉取]
      summary: 终止任务
      description: 终止所有正在运行的任务并退出后端进程。Tauri 桌面端会自动重启后端，Server 模式下需手动重启。
      responses:
        "200":
          description: 已发送终止信号
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "cancelled" }
  # Tracker
  /api/v0/tracker: # 所有Tracker
    get:
      tags: [Tracker]
      summary: 所有Tracker
      description: 返回合并同名 TOML 和 JSON 后的 Tracker 列表，按 id 排序。
      responses:
        "200":
          description: Tracker列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_TrackerItem"
  /api/v0/tracker/create: # 创建Tracker
    post:
      tags: [Tracker]
      summary: 创建Tracker
      description: 创建一个指定名称的空Tracker文件，用户手动填入ID。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "kyoani" }
      responses:
        "200":
          description: 创建成功
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v0/tracker/import-collections: # 以用户收藏创建Tracker
    post:
      tags: [Tracker]
      summary: 以用户收藏创建Tracker
      description: 将用户收藏的条目创建Tracker。
      responses:
        "200":
          description: 导入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  count: { type: integer, example: 326 }
        "400":
          $ref: "#/components/responses/BadRequest"

  # ELO
  /api/v0/elo/pair: # 随机配对
    get:
      tags: [ELO]
      summary: 随机配对
      responses:
        "200":
          description: 两部条目的基本信息
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloPairEntry"
  /api/v0/elo/compare: # 提交结果
    post:
      tags: [ELO]
      summary: 提交结果
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                winner: { type: integer, example: 51 }
                loser: { type: integer, example: 288 }
      responses:
        "200": { description: OK }
  /api/v0/elo/ranking: # ELO评分
    get:
      tags: [ELO]
      summary: ELO评分
      description: 返回 data（有ELO+本地）、no_rating（仅有本地）、orphans（仅有ELO）
      responses:
        "200":
          description: 分组排名结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloRankingResult"
  /api/v0/elo/history: # ELO历史
    get:
      tags: [ELO]
      summary: ELO历史
      responses:
        "200":
          description: 对战历史列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EloHistory"
  /api/v0/elo/rebuild: # 重建评分
    post:
      tags: [ELO]
      summary: 重建评分
      description: 清空当前ELO评分，从history.json按时间顺序重新计算所有评分。
      responses:
        "200":
          description: 重建完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  count: { type: integer, example: 42 }

  # 事件
  /api/v0/events: # 全局事件总线
    get:
      tags: [事件]
      summary: 全局事件总线
      description: SSE 流，实时推送后端错误和警告。error 类型为持久 toast，warn 类型 8 秒自动消失。
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"type":"error","message":"图片写入失败 subject #51 large","time":1721000000}
                  data: {"type":"warn","message":"图片下载失败","time":1721000000}
  /api/v0/open-url: # 唤起浏览器
    post:
      tags: [其他]
      summary: 唤起系统浏览器
      description: 在系统默认浏览器中打开指定 URL。适用于 Tauri webview 无法打开外部链接的场景。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  {
                    type: string,
                    example: "https://github.com/Vanadiry/Seshat",
                  }
      responses:
        "200":
          description: 浏览器已唤起
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
        "400":
          $ref: "#/components/responses/BadRequest"

  # 其他
  /api/v0/info: # 实例信息
    get:
      tags: [其他]
      summary: 实例信息
      description: 返回实例名称、版本、许可证、仓库、版权与能力清单，供关于页和能力探测使用。
      responses:
        "200":
          description: 实例信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, example: "Seshat" }
                  version: { type: string, example: "2.0.0-dev.4" }
                  license: { type: string, example: "AGPL-3.0" }
                  repository:
                    {
                      type: string,
                      example: "https://github.com/Vanadiry/Seshat",
                    }
                  copyright:
                    { type: string, example: "Copyright © 2026 Vanadiry" }
                  features:
                    type: array
                    items: { type: string }
                    example:
                      - elo
                      - events
                      - fetch
                      - lists
                      - names
                      - stats
                      - tags
                      - task
                      - tracker
  /api/v0/settings: # 获取和修改设置
    get:
      tags: [其他]
      summary: 获取全部设置
      description: 返回偏好设置和服务端配置的纯 KV。
      responses:
        "200":
          description: prefs 和 config 两个 KV 对象
          content:
            application/json:
              schema:
                type: object
                properties:
                  prefs:
                    type: object
                    description: 前端偏好设置，键为 preference key，值为当前值
                    example:
                      {
                        "theme": "auto",
                        "prefer_lang": "original",
                        "username": "",
                        "subject_sort": "elo",
                        "auto_link_names": "true",
                      }
                  config:
                    type: object
                    description: config.toml 当前值，token 非空时掩码展示
                    example:
                      {
                        "bind_addr": "127.0.0.1",
                        "port": 12500,
                        "concurrency_info": 4,
                        "concurrency_image": 16,
                        "data_home": "",
                        "log_level": "warn",
                        "base_url": "https://api.bgm.tv",
                        "user_agent": "Vanadiry/Seshat/...",
                        "backend_url": "",
                        "fallback_url": "",
                        "bangumi_access_token": "",
                      }
    post:
      tags: [其他]
      summary: 修改偏好设置
      description: 传入需修改的 KV，后端校验后写入覆盖文件。设为空或默认值则删除该项。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                prefer_lang: "chinese"
                username: "Vanadiry"
      responses:
        "200":
          description: 返回 success 和 error 列表
  /api/v0/stats: # 统计数据
    get:
      tags: [其他]
      summary: 统计数据
      responses:
        "200":
          description: 图片、数据、Tracker、收藏等统计
          content:
            application/json:
              schema:
                type: object

components:
  responses:
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    BadRequest:
      description: 请求不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Conflict:
      description: 状态冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    PayloadTooLarge:
      description: 请求体过大
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"

  schemas:
    ErrorDetail:
      type: object
      required: [title, description]
      properties:
        title: { type: string, example: "Not Found" }
        description: { type: string, example: "数据不存在" }
        details:
          description: 结构化补充信息
          oneOf:
            - type: object
            - type: string
        request_id: { type: string, example: "3f9c1a7b2d4e5f60" }

    Images:
      type: object
      properties:
        large: { type: string }
        common: { type: string }
        medium: { type: string }
        small: { type: string }
        grid: { type: string }

    PersonImages:
      type: object
      properties:
        large: { type: string }
        medium: { type: string }
        small: { type: string }
        grid: { type: string }

    Paged_SubjectListItem:
      type: object
      properties:
