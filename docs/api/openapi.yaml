openapi: "3.0.0"
info:
  title: Seshat API
  description: 离线优先的 Bangumi 数据管理与浏览工具。
  version: "1.2.0"
servers:
  - url: http://127.0.0.1:12500
    description: Seshat 本地后端
tags:
  - name: 条目
  - name: 角色
  - name: 人物
  - name: 用户
  - name: 标签
  - name: 拉取
  - name: Tracker
  - name: ELO
  - name: 其他

paths:
  # 条目
  /api/v0/subjects/list:                # 所有条目
    get:
      tags: [条目]
      summary: 所有条目
      operationId: listSubjects
      responses:
        "200":
          description: 条目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectListItem"
  /api/v0/subjects/name:                # 条目对应ID索引
    get:
      tags: [条目]
      summary: 条目对应ID索引
      operationId: subjectNames
      responses:
        "200":
          description: NAME对应ID字典
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
  /api/v0/subjects/{id}:                # 条目详情
    get:
      tags: [条目]
      summary: 条目详情
      operationId: getSubject
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 51
      responses:
        "200":
          description: 完整条目数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v0/subjects/{id}/image:          # 条目图像
    get:
      tags: [条目]
      summary: 条目图像
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [large, grid, small], default: grid } }
      responses:
        "200": { description: 图像文件 }
        "404": { description: 图片未缓存 }
  /api/v0/subjects/{id}/characters:     # 条目关联的角色
    get:
      tags: [条目]
      summary: 条目关联的角色
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 角色数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedCharacter"
  /api/v0/subjects/{id}/persons:        # 条目关联的人物
    get:
      tags: [条目]
      summary: 条目关联的人物
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 人物数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedPerson"
  /api/v0/subjects/{id}/subjects:       # 条目关联的条目
    get:
      tags: [条目]
      summary: 条目关联的条目
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 关联条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectRelation"
  /api/v0/search/subjects:              # 搜索条目
    post:
      tags: [条目]
      summary: 搜索条目
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string, example: "CLANNAD" }
                filter: { type: object, example: { type: [2] } }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
  /api/v0/episodes:                     # 条目关联的剧集
    get:
      tags: [条目]
      summary: 条目关联的剧集列表
      parameters:
        - { name: subject_id, in: query, required: true, schema: { type: integer }, example: 51 }
      responses:
        "200":
          description: 剧集数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Episode"
  # 角色
  /api/v0/characters/list:              # 所有角色
    get:
      tags: [角色]
      summary: 所有角色
      operationId: listCharacters
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NameEntry"
  /api/v0/characters/name:              # 角色对应ID索引
    get:
      tags: [角色]
      summary: 角色对应ID索引
      operationId: characterNames
      responses:
        "200":
          description: NAME对应ID字典
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
  /api/v0/characters/{id}:              # 角色详情
    get:
      tags: [角色]
      summary: 角色详情
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 角色完整数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
  /api/v0/characters/{id}/image:        # 角色图像
    get:
      tags: [角色]
      summary: 角色图像
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [large, grid, small], default: grid } }
      responses:
        "200": { description: 图片文件 }
        "404": { description: 图片未缓存 }
  /api/v0/characters/{id}/persons:      # 角色关联的人物
    get:
      tags: [角色]
      summary: 角色关联的人物
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 人物数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string }
                    name: { type: string }
                    id: { type: integer }
                    subject_id: { type: integer }
                    subject_name: { type: string }
  /api/v0/characters/{id}/subjects:     # 角色关联的条目
    get:
      tags: [角色]
      summary: 角色关联的条目
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string, example: "主角" }
                    name: { type: string, example: "CLANNAD" }
                    name_cn: { type: string }
                    id: { type: integer }
  /api/v0/search/characters:            # 搜索角色
    post:
      tags: [角色]
      summary: 搜索角色
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string, example: "古河渚" }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
  # 人物
  /api/v0/persons/list:                 # 所有人物
    get:
      tags: [人物]
      summary: 所有人物
      operationId: listPersons
      responses:
        "200":
          description: 人物列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NameEntry"
  /api/v0/persons/name:                 # 人物对应ID索引
    get:
      tags: [人物]
      summary: 人物对应ID索引
      operationId: personNames
      responses:
        "200":
          description: NAME对应ID字典
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
  /api/v0/persons/{id}:                 # 人物详情
    get:
      tags: [人物]
      summary: 人物详情
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 人物完整数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
  /api/v0/persons/{id}/image:           # 人物图像
    get:
      tags: [人物]
      summary: 人物图像
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [large, grid, small], default: grid } }
      responses:
        "200": { description: 图片文件 }
        "404": { description: 图片未缓存 }
  /api/v0/persons/{id}/characters:      # 人物关联的角色
    get:
      tags: [人物]
      summary: 人物关联的角色
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 角色数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string }
                    name: { type: string }
                    id: { type: integer }
                    subject_id: { type: integer }
                    subject_name: { type: string }
  /api/v0/persons/{id}/subjects:        # 人物关联的条目
    get:
      tags: [人物]
      summary: 人物关联的条目
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string, example: "导演" }
                    name: { type: string, example: "CLANNAD" }
                    name_cn: { type: string }
                    id: { type: integer }
  /api/v0/search/persons:               # 搜索人物
    post:
      tags: [人物]
      summary: 搜索人物
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string, example: "麻枝准" }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
  # 用户
  /api/v0/users/{username}:             # 用户信息
    get:
      tags: [用户]
      summary: 用户信息
      parameters:
        - { name: username, in: path, required: true, schema: { type: string }, example: "vanadiry" }
      responses:
        "200":
          description: 用户详细数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v0/users/{username}/collections: # 用户收藏
    get:
      tags: [用户]
      summary: 用户收藏
      parameters:
        - { name: username, in: path, required: true, schema: { type: string }, example: "vanadiry" }
      responses:
        "200":
          description: 收藏列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        subject_id: { type: integer }
                        type: { type: integer, description: "1=想看，2=看过，3=抛弃" }
  /api/v0/users/{username}/avatar:      # 用户头像
    get:
      tags: [用户]
      summary: 用户头像
      parameters:
        - { name: username, in: path, required: true, schema: { type: string }, example: "vanadiry" }
        - { name: type, in: query, schema: { type: string, enum: [large], default: large } }
      responses:
        "200":
          description: 头像图片
          content:
            image/*:
              schema:
                type: string
                format: binary
  # 标签
  /api/v0/tags:                         # 所有标签
    get:
      tags: [标签]
      summary: 所有标签
      responses:
        "200":
          description: 数量降序的标签数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagItem"
  /api/v0/tags/{name}/subjects:         # 标签关联的条目
    get:
      tags: [标签]
      summary: 标签关联的条目
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: 条目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectListItem"
  /api/v0/search/tags:                  # 搜索标签
    post:
      tags: [标签]
      summary: 搜索标签
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string, example: "治愈" }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
  # 拉取
  /api/v0/fetch/subject:                # 拉取条目
    post:
      tags: [拉取]
      summary: 拉取条目
      description: |
        从Bangumi API拉取条目的全部数据并缓存到本地。
        支持`{"id": 51}`拉取单个，`{"ids": [51, 288, 9717]}`拉取多个。
        自动记录到_seshat.json，返回task_id。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, example: 51, description: 单个条目ID }
                ids: { type: array, items: { type: integer }, example: [51, 288, 9717], description: 多个条目ID }
            examples:
              single:
                value: { id: 51 }
              batch:
                value: { ids: [51, 288, 9717] }
      responses:
        "200":
          description: 拉取已开始
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 2 }
                  task_id: { type: string, example: "ae8687f0", description: "用于GET /api/v0/task/{task_id}" }
  /api/v0/fetch/tracker:                # 拉取Tracker
    post:
      tags: [拉取]
      summary: 拉取Tracker
      description: 传入Tracker名称数组，刷新其中的全部subject。返回task_id。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                names: { type: array, items: { type: string }, example: ["seshat", "user"] }
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  names: { type: array, items: { type: string } }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/user:                   # 拉取用户数据
    post:
      tags: [拉取]
      summary: 拉取用户数据
      description: 拉取用户信息、头像和收藏。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  username:
                    type: string
                  task_id:
                    type: string
                    example: "ae8687f0"
        "400":
          description: 未设置用户名
  /api/v0/fetch/all:                    # 拉取全部
    post:
      tags: [拉取]
      summary: 拉取全部
      description: 扫描Tracker目录下所有列表，从上游全量拉取数据。覆盖已有，不删除本地多余数据。返回task_id。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/update:                 # 增量更新
    post:
      tags: [拉取]
      summary: 增量更新
      description: 对比所有Tracker中的ID与本地subjects.json，仅拉取本地不存在的新条目。
      responses:
        "200":
          description: 后台执行或无新增
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 3 }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/gap:                    # 补充数据
    post:
      tags: [拉取]
      summary: 补充数据
      description: 遍历本地subject关联的角色和人物，仅拉取本地缺失的info.json，然后补全图片并重建索引。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 42 }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/meta:                   # 刷新元数据
    post:
      tags: [拉取]
      summary: 刷新元数据
      description: 重新拉取所有subject/character/person的info.json，覆盖本地缓存。不下载图片。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 156 }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/index:                  # 重建索引
    post:
      tags: [拉取]
      summary: 重建索引
      description: 扫描api目录下所有已缓存的JSON，重建三项索引，不包括images索引。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "rebuilding" }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/deep:                   # 重建全部
    post:
      tags: [拉取]
      summary: 重建全部
      description: 清空data目录，重新拉取全部Tracker数据。返回task_id。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/task/{task_id}:               # 任务状态｜SSE
    get:
      tags: [拉取]
      summary: 任务状态｜SSE
      description: 实时推送任务进度。同时只允许一个任务运行，新任务在已有任务完成前返回409。
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
          example: "ae8687f0"
      responses:
        "200":
          description: text/event-stream流式进度，首条消息含task类型和label描述
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"step":"start","done":0,"total":326,"task":"fetch_all","label":"刷新全部"}
                  data: {"step":"subjects","done":15,"total":326,"speed":"3.2/s","status":""}
                  data: {"step":"complete","done":326,"total":326}
        "409":
          description: 已有任务在运行
  /api/v0/tasks:                        # 当前任务
    get:
      tags: [拉取]
      summary: 当前任务
      description: 返回正在运行的任务ID、类型和描述。页面刷新后可由此重连进度。
      responses:
        "200":
          description: 活跃任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: "ae8687f0" }
                        task: { type: string, example: "fetch_all" }
                        label: { type: string, example: "刷新全部" }
  /api/v0/task/cancel:                  # 终止任务
    post:
      tags: [拉取]
      summary: 终止任务
      description: 终止所有正在运行的任务并退出后端进程。前端将失去连接，需重启后端。
      responses:
        "200":
          description: 已发送终止信号，进程即将退出
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "cancelled" }
  # Tracker
  /api/v0/tracker:                      # 所有Tracker
    get:
      tags: [Tracker]
      summary: 所有Tracker
      responses:
        "200":
          description: Tracker列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackerItem"
  /api/v0/tracker/create:               # 创建Tracker
    post:
      tags: [Tracker]
      summary: 创建Tracker
      description: 创建一个指定名称的空Tracker文件，用户手动填入ID。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "kyoani" }
      responses:
        "200":
          description: 创建成功
        "409":
          description: Tracker已存在
  /api/v0/tracker/import-collections:   # 以用户收藏创建Tracker
    post:
      tags: [Tracker]
      summary: 以用户收藏创建Tracker
      description: 将用户收藏的条目创建Tracker。
      responses:
        "200":
          description: 导入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  count: { type: integer, example: 326 }
        "400":
          description: 收藏数据不存在或格式无效

  # ELO
  /api/v0/elo/pair:                     # 随机配对
    get:
      tags: [ELO]
      summary: 随机配对
      responses:
        "200":
          description: 两部条目的基本信息
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloPairEntry"
  /api/v0/elo/compare:                  # 提交结果
    post:
      tags: [ELO]
      summary: 提交结果
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                winner: { type: integer, example: 51 }
                loser: { type: integer, example: 288 }
      responses:
        "200": { description: OK }
  /api/v0/elo/ranking:                  # ELO评分
    get:
      tags: [ELO]
      summary: ELO评分
      description: 返回entries（有ELO+本地）、no_rating（仅有本地）、orphans（仅有ELO）
      responses:
        "200":
          description: 分组排名结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloRankingResult"
  /api/v0/elo/history:                  # ELO历史
    get:
      tags: [ELO]
      summary: ELO历史
      responses:
        "200":
          description: 对战历史列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloHistory"
  /api/v0/elo/rebuild:                  # 重建评分
    post:
      tags: [ELO]
      summary: 重建评分
      description: 清空当前ELO评分，从history.json按时间顺序重新计算所有评分。
      responses:
        "200":
          description: 重建完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  count: { type: integer, example: 42 }

# 其他
  /api/v0/settings:                     # 获取和修改设置
    get:
      tags: [其他]
      summary: 获取全部设置
      description: 返回偏好设置和服务端配置的纯 KV。
      responses:
        "200":
          description: prefs 和 config 两个 KV 对象
          content:
            application/json:
              schema:
                type: object
                properties:
                  prefs:
                    type: object
                    description: 前端偏好设置，键为 preference key，值为当前值
                    example: { "theme": "auto", "prefer_lang": "original", "username": "", "subject_sort": "elo", "auto_link_names": "true" }
                  config:
                    type: object
                    description: config.toml 当前值，token 非空时掩码展示
                    example: { "bind_addr": "127.0.0.1", "port": 12500, "concurrency_info": 4, "concurrency_image": 16, "data_home": "", "log_level": "warn", "base_url": "https://api.bgm.tv", "user_agent": "Vanadiry/Seshat/...", "backend_url": "", "fallback_url": "", "bangumi_access_token": "" }
    post:
      tags: [其他]
      summary: 修改偏好设置
      description: 传入需修改的 KV，后端校验后写入覆盖文件。设为空或默认值则删除该项。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                prefer_lang: "chinese"
                username: "Vanadiry"
      responses:
        "200":
          description: 返回 success 和 error 列表
  /api/v0/stats:                        # 统计数据
    get:
      tags: [其他]
      summary: 统计数据
      responses:
        "200":
          description: 图片、缓存、Tracker、收藏等统计
          content:
            application/json:
              schema:
                type: object

components:
  responses:
    NotFound:
      description: 资源不存在（未缓存）

  schemas:
    SubjectListItem:
      type: object
      properties:
        id: { type: integer, example: 51 }
        name: { type: string, example: "CLANNAD -クラナド-" }
        name_cn: { type: string, example: "CLANNAD" }
        score: { type: number, example: 8.4 }
        platform: { type: string, example: "TV" }
        date: { type: string, example: "2007-10-04" }
        image: { type: string, example: "/api/v0/subjects/51/image?type=grid" }

    NameEntry:
      type: object
      properties:
        id: { type: integer, example: 4 }
        name: { type: string, example: "古河渚" }
        name_cn: { type: string, example: "古河渚" }

    Subject:
      type: object
      properties:
        id: { type: integer, example: 51 }
        type: { type: integer, example: 2 }
        name: { type: string, example: "CLANNAD -クラナド-" }
        name_cn: { type: string, example: "CLANNAD" }
        summary: { type: string, example: "故事发生在一个小镇上…" }
        date: { type: string, example: "2007-10-04" }
        platform: { type: string, example: "TV" }
        eps: { type: integer, example: 23 }
        total_episodes: { type: integer, example: 23 }
        rating:
          type: object
          properties:
            rank: { type: integer, example: 74 }
            total: { type: integer, example: 25648 }
            score: { type: number, example: 8.4 }
            count:
              type: object
              additionalProperties: { type: integer }
              example: { "1": 102, "5": 398, "10": 5268 }
        collection:
          type: object
          properties:
            wish: { type: integer, example: 7189 }
            collect: { type: integer, example: 39029 }
            doing: { type: integer, example: 2306 }
            on_hold: { type: integer, example: 1659 }
            dropped: { type: integer, example: 420 }
        tags:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: "Clannad" }
              count: { type: integer, example: 6682 }
