[package]
name = "Seshat"
version = "2.0.0-dev.10"
description = "离线优先的 Bangumi 数据管理与浏览工具"
authors = ["Vanadiry"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["webview-data-url"] }
