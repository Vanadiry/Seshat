name: Build

permissions:
  contents: write
  actions: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - run: pnpm install && pnpm run build

      - name: Build Server
        run: |
          mkdir -p dist/server
          V="${GITHUB_REF_NAME#v}"
          TARGETS="darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64"
          for t in $TARGETS; do
            goos=${t%/*}; goarch=${t#*/}
            ext=""; [ "$goos" = "windows" ] && ext=".exe"
            label=$(echo "$goos" | sed 's/darwin/macos/;s/linux/linux/;s/windows/windows/')
            name="seshat-server-${V}-${label}-${goarch}${ext}"
            out="dist/server/${name}"
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "$out" .
            echo "OK. $name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/server/

  desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            goarch: arm64
            label: macos
          - os: macos-latest
            target: x86_64-apple-darwin
            goarch: amd64
            label: macos
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goarch: amd64
            label: linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goarch: arm64
            label: linux
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            goarch: amd64
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mingw -y --no-progress
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: pnpm install

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/desktop
          V="${GITHUB_REF_NAME#v}"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          arch="${{ matrix.goarch }}"
          case "${{ runner.os }}" in
            macOS)
              find "$bundle/dmg" -name "*.dmg" -exec cp {} "dist/desktop/seshat-desktop-${V}-${{ matrix.label }}-${arch}.dmg" \; ;;
            Windows)
              find "$bundle/nsis" -name "*.exe" -exec cp {} "dist/desktop/seshat-desktop-${V}-${{ matrix.label }}-${arch}.exe" \; ;;
            Linux)
              find "$bundle/appimage" -name "*.AppImage" -exec cp {} "dist/desktop/seshat-desktop-${V}-${{ matrix.label }}-${arch}.AppImage" \; ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}-${{ matrix.goarch }}
          path: dist/desktop/

  release:
    needs: [server, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir release
          find dist -type f -not -name "*.md" | while read f; do
            cp "$f" "release/$(basename "$f")"
          done
      - name: Extract changelog
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/release
          sed -n "/^## \[$V\]/,/^## \[/p" CHANGELOG.md | sed '$d' > /tmp/release/body.md
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: /tmp/release/body.md
          files: |
            release/*
          draft: true
