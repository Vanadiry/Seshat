<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#1d1d1d]">
<head>
<meta charset="utf-8"><meta name="view-transition" content="same-origin"><meta name="viewport" content="width=device-width, initial-scale=1"><title>评分 | Seshat</title>

<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
#pk-left, #pk-right { transition: flex .35s ease; overflow: hidden; position: relative; }
#pk-left::after, #pk-right::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.85); z-index: 10; opacity: 0; transition: opacity .35s ease; pointer-events: none; }
#pk-left.shrunk::after, #pk-right.shrunk::after { opacity: 1; }
#pk-left.shrunk, #pk-right.shrunk { flex: 0 0 200px; cursor: pointer; }
.cancel-hint { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; font-size: 13px; color: rgba(255,255,255,.85); pointer-events: none; opacity: 0; transition: opacity .35s ease; }
#pk-left.shrunk .cancel-hint, #pk-right.shrunk .cancel-hint { opacity: 1; }
.confirm-bar { transition: opacity .35s ease; opacity: 0; }
.confirm-bar.show { opacity: 1; }
</style>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">
<div id="topbar"></div>
<main class="max-w-[900px] mx-auto p-6">
  <!-- PK区 -->
  <div class="flex items-center gap-3 mb-4">
    <span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span>
    <span class="font-bold">评分</span>
    <button onclick="loadPair()" class="ml-2 px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white">刷新</button>
  </div>
  <div id="pk-area" class="flex gap-2 mb-6" style="min-height:280px">
    <div id="pk-left" class="flex-1 bg-[#202028] border border-[rgba(255,255,255,.08)] rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer relative" onclick="handlePK('left')">
      <div id="pk-left-img" class="relative shrink-0 rounded-lg overflow-hidden bg-[#151518]" style="width:100px;aspect-ratio:1">
        <img id="pk-left-img-el" src="" class="w-full h-full object-cover">
        <span id="pk-left-id" class="absolute top-0.5 right-0.5 text-[9px] font-semibold bg-black/60 text-white px-1 py-px rounded"></span>
      </div>
      <div id="pk-left-name" class="text-sm font-semibold mt-3 text-center"></div>
      <div id="pk-left-sub" class="text-xs text-sub mt-0.5 text-center"></div>
      <div id="pk-left-confirm" class="confirm-bar absolute bottom-0 left-0 right-0 flex justify-center pb-3">
        <span class="text-[#FE8A95] font-semibold text-sm">再次点击以确认该条目胜出</span>
      </div>
      <div class="cancel-hint">点击此处取消</div>
    </div>
    <div id="pk-right" class="flex-1 bg-[#202028] border border-[rgba(255,255,255,.08)] rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer relative" onclick="handlePK('right')">
      <div id="pk-right-img" class="relative shrink-0 rounded-lg overflow-hidden bg-[#151518]" style="width:100px;aspect-ratio:1">
        <img id="pk-right-img-el" src="" class="w-full h-full object-cover">
        <span id="pk-right-id" class="absolute top-0.5 right-0.5 text-[9px] font-semibold bg-black/60 text-white px-1 py-px rounded"></span>
      </div>
      <div id="pk-right-name" class="text-sm font-semibold mt-3 text-center"></div>
      <div id="pk-right-sub" class="text-xs text-sub mt-0.5 text-center"></div>
      <div id="pk-right-confirm" class="confirm-bar absolute bottom-0 left-0 right-0 flex justify-center pb-3">
        <span class="text-[#FE8A95] font-semibold text-sm">再次点击以确认该条目胜出</span>
      </div>
      <div class="cancel-hint">点击此处取消</div>
    </div>
  </div>
  <div id="pk-loading" class="text-center py-20 text-sub">加载中…</div>

  <!-- 历史 -->
  <div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">历史</span></div>
  <div id="history-area"><div class="text-center py-10 text-sub">加载中…</div></div>
  <div id="history-pager" class="mt-3 text-center"></div>
</main>
<script src="assets/app.js"></script>
<script>
var _pair = null, _state = 'idle', _history = [], _histShowing = 0, _names = {};

function loadPair() {
  _state = 'idle';
  document.getElementById('pk-loading').style.display = 'block';
  document.getElementById('pk-area').style.display = 'none';
  api('/v0/elo/pair').then(function(data) {
    document.getElementById('pk-loading').style.display = 'none';
    if (!data || data.length < 2) {
      document.getElementById('pk-loading').innerHTML = '<div class="text-center py-10 text-sub">需要至少 2 个已缓存条目</div>';
      document.getElementById('pk-loading').style.display = 'block';
      return;
    }
    _pair = data;
    _state = 'idle';
    renderPair();
    document.getElementById('pk-area').style.display = '';
  });
}

function renderPair() {
  ['left','right'].forEach(function(side, i) {
    var it = _pair[i];
    var imgEl = document.getElementById('pk-'+side+'-img-el');
    imgEl.src = img('subject', it.id, 'grid');
    imgEl.onerror = function() { this.src = '/images/no-image.png'; };
    document.getElementById('pk-'+side+'-id').textContent = '#'+it.id;
    document.getElementById('pk-'+side+'-name').textContent = primaryName(it.name, it.name_cn);
    var sub = subName(it.name, it.name_cn);
    document.getElementById('pk-'+side+'-sub').textContent = sub || '';
    document.getElementById('pk-'+side+'-sub').style.display = sub ? '' : 'none';
    document.getElementById('pk-'+side+'-confirm').classList.remove('show');
  });
  resetPKStyles();
}

function resetPKStyles() {
  ['left','right'].forEach(function(s) {
    var el = document.getElementById('pk-'+s);
    el.classList.remove('shrunk');
    el.style.flex = '1';
    el.style.opacity = '1';
    document.getElementById('pk-'+s+'-confirm').classList.remove('show');
  });
}

function handlePK(side) {
  if (_state === 'idle') {
    // Expand clicked side, shrink other
    _state = side;
    var winner = document.getElementById('pk-'+side);
    var loser = document.getElementById('pk-'+(side==='left'?'right':'left'));
    winner.style.flex = '1.2';
    winner.style.opacity = '1';
    winner.classList.remove('shrunk');
    document.getElementById('pk-'+side+'-confirm').classList.add('show');
    loser.style.flex = '0 0 200px';
    loser.classList.add('shrunk');

  } else if (_state === side) {
    // Confirm — submit
    var loserSide = side === 'left' ? 'right' : 'left';
    var winnerId = _pair[side==='left'?0:1].id;
    var loserId = _pair[loserSide==='left'?0:1].id;
    fetch(API + '/v0/elo/compare', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({winner: winnerId, loser: loserId})
    }).then(function() { loadPair(); loadHistory(); });
  } else {
    // Clicked the shrunk card — cancel, go back to idle
    _state = 'idle';
    resetPKStyles();
  }
}

// ── History ──
function loadHistory() {
  api('/v0/elo/history').then(function(data) {
    _history = (data && data.length) ? data.slice().reverse() : [];
    _histShowing = Math.min(10, _history.length);
    renderHistory();
  });
}

function renderHistory() {
  var items = _history.slice(0, _histShowing);

  for (var i = 0; i < items.length; i++) {
    var w = items[i].winner, l = items[i].loser;
    _names[w] = _names[w] || {name: '加载中…', name_cn: ''};
    _names[l] = _names[l] || {name: '加载中…', name_cn: ''};
    [w, l].forEach(function(id) {
      if (!_names[id]._fetched) {
        _names[id]._fetched = true;
        api('/v0/subjects/' + id).then(function(s) {
          if (s && s.id) _names[id] = {name: s.name||'', name_cn: s.name_cn||'', _fetched: true};
          else _names[id] = {name: null, name_cn: null, _fetched: true};
          renderHistory();
        });
      }
    });
  }

  function sideHTML(id) {
    var no = _names[id] || {name:'加载中…', name_cn:''};
    var n = no.name;
    var primary = n === '加载中…' ? '加载中…' : (n ? primaryName(n, no.name_cn||'') : '无标题');
    var sub = n === '加载中…' ? '' : (n ? subName(n, no.name_cn||'') : '');
    return '<div style="flex:1 1 50%;max-width:50%;overflow:hidden" class="flex items-center gap-3 py-1.5 pl-2">'+
      '<img src="'+img('subject', id, 'grid')+'" '+imgOnError('subject', id, 'grid')+' class="w-8 h-8 rounded object-cover bg-[#151518] shrink-0">'+
      '<div class="min-w-0 flex-1"><div class="text-sm font-semibold truncate">'+primary+'</div>'+(sub?'<div class="text-xs text-sub truncate">'+sub+'</div>':'')+'</div>'+
      '<span class="text-xs text-sub shrink-0">#'+id+'</span></div>';
  }

  function timeHTML(t) {
    if (!t) return '';
    var d = new Date(t);
    var date = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var time = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
    return '<div class="w-[100px] shrink-0 flex flex-col items-center justify-center py-1.5"><div class="text-sm text-sub">'+date+'</div><div class="text-xs text-sub">'+time+'</div></div>';
  }

  var html = '<div class="flex gap-7 text-xs text-sub font-semibold mb-1 border-b border-[rgba(255,255,255,.06)] pb-1"><div class="flex-1 text-center">胜</div><div class="flex-1 text-center">负</div><div class="w-[100px] shrink-0 text-center">时间</div></div>';
  for (var i = 0; i < items.length; i++) {
    var bg = i % 2 === 0 ? 'bg-[#202028]' : 'bg-[#1a1a1e]';
    html += '<div class="flex gap-7 border border-transparent '+bg+'">'+sideHTML(items[i].winner)+sideHTML(items[i].loser)+timeHTML(items[i].time)+'</div>';
  }
  document.getElementById('history-area').innerHTML = html;

  // Pagination
  var ph = document.getElementById('history-pager');
  if (_history.length > 10) {
    var remaining = _history.length - _histShowing;
    ph.innerHTML = '<span class="text-xs text-sub">当前展示 '+_histShowing+'，共 '+_history.length+' 条记录</span>'+
      (remaining > 0 ? ' <button onclick="showMoreHistory()" class="ml-3 px-3 py-1 rounded-lg border border-[rgba(255,255,255,.12)] bg-transparent text-sub text-xs cursor-pointer hover:bg-[#30303b] hover:text-white">展开更多 10 条</button>' : '');
  } else {
    ph.innerHTML = _history.length ? '<span class="text-xs text-sub">共 '+_history.length+' 条记录</span>' : '';
  }
}

function showMoreHistory() { _histShowing = Math.min(_histShowing + 10, _history.length); renderHistory(); }

loadPair();
loadHistory();
</script>
</body>
</html>
