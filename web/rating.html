<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>评分 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            #pk-left,
            #pk-right {
                transition: flex 0.35s ease;
                overflow: hidden;
                position: relative;
            }
            #pk-left::after,
            #pk-right::after {
                content: "";
                position: absolute;
                inset: 0;
                background: var(--c-pk-overlay);
                z-index: 10;
                opacity: 0;
                transition: opacity 0.35s ease;
                pointer-events: none;
            }
            #pk-left.shrunk::after,
            #pk-right.shrunk::after {
                opacity: 1;
            }
            #pk-left.shrunk,
            #pk-right.shrunk {
                flex: 0 0 200px;
                cursor: pointer;
            }
            .cancel-hint {
                position: absolute;
                inset: 0;
                z-index: 20;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding-top: 12px;
                font-size: 13px;
                color: rgba(255, 255, 255, 0.85);
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.35s ease;
            }
            #pk-left.shrunk .cancel-hint,
            #pk-right.shrunk .cancel-hint {
                opacity: 1;
            }
            .confirm-bar {
                background: linear-gradient(
                    to bottom,
                    var(--c-active),
                    transparent
                );
                padding-top: 12px;
                transition: opacity 0.35s ease;
                opacity: 0;
            }
            .confirm-bar.show {
                opacity: 1;
            }
            #pk-area.pk-picked #pk-left-name,
            #pk-area.pk-picked #pk-right-name,
            #pk-area.pk-picked #pk-left-sub,
            #pk-area.pk-picked #pk-right-sub {
                text-overflow: clip;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>
        <main id="view" class="max-w-[900px] mx-auto p-6"></main>

        <script src="assets/app.min.js"></script>
        <script type="module" src="assets/rating.js"></script>
    </body>
</html>
