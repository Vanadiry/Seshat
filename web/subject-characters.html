<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#181818]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>角色列表</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#181818',card:'#242424',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95','pink-bg':'#3B3033'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>

<main id="view" class="max-w-[900px] mx-auto p-6"></main>

<script src="assets/app.js"></script>
<script>
(async () => {
  const SID = new URLSearchParams(location.search).get('id');
  const s = (await api('/api/v1/subjects/'+SID));
  const chars = (await api('/api/v1/subjects/'+SID+'/characters'))||[];

  document.getElementById('view').innerHTML = `
    <a href="/subject.html?id=${SID}" class="text-sub text-sm no-underline hover:text-white mb-4 inline-block">← 返回动画</a>
    <h2 class="text-xl font-bold mb-1">${s.name_cn||s.name} · 角色</h2>
    <p class="text-sm text-sub mb-6">${chars.length} 个角色</p>
    <div class="flex flex-col gap-1">${chars.map(c => `
      <div class="flex gap-4 items-start bg-[#242424] border border-[rgba(255,255,255,.08)] rounded-lg p-3">
        <img src="${img('character',c.id,'grid')}" onerror="this.remove()" class="w-[75px] h-[100px] rounded-lg object-cover bg-[#1a1a23] shrink-0">
        <div class="flex-1 min-w-0">
          <div class="font-semibold">${c.name}</div>
          <div class="flex flex-wrap gap-1.5 mt-1">
            <span class="bg-[#FE8A95] text-white px-2 py-0.5 rounded-md text-[11px] font-semibold">${c.relation}</span>
            ${c.gender?`<span class="text-[11px] text-sub">性别:${c.gender}</span>`:''}
            ${c.infobox?(()=>{try{const d=JSON.parse(c.infobox);return d.filter(i=>i.key==='生日'||i.key==='身高').map(i=>`<span class="text-[11px] text-sub">${i.value}</span>`).join('')}catch(e){return''}})():''}
          </div>
          ${c.actors?.length ? `
          <div class="flex items-center gap-2 mt-2">
            ${c.actors.map(a => `
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] text-sub">CV:</span>
                <span class="text-[13px] font-semibold cursor-pointer hover:text-[#FE8A95]" onclick="location.href='/person.html?id=${a.id}'">${a.name}</span>
              </div>`).join('')}
          </div>`:''}
        </div>
      </div>`).join('')}</div>`;
})();
</script>
</body>
</html>
