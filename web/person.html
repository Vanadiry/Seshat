<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#181818]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>人物详情</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#181818',card:'#242424',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>

<main id="view" class="max-w-[1000px] mx-auto p-6"></main>

<script src="assets/app.js"></script>
<script>
(async () => {
  const ID = new URLSearchParams(location.search).get('id');
  const p = (await api('/api/v1/persons/'+ID));
  if (!p) { document.getElementById('view').innerHTML='<p class="text-sub">未找到</p>'; return; }

  const info = (() => { try { const d=JSON.parse(p.infobox||'[]'); const o={}; for(const i of d) if(i.key && typeof i.value==='string') o[i.key]=i.value; return o; } catch(e){return {}} })();

  document.getElementById('view').innerHTML = `
    <a href="javascript:history.back()" class="text-sub text-sm no-underline hover:text-white mb-4 inline-block">← 返回</a>
    <div class="text-xs text-sub mb-4">BgmID: ${p.id}</div>
    <div class="flex flex-col md:flex-row gap-6">
      <div class="w-full md:w-[220px] shrink-0">
        <img src="${img('person',p.id,'large')}" onerror="this.remove()" class="w-full rounded-xl">
        <div class="mt-3 flex flex-col gap-0.5">${Object.entries(info).map(([k,v]) => `<div class="flex justify-between py-1 border-b border-[rgba(255,255,255,.06)] text-[13px]"><span class="text-sub">${k}</span><span>${v}</span></div>`).join('')}</div>
      </div>
      <div class="flex-1">
        <h2 class="text-xl font-bold mb-2">${p.name}</h2>
        ${p.career ? `<div class="flex flex-wrap gap-1.5 mb-4">${(typeof p.career==='string'?JSON.parse(p.career):p.career||[]).map(c => `<span class="bg-[#3B3033] text-[#FE8A95] px-2 py-0.5 rounded-md text-[11px]">${c}</span>`).join('')}</div>` : ''}
        ${p.summary ? `<p class="text-[13px] leading-relaxed text-sub">${p.summary}</p>` : ''}
      </div>
    </div>`;
})();
</script>
</body>
</html>
