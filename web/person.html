<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#1d1d1d]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>人物详情</title>
<script src="/assets/tailwindcss-3.4.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#1d1d1d',card:'#2a2a2a',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>
<div id="detail-header" class="sticky top-12 z-40 bg-[#1c1c22] border-b border-[rgba(255,255,255,.12)]"></div>
<main id="view" class="max-w-[1200px] mx-auto p-6"></main>

<script src="assets/app.js"></script>
<script>
(async () => {
  const ID = new URLSearchParams(location.search).get('id');
  if (!ID) { document.getElementById('view').innerHTML='<p class="text-sub text-center py-20">缺少人物 ID</p>'; return; }

  const p = (await api('/v0/persons/'+ID));
  if (!p) { document.getElementById('view').innerHTML='<p class="text-sub text-center py-10">未找到该人物（ID: '+ID+'）</p>'; return; }
  await loadPersonMap();

  document.getElementById('detail-header').innerHTML='<div class="max-w-[1200px] mx-auto px-6 h-12 py-0 flex items-center gap-3">'+
    '<a href="javascript:history.back()" class="text-sub text-sm no-underline hover:text-white shrink-0">← 返回</a>'+
    '<span class="text-xl font-bold truncate">'+primaryName(p.name,'')+'</span>'+
    '<span class="text-xs text-sub ml-auto shrink-0">ID: '+p.id+'</span></div>';

  var items = infoboxData(p);
  var infoHtml = '';
  for (var i=0; i<items.length; i++) {
    infoHtml += '<div class="py-1 border-b border-[rgba(255,255,255,.06)] text-[13px]"><span class="text-sub">'+items[i][0]+': </span><span>'+items[i][1]+'</span></div>';
  }

  document.getElementById('view').innerHTML =
    '<div class="flex flex-col md:flex-row gap-6">'+
    '<div class="w-full md:w-[260px] shrink-0">'+
    '<img src="'+img('person',p.id,'large')+'" onerror="this.remove()" class="w-full rounded-xl">'+
    (infoHtml ? '<div class="mt-3 flex flex-col gap-0.5">'+infoHtml+'</div>' : '')+
    '</div>'+
    '<div class="flex-1 min-w-0">'+
    (p.career ? '<div class="flex flex-wrap gap-1.5 mb-4">'+(typeof p.career==='string'?JSON.parse(p.career):p.career||[]).map(function(c){return '<span class="bg-[#403638] text-[#FE8A95] px-2 py-0.5 rounded-md text-[11px]">'+c+'</span>'}).join('')+'</div>' : '')+
    (p.summary ? '<p class="text-[13px] leading-relaxed text-sub mb-6">'+p.summary+'</p>' : '')+
    (p.subjects&&p.subjects.length ?
    '<div><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">参与作品</span></div>'+
    '<div class="flex flex-wrap gap-2">'+p.subjects.map(function(s){return '<span onclick="location.href=\'/subject.html?id='+s.id+'\'" class="bg-[#2a2a2a] border border-[rgba(255,255,255,.12)] rounded-lg px-3 py-1.5 text-sm cursor-pointer hover:border-[#FE8A95]">'+s.name+'</span>'}).join('')+'</div></div>' : '')+
    '</div></div>';
})();
</script>
</body>
</html>
