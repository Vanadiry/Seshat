<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#1d1d1d]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>搜索</title>
<script src="/assets/tailwindcss-3.4.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#1d1d1d',card:'#2a2a2a',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95','pink-bg':'#403638'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>

<main class="max-w-[700px] mx-auto p-6">
  <div class="mt-12 flex gap-2">
    <input id="q" placeholder="搜索…" class="flex-1 px-4 py-3 rounded-lg border border-[rgba(255,255,255,.12)] bg-[#151518] text-base" onkeydown="if(event.key==='Enter')doSearch()" autofocus>
    <button onclick="doSearch()" class="px-6 py-3 rounded-lg bg-[#FE8A95] text-white font-semibold cursor-pointer border-0 hover:opacity-90">搜索</button>
  </div>
  <div class="flex flex-wrap gap-3 mt-4 justify-center">
    <label class="flex items-center gap-1.5 text-sm text-sub cursor-pointer"><input type="radio" name="search-type" class="accent-[#FE8A95]" data-type="subjects" checked><span>动画</span></label>
    <label class="flex items-center gap-1.5 text-sm text-sub cursor-pointer"><input type="radio" name="search-type" class="accent-[#FE8A95]" data-type="characters"><span>角色</span></label>
    <label class="flex items-center gap-1.5 text-sm text-sub cursor-pointer"><input type="radio" name="search-type" class="accent-[#FE8A95]" data-type="persons"><span>人物</span></label>
    <label id="label-tags" class="flex items-center gap-1.5 text-sm text-sub cursor-pointer"><input type="radio" name="search-type" class="accent-[#FE8A95]" data-type="tags"><span>标签</span></label>
  </div>
  <div id="status" class="text-center text-sub text-sm mt-2 hidden"></div>
  <div id="results" class="mt-6"></div>
</main>

<script src="assets/app.js"></script>
<script>
if (window.BACKEND_URL) document.getElementById('label-tags').style.display = 'none';

var qp = new URLSearchParams(location.search);
var initQ = qp.get('q');
if (initQ) { document.getElementById('q').value = initQ; doSearch(); }

async function doSearch() {
  var q = document.getElementById('q').value.trim();
  if (!q) return;
  var checked = document.querySelector('[data-type]:checked');
  if (!checked) return;
  var type = checked.dataset.type;
  var res = document.getElementById('results');
  res.innerHTML = '<div class="text-center py-10 text-sub">搜索中…</div>';

  var body = {keyword: q};
  if (type === 'subjects') body.filter = {type: [2]};

  try {
    var resp = await fetch(API + '/v0/search/' + type, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    var d = await resp.json();
    if (!d || !d.data) { res.innerHTML = '<div class="text-center py-16 text-sub">搜索出错</div>'; return; }
    renderResults(d.data, type);
  } catch(e) {
    res.innerHTML = '<div class="text-center py-16 text-sub">搜索出错</div>';
  }
}

var typeLabels = {subjects:'动画', characters:'角色', persons:'人物', tags:'标签'};
var typeLinks = {subjects:'/subject.html?id=', characters:'/character.html?id=', persons:'/person.html?id='};

function renderResults(data, type) {
  var res = document.getElementById('results');
  if (!data.length) { res.innerHTML = '<div class="text-center py-16 text-sub">未找到结果</div>'; return; }
  var label = typeLabels[type] || type;
  var link = typeLinks[type] || '';
  var html = '<div class="mb-6"><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">'+label+'</span><span class="text-xs text-sub">('+data.length+')</span></div>';
  html += '<div class="flex flex-col gap-1">';
  for (var i = 0; i < data.length; i++) {
    var it = data[i];
    if (type === 'tags') {
      html += '<a href="/tags-subject.html?tag='+encodeURIComponent(it.name)+'" class="no-underline flex gap-3 items-center bg-[#2a2a2a] border border-[rgba(255,255,255,.08)] rounded-lg py-1.5 px-2 cursor-pointer hover:border-[#FE8A95]"><div class="text-sm font-semibold">'+it.name+'</div><div class="text-xs text-sub">'+it.count+' 个条目</div></a>';
    } else {
      var imgSrc = img(type==='subjects'?'subject':(type==='characters'?'character':'person'), it.id, 'grid');
      var imgErr = imgOnError(type==='subjects'?'subject':(type==='characters'?'character':'person'), it.id, 'grid');
      html += '<div onclick="location.href=\''+(link)+it.id+'\'" class="flex gap-3 items-center bg-[#2a2a2a] border border-[rgba(255,255,255,.08)] rounded-lg py-1.5 px-2 cursor-pointer hover:border-[#FE8A95]">'+
        '<img src="'+imgSrc+'" '+imgErr+' class="w-10 h-10 rounded-lg object-cover bg-[#202028] shrink-0">'+
        '<div class="flex-1 min-w-0">'+
          '<div class="text-sm font-semibold truncate">'+it.name+'</div>'+
          (it.name_cn ? '<div class="text-xs text-sub truncate mt-0.5">'+it.name_cn+'</div>' : '')+
        '</div>'+
        '<div class="text-xs text-sub shrink-0">#'+it.id+'</div>'+
      '</div>';
    }
  }
  html += '</div></div>';
  res.innerHTML = html;
}
</script>
</body>
</html>
