<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#181818]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>动画详情</title>
<script src="/assets/tailwindcss-3.4.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#181818',card:'#242424',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95','pink-bg':'#3B3033'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>
<div id="subject-header" class="sticky top-12 z-40 bg-[#16161d] border-b border-[rgba(255,255,255,.12)]"></div>
<main id="view" class="max-w-[1200px] mx-auto p-6"></main>

<script src="assets/app.js"></script>
<script>
var SID = new URLSearchParams(location.search).get('id');
var tab = new URLSearchParams(location.search).get('tab') || 'overview';

function switchTab(t) { tab = t; history.replaceState({},'', '?id='+SID+'&tab='+t); render(); }

function tabsHtml() {
  var items = [
    ['overview','概览'], ['ep','章节'], ['chars','角色'], ['persons','制作人员']
  ];
  return items.map(function(i) {
    var cls = tab===i[0] ? 'text-white border-b-2 border-[#FE8A95]' : 'text-sub hover:text-white';
    return '<a href="javascript:switchTab(\''+i[0]+'\')" class="'+cls+' no-underline px-3 py-1 text-sm inline-block">'+i[1]+'</a>';
  }).join('');
}

function parseInfobox(raw) {
  if (!raw) return {};
  try { var d = JSON.parse(raw); var o = {}; for (var i=0; i<d.length; i++) { if (d[i].key && typeof d[i].value==='string') o[d[i].key]=d[i].value; } return o; } catch(e) { return {}; }
}

async function render() {
  try {
    var s = await api('/v0/subjects/'+SID);
    if (!s) { document.getElementById('view').innerHTML='<p class="text-sub text-center py-20">未找到</p>'; return; }
    var info = parseInfobox(s.infobox);
    var hdr = document.getElementById('subject-header');
    hdr.innerHTML = '<div class="max-w-[1200px] mx-auto px-6 h-12 py-0 flex items-center gap-3">' +
      '<a href="/" class="text-sub text-sm no-underline hover:text-white shrink-0">← 返回</a>' +
      '<span class="text-xl font-bold truncate">'+primaryName(s.name, s.name_cn)+'</span>' +
      (function(){var sub=subName(s.name, s.name_cn); return sub ? '<span class="text-sm text-sub truncate hidden sm:inline">'+sub+'</span>' : ''})() +
      (s.platform ? '<span class="text-sub text-xs shrink-0">｜</span><span class="text-xs text-sub shrink-0">'+s.platform+'</span>' : '') +
      '<span class="text-sub text-xs shrink-0">｜</span><span class="text-xs text-sub shrink-0">ID: '+SID+'</span>' +
      '<span class="flex-1"></span>' +
      '<span class="flex gap-0 shrink-0">'+tabsHtml()+'</span></div>';
    if (tab === 'overview') await overview(s, info);
    else if (tab === 'ep') await episodes();
    else if (tab === 'chars') await characters();
    else if (tab === 'persons') await personsList();
  } catch(e) {
    document.getElementById('view').innerHTML = '<p class="text-sub text-center py-20">渲染出错: '+e.message+'</p>';
  }
}

async function overview(s, info) {
  var epsRaw = await api('/v0/subjects/'+SID+'/episodes');
  var charsRaw = await api('/v0/subjects/'+SID+'/characters');
  var relsRaw = await api('/v0/subjects/'+SID+'/relations');
  var eps = Array.isArray(epsRaw) ? epsRaw : [];
  var chars = Array.isArray(charsRaw) ? charsRaw : [];
  var rels = Array.isArray(relsRaw) ? relsRaw : [];

  var mainEps = eps.filter(function(e){return e.type===0}).sort(function(a,b){return a.sort-b.sort});
  var spEps = eps.filter(function(e){return e.type!==0}).sort(function(a,b){return a.sort-b.sort});
  var mainChars = chars.filter(function(c){return c.relation==='主角'||c.relation==='配角'}).slice(0,12);

  // Episode grid
  var epGrid = '';
  if (mainEps.length) {
    epGrid += '<div class="flex flex-wrap gap-1.5 mb-1">';
    for (var i=0; i<mainEps.length; i++) {
      var e = mainEps[i];
      epGrid += '<span class="w-8 h-8 flex items-center justify-center rounded text-xs font-semibold cursor-default bg-[#1f1f2b] text-sub" title="'+(e.name_cn||e.name)+'">'+String(Math.floor(e.sort||e.ep||0)).padStart(2,'0')+'</span>';
    }
    epGrid += '</div>';
  }
  if (spEps.length) {
    epGrid += '<div class="flex flex-wrap gap-1.5">';
    for (var i=0; i<spEps.length; i++) {
      var e = spEps[i];
      epGrid += '<span class="w-8 h-8 flex items-center justify-center rounded text-xs font-semibold cursor-default border-2 border-[#f59e0b] text-[#f59e0b]" title="'+(e.name_cn||e.name)+'">'+String(Math.floor(e.sort||e.ep||0)).padStart(2,'0')+'</span>';
    }
    epGrid += '</div>';
  }

  // Tags
  var tagsHtml = '';
  if (s.tags && s.tags.length) {
    var shown = s.tags.slice(0, 20);
    tagsHtml = '<div class="flex flex-wrap gap-x-3 gap-y-1">';
    for (var i=0; i<shown.length; i++) {
      tagsHtml += '<a href="/tags-subject.html?tag='+encodeURIComponent(shown[i].name)+'" class="text-xs no-underline text-sub hover:text-[#FE8A95]">'+shown[i].name+'<small class="text-sub ml-0.5">'+shown[i].count+'</small></a>';
    }
    tagsHtml += '</div>';
  }

  // Rating histogram
  var histHtml = '';
  var cnt = s.rating && s.rating.count;
  if (cnt) {
    var keys = Object.keys(cnt);
    if (keys.length) {
      var max = 1;
      for (var k in cnt) { if (cnt[k] > max) max = cnt[k]; }
      histHtml = '<ul class="space-y-0.5">';
      for (var i=10; i>=1; i--) {
        var v = cnt[String(i)] || 0;
        var pct = Math.max(v / max * 100, 1);
        histHtml += '<li class="flex items-center gap-2 text-xs"><span class="w-3 text-right text-sub">'+i+'</span><span class="flex-1 h-3 bg-[#2a2a35] rounded-sm overflow-hidden"><span class="block h-full bg-[#FE8A95] rounded-sm" style="width:'+pct+'%"></span></span><span class="text-sub w-8 text-right">'+v+'</span></li>';
      }
      histHtml += '</ul>';
    }
  }

  // Infobox entries
  var infoEntries = Object.entries(info);
  var infoHtml = '';
  for (var i=0; i<infoEntries.length; i++) {
    infoHtml += '<div class="flex justify-between py-1 border-b border-[rgba(255,255,255,.06)] text-[13px]"><span class="text-sub">'+infoEntries[i][0]+'</span><span class="text-right ml-2">'+infoEntries[i][1]+'</span></div>';
  }

  // Rating panel
  var scoreHtml = s.rating && s.rating.score ? s.rating.score.toFixed(1) : '-';
  var totalHtml = s.rating && s.rating.total ? s.rating.total : 0;
  var rankHtml = s.rating && s.rating.rank ? '#'+s.rating.rank : '-';

  var html = '<div class="flex flex-col md:flex-row gap-6">';

  // Left column
  html += '<div class="w-full md:w-[260px] shrink-0">';
  html += '<img src="'+img('subject',SID,'large')+'" onerror="this.remove()" class="w-full rounded-xl">';
  if (infoHtml) html += '<div class="mt-3 flex flex-col gap-0.5">'+infoHtml+'</div>';
  html += '</div>';

  // Right column
  html += '<div class="flex-1 min-w-0">';
  if (epGrid) html += '<div class="mb-4"><div class="text-xs text-sub mb-1">全部剧集 ('+eps.length+')</div>'+epGrid+'</div>';
  html += '<p class="text-[13px] leading-relaxed text-sub mb-4">'+(s.summary||'暂无简介')+'</p>';
  if (tagsHtml) html += '<div class="mb-4"><div class="text-xs text-sub mb-1">标签</div>'+tagsHtml+'</div>';

  // Rating panel
  html += '<div class="md:float-right w-full md:w-[240px] shrink-0 bg-[#242424] border border-[rgba(255,255,255,.12)] rounded-xl p-4 md:ml-5 mb-4">';
  html += '<div class="text-center text-sub text-sm">评分</div>';
  html += '<div class="text-center text-3xl font-bold mt-1">'+scoreHtml+'<span class="text-xs text-sub font-normal"> / 10</span></div>';
  html += '<div class="text-center text-xs text-sub mt-1">'+totalHtml+' 人评分 · 排名 '+rankHtml+'</div>';
  if (histHtml) html += '<div class="mt-3">'+histHtml+'</div>';
  html += '</div>';
  html += '<div class="clear-right"></div>';
  html += '</div></div>';

  // Characters section
  if (mainChars.length) {
    html += '<div class="mt-6"><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">角色介绍</span><a href="javascript:switchTab(\'chars\')" class="text-[#FE8A95] text-xs ml-auto no-underline">更多角色 &raquo;</a></div>';
    html += '<div class="flex gap-3 overflow-x-auto pb-2" style="scrollbar-width:thin">';
    for (var i=0; i<mainChars.length; i++) {
      var c = mainChars[i];
      var actorStr = c.actors && c.actors.length ? 'CV:'+c.actors.map(function(a){return a.name}).slice(0,2).join(',') : '';
      html += '<div onclick="location.href=\'/character.html?id='+c.id+'\'" class="shrink-0 bg-[#242424] border border-[rgba(255,255,255,.12)] rounded-lg p-2.5 cursor-pointer hover:border-[#FE8A95]" style="min-width:190px">';
      html += '<div class="flex gap-2 items-center">';
      html += '<img src="'+img('character',c.id,'grid')+'" onerror="this.remove()" class="w-11 h-11 rounded-lg object-cover bg-[#1a1a23] shrink-0">';
      html += '<div class="min-w-0"><div class="text-[13px] font-semibold truncate">'+c.name+'</div>';
      html += '<div class="flex items-center gap-1.5 mt-0.5"><span class="bg-[#FE8A95] text-white px-1.5 py-px rounded-md text-[10px] font-semibold shrink-0">'+c.relation+'</span>';
      if (actorStr) html += '<span class="text-[11px] text-sub truncate">'+actorStr+'</span>';
      html += '</div></div></div></div>';
    }
    html += '</div></div>';
  }

  // Relations section
  if (rels.length) {
    html += '<div class="mt-6"><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">关联条目</span></div><div class="flex flex-wrap gap-3">';
    for (var i=0; i<rels.length; i++) {
      var r = rels[i];
      html += '<div onclick="location.href=\'/subject.html?id='+r.id+'\'" class="flex gap-3 items-center bg-[#242424] border border-[rgba(255,255,255,.12)] rounded-lg p-2.5 cursor-pointer hover:border-[#FE8A95]">';
      html += '<img src="'+img('subject',r.id,'grid')+'" onerror="this.remove()" class="w-[75px] h-[100px] rounded object-cover bg-[#1a1a23] shrink-0">';
      html += '<div>'+(r.relation ? '<div class="text-[11px] text-[#FE8A95] mb-0.5">'+r.relation+'</div>' : '')+'<div class="text-[13px] font-semibold">'+(r.name||'#'+r.id)+'</div></div></div>';
    }
    html += '</div></div>';
  }

  document.getElementById('view').innerHTML = html;
}

async function episodes() {
  var epsRaw = await api('/v0/subjects/'+SID+'/episodes');
  var eps = Array.isArray(epsRaw) ? epsRaw : [];
  var types = {0:'本篇',1:'SP',2:'OP',3:'ED',4:'预告',5:'MAD',6:'其他'};
  var main = eps.filter(function(e){return e.type===0}).sort(function(a,b){return a.sort-b.sort});
  var sp = eps.filter(function(e){return e.type!==0}).sort(function(a,b){return a.sort-b.sort});

  function epRows(list, label) {
    if (!list.length) return '';
    var html = '<div class="mb-6"><div class="text-sm text-sub font-semibold mb-3">'+label+'</div>';
    for (var i=0; i<list.length; i++) {
      var e = list[i];
      html += '<div class="ml-2 pl-4 border-l-2 border-[rgba(255,255,255,.08)] h-12 py-0">';
      html += '<div class="flex items-center gap-3"><span class="text-[#FE8A95] text-sm font-bold w-10">'+(e.type===0?String(Math.floor(e.sort||e.ep||0)).padStart(2,'0'):types[e.type])+'</span><span class="font-semibold">'+(e.name_cn||e.name)+'</span></div>';
      html += '<div class="text-[11px] text-sub mt-1 ml-13">'+(e.name||'')+' · '+(e.duration||'')+' · '+(e.airdate||'')+(e.desc ? '<p class="mt-1 leading-relaxed">'+e.desc+'</p>' : '')+'</div></div>';
    }
    html += '</div>';
    return html;
  }

  document.getElementById('view').innerHTML = '<div class="flex items-center gap-2 mb-4"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">剧集 ('+eps.length+')</span></div>' +
    epRows(main, '本篇 ('+main.length+')') + epRows(sp, 'SP / 其他 ('+sp.length+')');
}

async function characters() {
  var charsRaw = await api('/v0/subjects/'+SID+'/characters');
  var chars = Array.isArray(charsRaw) ? charsRaw : [];
  window._chars = chars;

  function renderCharList(list) {
    var html = '';
    for (var i=0; i<list.length; i++) {
      var c = list[i];
      html += '<div class="flex gap-4 items-start bg-[#242424] border border-[rgba(255,255,255,.08)] rounded-lg p-3">';
      html += '<img src="'+img('character',c.id,'grid')+'" onerror="this.remove()" class="w-[75px] h-[100px] rounded-lg object-cover bg-[#1a1a23] shrink-0 cursor-pointer" onclick="location.href=\'/character.html?id='+c.id+'\'">';
      html += '<div class="flex-1 min-w-0">';
      html += '<div class="font-semibold cursor-pointer hover:text-[#FE8A95] inline-block" onclick="location.href=\'/character.html?id='+c.id+'\'">'+c.name+'</div>';
      html += '<div class="flex flex-wrap gap-1.5 mt-1 items-center">';
      html += '<span class="bg-[#FE8A95] text-white px-2 py-0.5 rounded-md text-[11px] font-semibold">'+c.relation+'</span>';
      if (c.gender) html += '<span class="text-[11px] text-sub">性别:'+c.gender+'</span>';
      if (c.infobox) {
        try {
          var d = JSON.parse(c.infobox);
          for (var j=0; j<d.length; j++) {
            if (d[j].key==='生日'||d[j].key==='身高') html += '<span class="text-[11px] text-sub">'+d[j].value+'</span>';
          }
        } catch(e) {}
      }
      html += '</div>';
      if (c.actors && c.actors.length) {
        html += '<div class="flex flex-wrap items-center gap-3 mt-2">';
        for (var j=0; j<c.actors.length; j++) {
          var a = c.actors[j];
          html += '<div class="flex items-center gap-1.5 cursor-pointer hover:opacity-80" onclick="event.stopPropagation();location.href=\'/person.html?id='+a.id+'\'">';
          html += '<img src="'+img('person',a.id,'grid')+'" onerror="this.remove()" class="w-6 h-6 rounded-full object-cover bg-[#1a1a23] shrink-0">';
          html += '<span class="text-[11px] text-sub">CV:</span><span class="text-[13px] font-semibold hover:text-[#FE8A95]">'+a.name+'</span></div>';
        }
        html += '</div>';
      }
      html += '</div></div>';
    }
    return html;
  }

  document.getElementById('view').innerHTML = '<div class="flex items-center gap-2 mb-4"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">角色 ('+chars.length+')</span>' +
    '<span class="text-xs text-sub cursor-pointer hover:text-white ml-2" onclick="window.filterChars(\'all\')">全部</span>' +
    '<span class="text-xs text-sub cursor-pointer hover:text-white ml-2" onclick="window.filterChars(\'主角\')">主角</span>' +
    '<span class="text-xs text-sub cursor-pointer hover:text-white ml-2" onclick="window.filterChars(\'配角\')">配角</span>' +
    '<span class="text-xs text-sub cursor-pointer hover:text-white ml-2" onclick="window.filterChars(\'客串\')">客串</span></div>' +
    '<div id="char-list" class="flex flex-col gap-1">'+renderCharList(chars)+'</div>';

  window.filterChars = function(rel) {
    var list = rel === 'all' ? window._chars : window._chars.filter(function(c){return c.relation===rel});
    document.getElementById('char-list').innerHTML = renderCharList(list);
  };
}

async function personsList() {
  var personsRaw = await api('/v0/subjects/'+SID+'/persons');
  var persons = Array.isArray(personsRaw) ? personsRaw : [];
  var groups = {};
  for (var i=0; i<persons.length; i++) {
    var key = persons[i].relation || '其他';
    if (!groups[key]) groups[key] = [];
    groups[key].push(persons[i]);
  }
  var entries = Object.entries(groups);

  var sideLinks = '';
  for (var i=0; i<entries.length; i++) {
    sideLinks += '<a href="#g-'+entries[i][0]+'" class="text-sub text-xs no-underline block py-0.5 hover:text-white">'+entries[i][0]+' ('+entries[i][1].length+')</a>';
  }

  var mainHtml = '';
  for (var i=0; i<entries.length; i++) {
    var k = entries[i][0], v = entries[i][1];
    mainHtml += '<div class="mb-5" id="g-'+k+'"><div class="flex items-center gap-2 mb-2"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">'+k+'</span><span class="text-xs text-sub">('+v.length+')</span></div>';
    for (var j=0; j<v.length; j++) {
      var p = v[j];
      mainHtml += '<div onclick="location.href=\'/person.html?id='+p.id+'\'" class="flex items-center gap-2 py-1.5 border-b border-[rgba(255,255,255,.04)] cursor-pointer hover:text-[#FE8A95] text-sm">'+p.name+(p.eps?'<span class="text-xs text-sub ml-1">('+p.eps+')</span>':'')+'</div>';
    }
    mainHtml += '</div>';
  }

  document.getElementById('view').innerHTML = '<div class="flex gap-6"><div class="w-[140px] shrink-0 hidden md:block sticky top-44 self-start">'+sideLinks+'</div><div class="flex-1">'+mainHtml+'</div></div>';
}

render();
</script>
</body>
</html>
