<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#1d1d1d]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>动画详情</title>
<script src="/assets/tailwindcss-3.4.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#1d1d1d',card:'#2a2a2a',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95','pink-bg':'#403638'}}}}</script>
<style>
  .thin-scroll::-webkit-scrollbar { height: 4px; }
  .thin-scroll::-webkit-scrollbar-track { background: transparent; }
  .thin-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }
  .thin-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.4); }
  .thin-scroll::-webkit-scrollbar-thumb:active { background: rgba(255,255,255,.5); }
  .thin-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
</style>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>
<div id="subject-header" class="sticky top-12 z-40 bg-[#1c1c22] border-b border-[rgba(255,255,255,.12)]"></div>
<main id="view" class="max-w-[1200px] mx-auto p-6"></main>

<script src="assets/app.js"></script>
<script>
var SID = new URLSearchParams(location.search).get('id');
var tab = new URLSearchParams(location.search).get('tab') || 'overview';

function switchTab(t) { tab = t; history.replaceState({},'', '?id='+SID+'&tab='+t); render(); }

function tabsHtml() {
  var items = [
    ['overview','概览'], ['ep','剧集'], ['chars','角色'], ['persons','制作人员']
  ];
  return items.map(function(i) {
    var cls = tab===i[0] ? 'text-white border-b-2 border-[#FE8A95]' : 'text-sub hover:text-white';
    return '<a href="javascript:switchTab(\''+i[0]+'\')" class="'+cls+' no-underline px-3 py-1 text-sm inline-block">'+i[1]+'</a>';
  }).join('');
}

async function render() {
  try {
    var s = await api('/v0/subjects/'+SID);
    if (!s) { document.getElementById('view').innerHTML='<p class="text-sub text-center py-20">未找到</p>'; return; }
    await loadPersonMap();
    var infoItems = infoboxData(s);
    var hdr = document.getElementById('subject-header');
    hdr.innerHTML = '<div class="max-w-[1200px] mx-auto px-6 h-12 py-0 flex items-center gap-3">' +
      '<a href="/" class="w-7 h-7 rounded-full border border-[rgba(255,255,255,.2)] flex items-center justify-center text-sub hover:text-white hover:border-[rgba(255,255,255,.4)] shrink-0 no-underline text-xs" title="返回">←</a>' +
      '<span class="text-xl font-bold truncate">'+primaryName(s.name, s.name_cn)+'</span>' +
      (function(){var sub=subName(s.name, s.name_cn); return sub ? '<span class="text-sm text-sub truncate hidden sm:inline">'+sub+'</span>' : ''})() +
      (s.platform ? '<span class="text-sub text-xs shrink-0">｜</span><span class="text-xs text-sub shrink-0">'+s.platform+'</span>' : '') +
      '<span class="text-sub text-xs shrink-0">｜</span><span class="text-xs text-sub shrink-0">ID: '+SID+'</span>' +
      '<span class="flex-1"></span>' +
      '<span class="flex gap-0 shrink-0">'+tabsHtml()+'</span></div>';
    if (tab === 'overview') await overview(s, infoItems);
    else if (tab === 'ep') await episodes();
    else if (tab === 'chars') await characters();
    else if (tab === 'persons') await personsList();
  } catch(e) {
    document.getElementById('view').innerHTML = '<p class="text-sub text-center py-20">渲染出错: '+e.message+'</p>';
  }
}

async function overview(s, infoItems) {
  var epsRaw = await api('/v0/subjects/'+SID+'/episodes');
  var charsRaw = await api('/v0/subjects/'+SID+'/characters');
  var relsRaw = await api('/v0/subjects/'+SID+'/relations');
  var eps = Array.isArray(epsRaw) ? epsRaw : (epsRaw&&epsRaw.data ? epsRaw.data : []);
  var chars = Array.isArray(charsRaw) ? charsRaw : (charsRaw&&charsRaw.data ? charsRaw.data : []);
  var rels = Array.isArray(relsRaw) ? relsRaw : (relsRaw&&relsRaw.data ? relsRaw.data : []);

  var mainChars = chars.filter(function(c){return c.relation==='主角'||c.relation==='配角'}).slice(0,12);

  // Episode grid — sorted by sort, inline type separators
  var epGrid = '';
  var allEps = eps.slice().sort(function(a,b){return (a.sort||0)-(b.sort||0)});
  if (allEps.length) {
    var epCls = {
      0: 'bg-[#252530] text-sub',
      1: 'bg-[#33281a] text-[#d4a040]',
      2: 'bg-[#1a2833] text-[#5c8eb0]',
      3: 'bg-[#241a2e] text-[#8c74a8]',
      4: 'bg-[#1a2e24] text-[#4c8c68]',
      5: 'bg-[#2e1a22] text-[#b86474]',
      6: 'bg-[#252530] text-sub'
    };
    var sepCls = {
      1: 'text-[#d4a040]',
      2: 'text-[#5c8eb0]',
      3: 'text-[#8c74a8]',
      4: 'text-[#4c8c68]',
      5: 'text-[#b86474]',
      6: 'text-sub'
    };
    var lastType = -1;
    epGrid += '<div class="flex flex-wrap gap-1.5">';
    for (var i=0; i<allEps.length; i++) {
      var e = allEps[i];
      var t = e.type||0;
      if (t !== lastType && t !== 0) {
        // Type marker cell with vertical line + label
        var sepGap = 'gap-1', sepText = 'text-[9px]';
        if (t>=1 && t<=3) { sepGap = 'gap-1.5'; sepText = 'text-[14px]'; }
        else if (t===4 || t===6) { sepGap = 'gap-1'; sepText = 'text-[12px]'; }
        else if (t===5) { sepGap = 'gap-0.5'; sepText = 'text-[10px]'; }
        epGrid += '<span class="w-8 h-8 flex items-center pl-0 font-semibold cursor-default '+sepGap+' '+sepText+' '+(sepCls[t]||'text-sub')+'"><span class="border-l border-current h-7"></span>'+MSG.epTypes[t]+'</span>';
      }
      lastType = t;
      var epNum = String(Math.floor(e.sort||e.ep||0));
      var num = epNum.padStart(2,'0');
      var cls = epCls[t];
      var epName = primaryName(e.name, e.name_cn);
      var epSub = subName(e.name, e.name_cn);
      epGrid += '<div class="relative group">'+
        '<span class="w-8 h-8 flex items-center justify-center rounded text-xs font-semibold cursor-default '+cls+'">'+num+'</span>'+
        '<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 hidden group-hover:block z-50">'+
        '<div class="bg-[#1a1a22] border border-[rgba(255,255,255,.15)] rounded-lg px-3 py-2 text-xs whitespace-nowrap shadow-lg">'+
        '<div class="text-sub">第 '+epNum+' 话 · '+(MSG.epTypes[t]||'')+'</div>'+
        '<div class="text-sm font-semibold mt-1">'+epName+'</div>'+
        (epSub ? '<div class="text-sub mt-0.5">'+epSub+'</div>' : '')+
        (e.airdate ? '<div class="text-sub mt-1">首播: '+e.airdate+'</div>' : '')+
        (e.duration ? '<div class="text-sub">时长: '+e.duration+'</div>' : '')+
        '</div></div></div>';
    }
    epGrid += '</div>';
  }

  // Tags
  var tagsHtml = '';
  if (s.tags && s.tags.length) {
    var shown = s.tags.slice(0, 20);
    tagsHtml = '<div class="flex flex-wrap gap-x-2 gap-y-1">';
    for (var i=0; i<shown.length; i++) {
      tagsHtml += '<a href="/tags-subject.html?tag='+encodeURIComponent(shown[i].name)+'" class="no-underline bg-[#252530] rounded-full px-2.5 py-0.5 text-[14px] text-sub hover:text-[#FE8A95] hover:bg-[#2a2a3a] transition-colors">'+shown[i].name+'<small class="text-xs text-sub ml-1">'+shown[i].count+'</small></a>';
    }
    tagsHtml += '</div>';
  }

  // Rating histogram — vertical bars with hover tooltip
  var histHtml = '';
  var cnt = s.rating && s.rating.count;
  if (cnt) {
    var totalVotes = 0;
    for (var k in cnt) { totalVotes += cnt[k]; }
    var max = 1;
    for (var k2 in cnt) { if (cnt[k2] > max) max = cnt[k2]; }
    histHtml = '<div class="flex items-end gap-px mt-2" style="height:80px">';
    for (var i=10; i>=1; i--) {
      var v = cnt[String(i)] || 0;
      var h = Math.max(v / max * 100, 4);
      var pct = totalVotes > 0 ? (v / totalVotes * 100).toFixed(1) : '0.0';
      histHtml += '<div class="flex-1 flex flex-col items-center justify-end group relative" style="height:100%">'+
        '<span class="block w-full bg-[#FE8A95] rounded-t-sm group-hover:bg-[#ff9aa5] transition-colors" style="height:'+h+'%"></span>'+
        '<div class="absolute bottom-full mb-1 hidden group-hover:block z-50">'+
        '<div class="bg-[#1a1a22] border border-[rgba(255,255,255,.15)] rounded-lg px-2 py-1 text-xs whitespace-nowrap shadow-lg">'+pct+'% · '+v+' 人</div></div>'+
        '</div>';
    }
    histHtml += '</div>';
    histHtml += '<div class="flex gap-px mt-0.5">';
    for (var j=10; j>=1; j--) {
      histHtml += '<span class="flex-1 text-center text-[10px] text-sub">'+j+'</span>';
    }
    histHtml += '</div>';
    // Standard deviation
    var mean = s.rating && s.rating.score || 0;
    var sumSq = 0;
    for (var k3=1; k3<=10; k3++) {
      var c = cnt[String(k3)] || 0;
      sumSq += c * (k3 - mean) * (k3 - mean);
    }
    var stddev = totalVotes > 0 ? Math.sqrt(sumSq / totalVotes).toFixed(4) : '-';
    histHtml += '<div class="text-xs text-sub text-center mt-2">标准差: '+stddev+'</div>';
  }

  // Infobox entries
  var infoHtml = '';
  for (var i=0; i<infoItems.length; i++) {
    infoHtml += '<div class="py-1 border-b border-[rgba(255,255,255,.06)] text-[14px]'+(infoItems[i][2]?' ml-4':'')+'"><span class="text-sub">'+(infoItems[i][0]?infoItems[i][0]+': ':'')+'</span><span>'+infoItems[i][1]+'</span></div>';
  }

  // Rating panel
  var scoreHtml = s.rating && s.rating.score ? s.rating.score.toFixed(1) : '-';
  var totalHtml = s.rating && s.rating.total ? s.rating.total : 0;
  var rankHtml = s.rating && s.rating.rank ? '#'+s.rating.rank : '-';

  // ── 整体布局：左右两栏 ──
  var html = '<div class="flex flex-col md:flex-row gap-6">';

  // ── 左栏：海报 + infobox ──
  html += '<div class="w-full md:w-[260px] shrink-0">';
  html += '<img src="'+img('subject',SID,'large')+'" onerror="this.remove()" class="w-full rounded-xl">';
  if (infoHtml) html += '<div class="mt-3 flex flex-col gap-0.5">'+infoHtml+'</div>';
  html += '</div>';

  // ── 右栏 ──
  html += '<div class="flex-1 min-w-0 flex flex-col gap-5">';

  // ── 右上栏：左（剧集 + 简介 + 标签）| 右（评分）──
  html += '<div class="flex flex-col md:flex-row gap-5">';
  html += '<div class="flex-1 min-w-0">';
  if (epGrid) html += '<div class="mb-4"><div class="flex items-center gap-2 mb-2"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">剧集</span><span class="text-xs text-sub">('+eps.length+')</span></div>'+epGrid+'</div>';
  html += '<div class="flex items-center gap-2 mb-2"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">简介</span></div>';
  html += '<p class="text-[14px] leading-relaxed text-sub mb-4">'+(s.summary||'暂无简介')+'</p>';
  if (tagsHtml) html += '<div class="mb-2"><div class="flex items-center gap-2 mb-2"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">标签</span></div>'+tagsHtml+'</div>';
  html += '</div>';
  // ── 右上右栏：评分面板 ──
  html += '<div class="w-full md:w-[230px] shrink-0 self-start bg-[#252528] border border-[rgba(255,255,255,.12)] rounded-xl overflow-hidden">';
  // Header strip
  html += '<div class="bg-[#2a2a30] px-4 py-2"><span class="font-bold">评分</span></div>';
  html += '<div class="border-t border-[rgba(255,255,255,.1)]"></div>';
  // Content
  html += '<div class="px-4 pt-2 pb-2">';
  html += '<div class="flex items-baseline justify-center"><span class="text-3xl font-bold">'+scoreHtml+'</span><span class="text-xs text-sub ml-1">/ 10</span></div>';
  html += '<div class="text-xs text-sub text-center mt-1">'+totalHtml+' 人评分 · 排名 '+rankHtml+'</div>';
  if (histHtml) html += '<div class="border-t border-[rgba(255,255,255,.12)] mt-3 mb-1"></div>';
  if (histHtml) html += '<div>'+histHtml+'</div>';
  html += '</div>';
  html += '</div>';
  html += '</div>';

  // ── 右下栏：主要角色 + 关联条目 ──
  if (mainChars.length) {
    html += '<div><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">主要角色</span><a href="javascript:switchTab(\'chars\')" class="text-[#FE8A95] text-xs ml-auto no-underline">更多角色 &raquo;</a></div>';
    html += '<div class="flex gap-3 overflow-x-auto pb-2 thin-scroll">';
    for (var i=0; i<mainChars.length; i++) {
      var c = mainChars[i];
      var actorName = c.actors && c.actors.length ? c.actors[0].name : '';
      html += '<div onclick="location.href=\'/character.html?id='+c.id+'\'" class="shrink-0 w-[96px] cursor-pointer group rounded-lg hover:-translate-y-1 transition-transform">'+
        // Image with floating badge
        '<div class="relative rounded-lg overflow-hidden bg-[#202028] aspect-square">'+
        '<img src="'+img('character',c.id,'grid')+'" onerror="this.remove()" class="w-full h-full object-cover">'+
        '<span class="absolute top-1 right-1 bg-black/60 text-white px-1.5 py-0.5 rounded text-[10px] font-semibold">'+c.relation+'</span>'+
        '</div>'+
        // Name + CV
        '<div class="mt-1.5 px-0.5">'+
        '<div class="text-[13px] font-semibold truncate">'+primaryName(c.name, '')+'</div>'+
        (actorName ? '<div class="text-[11px] text-sub truncate">CV: '+actorName+'</div>' : '')+
        '</div></div>';
    }
    html += '</div></div>';
  }

  if (rels.length) {
    html += '<div><div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">关联条目</span></div><div class="flex flex-wrap gap-3">';
    for (var i=0; i<rels.length; i++) {
      var r = rels[i];
      html += '<div onclick="location.href=\'/subject.html?id='+r.id+'\'" class="flex gap-3 items-center bg-[#2a2a2a] border border-[rgba(255,255,255,.12)] rounded-lg p-2.5 cursor-pointer hover:border-[#FE8A95]">';
      html += '<img src="'+img('subject',r.id,'grid')+'" onerror="this.remove()" class="w-[75px] h-[100px] rounded object-cover bg-[#202028] shrink-0">';
      html += '<div>'+(r.relation ? '<div class="text-[12px] text-[#FE8A95] mb-0.5">'+r.relation+'</div>' : '')+'<div class="text-[14px] font-semibold">'+(r.name||'#'+r.id)+'</div></div></div>';
    }
    html += '</div></div>';
  }

  html += '</div></div>';

  document.getElementById('view').innerHTML = html;
}

async function episodes() {
  var epsRaw = await api('/v0/subjects/'+SID+'/episodes');
  var eps = Array.isArray(epsRaw) ? epsRaw : (epsRaw&&epsRaw.data ? epsRaw.data : []);
  var types = MSG.epTypes;
  var main = eps.filter(function(e){return e.type===0}).sort(function(a,b){return a.sort-b.sort});
  var sp = eps.filter(function(e){return e.type!==0}).sort(function(a,b){return a.sort-b.sort});

  function epRows(list, label) {
    if (!list.length) return '';
    var html = '<div class="mb-6"><div class="text-sm text-sub font-semibold mb-3">'+label+'</div>';
    for (var i=0; i<list.length; i++) {
      var e = list[i];
      html += '<div class="ml-2 pl-4 border-l-2 border-[rgba(255,255,255,.08)] h-12 py-0">';
      html += '<div class="flex items-center gap-3"><span class="text-[#FE8A95] text-sm font-bold w-10">'+(e.type===0?String(Math.floor(e.sort||e.ep||0)).padStart(2,'0'):types[e.type])+'</span><span class="font-semibold">'+(e.name_cn||e.name)+'</span></div>';
      html += '<div class="text-[12px] text-sub mt-1 ml-13">'+(e.name||'')+' · '+(e.duration||'')+' · '+(e.airdate||'')+(e.desc ? '<p class="mt-1 leading-relaxed">'+e.desc+'</p>' : '')+'</div></div>';
    }
    html += '</div>';
    return html;
  }

  document.getElementById('view').innerHTML = '<div class="flex items-center gap-2 mb-4"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">剧集 ('+eps.length+')</span></div>' +
    epRows(main, '本篇 ('+main.length+')') + epRows(sp, 'SP / 其他 ('+sp.length+')');
}

async function characters() {
  var charsRaw = await api('/v0/subjects/'+SID+'/characters');
  var chars = Array.isArray(charsRaw) ? charsRaw : [];
  window._chars = chars;

  function renderCharList(list) {
    var html = '';
    for (var i=0; i<list.length; i++) {
      var c = list[i];
      html += '<div class="flex gap-4 items-start bg-[#2a2a2a] border border-[rgba(255,255,255,.08)] rounded-lg p-3">';
      html += '<img src="'+img('character',c.id,'grid')+'" onerror="this.remove()" class="w-[75px] h-[100px] rounded-lg object-cover bg-[#202028] shrink-0 cursor-pointer" onclick="location.href=\'/character.html?id='+c.id+'\'">';
      html += '<div class="flex-1 min-w-0">';
      html += '<div class="font-semibold cursor-pointer hover:text-[#FE8A95] inline-block" onclick="location.href=\'/character.html?id='+c.id+'\'">'+c.name+'</div>';
      html += '<div class="flex flex-wrap gap-1.5 mt-1 items-center">';
      html += '<span class="bg-[#FE8A95] text-white px-2 py-0.5 rounded-md text-[12px] font-semibold">'+c.relation+'</span>';
      if (c.gender) html += '<span class="text-[12px] text-sub">性别:'+c.gender+'</span>';
      if (c.infobox) {
        try {
          var d = JSON.parse(c.infobox);
          for (var j=0; j<d.length; j++) {
            if (d[j].key==='生日'||d[j].key==='身高') html += '<span class="text-[12px] text-sub">'+d[j].value+'</span>';
          }
        } catch(e) {}
      }
      html += '</div>';
      if (c.actors && c.actors.length) {
        html += '<div class="flex flex-wrap items-center gap-3 mt-2">';
        for (var j=0; j<c.actors.length; j++) {
          var a = c.actors[j];
          html += '<div class="flex items-center gap-1.5 cursor-pointer hover:opacity-80" onclick="event.stopPropagation();location.href=\'/person.html?id='+a.id+'\'">';
          html += '<img src="'+img('person',a.id,'grid')+'" onerror="this.remove()" class="w-6 h-6 rounded-full object-cover bg-[#202028] shrink-0">';
          html += '<span class="text-[12px] text-sub">CV:</span><span class="text-[14px] font-semibold hover:text-[#FE8A95]">'+a.name+'</span></div>';
        }
        html += '</div>';
      }
      html += '</div></div>';
    }
    return html;
  }

  document.getElementById('view').innerHTML = '<div class="flex items-center gap-2 mb-4"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">角色 ('+chars.length+')</span>' +
    '<span class="text-xs text-sub cursor-pointer hover:text-white ml-2" onclick="window.filterChars(\'all\')">全部</span>' +
    '<span class="text-xs text-sub cursor-pointer hover:text-white ml-2" onclick="window.filterChars(\'主角\')">主角</span>' +
    '<span class="text-xs text-sub cursor-pointer hover:text-white ml-2" onclick="window.filterChars(\'配角\')">配角</span>' +
    '<span class="text-xs text-sub cursor-pointer hover:text-white ml-2" onclick="window.filterChars(\'客串\')">客串</span></div>' +
    '<div id="char-list" class="flex flex-col gap-1">'+renderCharList(chars)+'</div>';

  window.filterChars = function(rel) {
    var list = rel === 'all' ? window._chars : window._chars.filter(function(c){return c.relation===rel});
    document.getElementById('char-list').innerHTML = renderCharList(list);
  };
}

async function personsList() {
  var personsRaw = await api('/v0/subjects/'+SID+'/persons');
  var persons = Array.isArray(personsRaw) ? personsRaw : [];
  var groups = {};
  for (var i=0; i<persons.length; i++) {
    var key = persons[i].relation || '其他';
    if (!groups[key]) groups[key] = [];
    groups[key].push(persons[i]);
  }
  var entries = Object.entries(groups);

  var sideLinks = '';
  for (var i=0; i<entries.length; i++) {
    sideLinks += '<a href="#g-'+entries[i][0]+'" class="text-sub text-xs no-underline block py-0.5 hover:text-white">'+entries[i][0]+' ('+entries[i][1].length+')</a>';
  }

  var mainHtml = '';
  for (var i=0; i<entries.length; i++) {
    var k = entries[i][0], v = entries[i][1];
    mainHtml += '<div class="mb-5" id="g-'+k+'"><div class="flex items-center gap-2 mb-2"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">'+k+'</span><span class="text-xs text-sub">('+v.length+')</span></div>';
    for (var j=0; j<v.length; j++) {
      var p = v[j];
      mainHtml += '<div onclick="location.href=\'/person.html?id='+p.id+'\'" class="flex items-center gap-2 py-1.5 border-b border-[rgba(255,255,255,.04)] cursor-pointer hover:text-[#FE8A95] text-sm">'+p.name+(p.eps?'<span class="text-xs text-sub ml-1">('+p.eps+')</span>':'')+'</div>';
    }
    mainHtml += '</div>';
  }

  document.getElementById('view').innerHTML = '<div class="flex gap-6"><div class="w-[140px] shrink-0 hidden md:block sticky top-44 self-start">'+sideLinks+'</div><div class="flex-1">'+mainHtml+'</div></div>';
}

render();
</script>
</body>
