openapi: "3.0.0"
info:
  title: Seshat API
  description: 离线优先的 Bangumi 数据管理与浏览工具。所有数据从 Bangumi API 拉取并缓存本地。本地接口前缀 /api/v0，结构与官方 /v0 一致。backend_url 置空则前端请求本地 /api/v0，设为官方地址则直连官方 /v0。
  version: "0.1.0"
servers:
  - url: http://127.0.0.1:4000
    description: 本地服务器
tags:
  - name: 动画
  - name: 角色
  - name: 制作成员
  - name: 标签
  - name: 搜索
  - name: 拉取
  - name: Tracker
  - name: 图片
  - name: ELO
  - name: 用户

paths:
  # ── 动画 ──
  /api/v0/subjects/list:
    get:
      tags: [动画]
      summary: 列出已缓存动画列表
      operationId: listSubjects
      responses:
        "200":
          description: 动画列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectListItem"
  /api/v0/subjects/{id}:
    get:
      tags: [动画]
      summary: 列出动画详情
      operationId: getSubject
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 51
      responses:
        "200":
          description: 完整动画数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v0/episodes:
    get:
      tags: [动画]
      summary: 列出动画关联的剧集列表
      parameters:
        - { name: subject_id, in: query, required: true, schema: { type: integer }, example: 51 }
        - { name: type, in: query, schema: { type: integer, description: "0=本篇 1=SP 2=OP 3=ED 4=预告 5=MAD 6=其他" }, example: 0 }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 剧集数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Episode"
  /api/v0/subjects/{id}/subjects:
    get:
      tags: [动画]
      summary: 列出动画关联的条目
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 关联条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectRelation"

  # ── 角色 ──
  /api/v0/characters/list:
    get:
      tags: [角色]
      summary: 列出已缓存角色列表
      operationId: listCharacters
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NameEntry"
  /api/v0/characters/{id}:
    get:
      tags: [角色]
      summary: 列出角色详情
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 角色完整数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
  /api/v0/subjects/{id}/characters:
    get:
      tags: [动画]
      summary: 列出动画关联的角色
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 角色数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedCharacter"
  /api/v0/characters/{id}/subjects:
    get:
      tags: [角色]
      summary: 列出角色出演的动画
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 动画数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string, example: "主角" }
                    name: { type: string, example: "CLANNAD" }
                    name_cn: { type: string }
                    id: { type: integer }
  /api/v0/characters/{id}/persons:
    get:
      tags: [角色]
      summary: 列出角色关联的人物（声优）
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 人物数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string }
                    name: { type: string }
                    id: { type: integer }
                    subject_id: { type: integer }
                    subject_name: { type: string }

  # ── 制作成员 ──
  /api/v0/persons/list:
    get:
      tags: [制作成员]
      summary: 列出已缓存人物列表
      operationId: listPersons
      responses:
        "200":
          description: 人物列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NameEntry"
  /api/v0/persons/{id}:
    get:
      tags: [制作成员]
      summary: 列出制作成员详情
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 制作成员完整数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
  /api/v0/subjects/{id}/persons:
    get:
      tags: [动画]
      summary: 列出动画关联的制作成员
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 制作成员数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedPerson"
  /api/v0/persons/{id}/subjects:
    get:
      tags: [制作成员]
      summary: 列出人物参与的动画
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 动画数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string, example: "导演" }
                    name: { type: string, example: "CLANNAD" }
                    name_cn: { type: string }
                    id: { type: integer }
  /api/v0/persons/{id}/characters:
    get:
      tags: [制作成员]
      summary: 列出人物关联的角色
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 角色数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staff: { type: string }
                    name: { type: string }
                    id: { type: integer }
                    subject_id: { type: integer }
                    subject_name: { type: string }

  # ── 标签 ──
  /api/v0/tags:
    get:
      tags: [标签]
      summary: 列出标签列表
      responses:
        "200":
          description: 标签数组（以数量降序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagItem"
  /api/v0/tags/{name}/subjects:
    get:
      tags: [标签]
      summary: 列出标签下的动画
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: 动画列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectListItem"

  # ── 图片 ──
  /api/v0/subjects/{id}/image:
    get:
      tags: [图片]
      summary: 动画图片
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [large, medium, small, grid, common], default: grid } }
      responses:
        "200": { description: 图片文件 }
        "404": { description: 未缓存，返回占位图 }
  /api/v0/characters/{id}/image:
    get:
      tags: [图片]
      summary: 角色图片
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [large, medium, small, grid], default: grid } }
      responses:
        "200": { description: 图片文件 }
        "404": { description: 未缓存，返回占位图 }
  /api/v0/persons/{id}/image:
    get:
      tags: [图片]
      summary: 人物图片
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [large, medium, small, grid], default: grid } }
      responses:
        "200": { description: 图片文件 }
        "404": { description: 未缓存，返回占位图 }

  # ── ELO ──
  /api/v0/elo/pair:
    get:
      tags: [ELO]
      summary: 获取一对随机动画用于比较
      responses:
        "200":
          description: 两部动画的基本信息
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ELOEntry"
  /api/v0/elo/compare:
    post:
      tags: [ELO]
      summary: 提交比较结果
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                winner: { type: integer, example: 51 }
                loser: { type: integer, example: 288 }
      responses:
        "200": { description: OK }
  /api/v0/elo/ranking:
    get:
      tags: [ELO]
      summary: ELO 排名
      responses:
        "200":
          description: 按 ELO 分数降序排列
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ELOEntry"

  # ── 搜索 ──
  /api/v0/search:
    get:
      tags: [搜索]
      summary: 搜索
      description: 通过预建索引搜索。type 可选 subjects, characters, persons, tags（逗号分隔）。
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, example: "CLANNAD" }
        - { name: type, in: query, schema: { type: string, default: "subjects,characters,persons,tags" } }
      responses:
        "200":
          description: 分类搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
  /api/v0/search/deep:
    post:
      tags: [搜索]
      summary: 深度搜索｜SSE
      description: 扫描全部 JSON 文件全文搜索，结果通过 SSE 实时推送。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, example: "CLANNAD" }
                type: { type: string, default: "subjects,characters,persons", example: "subjects" }
      responses:
        "200":
          description: text/event-stream 流式结果
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"type":"subjects","id":51,"name":"CLANNAD"}
                  data: {"step":"complete","total":1}

  # ── 拉取 ──
  /api/v0/fetch/subject:
    post:
      tags: [拉取]
      summary: 单个或批量拉取动画
      description: |
        从 Bangumi API 拉取动画的全部数据并缓存到本地。
        支持两种方式：
        - `{"id": 51}` 拉取单个
        - `{"ids": [51, 288, 9717]}` 批量拉取
        自动记录到 `_seshat.json`，返回 `task_id` 用于订阅实时进度。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, example: 51, description: 单个动画 ID }
                ids: { type: array, items: { type: integer }, example: [51, 288, 9717], description: 多个动画 ID }
            examples:
              single:
                value: { id: 51 }
              batch:
                value: { ids: [51, 288, 9717] }
      responses:
        "200":
          description: 拉取已开始
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 2 }
                  task_id: { type: string, example: "ae8687f0", description: "用于 GET /api/v0/progress/{task_id}" }
  /api/v0/fetch/all:
    post:
      tags: [拉取]
      summary: 拉取全部 tracker 中的动画
      description: 扫描 Tracker 目录下所有列表，从上游全量拉取全部 subject 数据。覆盖已有，不删除本地多余数据。返回 task_id。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/update:
    post:
      tags: [拉取]
      summary: 增量拉取新增的动画
      description: 对比 Tracker 与本地 subjects.json，只拉取新增的 ID。若无新增返回 up-to-date。
      responses:
        "200":
          description: 后台执行或无新增
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "fetching" }
                  count: { type: integer, example: 3 }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/images:
    post:
      tags: [拉取]
      summary: 重建图片缓存
      description: 删除本地 images 目录，根据现有 list 文件重新下载所有图片。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "downloading" }
                  count: { type: integer, example: 150 }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/index:
    post:
      tags: [拉取]
      summary: 从 API 缓存重建索引
      description: 扫描 api/ 目录下所有已缓存的 JSON，重建 subjects.json、characters.json、persons.json、tags.json。不重建 images 索引。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "rebuilding" }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/fetch/deep:
    post:
      tags: [拉取]
      summary: 重建数据库
      description: 清空所有缓存（api、images、tags、index），重新拉取全部 Tracker 数据。返回 task_id。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/progress/{task_id}:
    get:
      tags: [拉取]
      summary: 获取拉取进度｜SSE
      description: 实时推送拉取进度（阶段、完成数/总数、下载速度）。前端可用 EventSource 订阅。
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
          example: "ae8687f0"
      responses:
        "200":
          description: text/event-stream 流式进度
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"step":"subject","done":0,"total":1,"speed":"0.0/s","status":"fetching"}
                  data: {"step":"characters","done":21,"total":39,"speed":"2.7/s","status":""}
                  data: {"step":"complete","done":2,"total":2,"speed":"0.0/s","status":""}

  # ── Tracker ──
  /api/v0/tracker:
    get:
      tags: [Tracker]
      summary: 列出所有 Tracker
      responses:
        "200":
          description: Tracker 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackerItem"
  /api/v0/fetch/tracker:
    post:
      tags: [拉取]
      summary: 按名称刷新指定 Tracker
      description: 传入 Tracker 名称数组，刷新其中的全部 subject。返回 task_id。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                names: { type: array, items: { type: string }, example: ["seshat", "user"] }
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  names: { type: array, items: { type: string } }
                  task_id: { type: string, example: "ae8687f0" }
  /api/v0/tracker/create:
    post:
      tags: [Tracker]
      summary: 创建空 Tracker
      description: 创建一个指定名称的空 `.toml` Tracker 文件，用户手动填入 ID。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "kyoani" }
      responses:
        "200":
          description: 创建成功
        "409":
          description: Tracker 已存在

  # ── 用户 ──
  /api/v0/user/profile:
    get:
      tags: [用户]
      summary: 列出用户信息
      responses:
        "200":
          description: 用户数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v0/fetch/user:
    post:
      tags: [拉取]
      summary: 拉取用户收藏
      description: 从 config 读取 username，逐页拉取该用户的动画收藏。返回 task_id。
      responses:
        "200":
          description: 后台执行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  username: { type: string }
                  task_id: { type: string, example: "ae8687f0" }

components:
  responses:
    NotFound:
      description: 资源不存在（未缓存）

  schemas:
    SubjectListItem:
      type: object
      properties:
        id: { type: integer, example: 51 }
        name: { type: string, example: "CLANNAD -クラナド-" }
        name_cn: { type: string, example: "CLANNAD" }
        score: { type: number, example: 8.4 }
        platform: { type: string, example: "TV" }
        date: { type: string, example: "2007-10-04" }
        image: { type: string, example: "/api/v0/subjects/51/image?type=grid" }

    NameEntry:
      type: object
      properties:
        id: { type: integer, example: 4 }
        name: { type: string, example: "古河渚" }
        name_cn: { type: string, example: "古河渚" }

    Subject:
      type: object
      properties:
        id: { type: integer, example: 51 }
        type: { type: integer, example: 2 }
        name: { type: string, example: "CLANNAD -クラナド-" }
        name_cn: { type: string, example: "CLANNAD" }
        summary: { type: string, example: "故事发生在一个小镇上…" }
        date: { type: string, example: "2007-10-04" }
        platform: { type: string, example: "TV" }
        eps: { type: integer, example: 23 }
        total_episodes: { type: integer, example: 23 }
        rating:
          type: object
          properties:
            rank: { type: integer, example: 74 }
            total: { type: integer, example: 25648 }
            score: { type: number, example: 8.4 }
            count:
              type: object
              additionalProperties: { type: integer }
              example: { "1": 102, "5": 398, "10": 5268 }
        collection:
          type: object
          properties:
            wish: { type: integer, example: 7189 }
            collect: { type: integer, example: 39029 }
            doing: { type: integer, example: 2306 }
            on_hold: { type: integer, example: 1659 }
            dropped: { type: integer, example: 420 }
        tags:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: "Clannad" }
              count: { type: integer, example: 6682 }
        infobox:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: "中文名" }
              value: { type: string, example: "CLANNAD" }

    RelatedCharacter:
      type: object
      properties:
        id: { type: integer, example: 4 }
        name: { type: string, example: "古河渚" }
        type: { type: integer, example: 1 }
        relation: { type: string, example: "主角" }
        images:
          type: object
          properties:
            large: { type: string }
            grid: { type: string }
        actors:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 4145 }
              name: { type: string, example: "中原麻衣" }
              career: { type: array, items: { type: string } }

    RelatedPerson:
      type: object
      properties:
        id: { type: integer, example: 2229 }
        name: { type: string, example: "八田陽子" }
        type: { type: integer, example: 1 }
        career: { type: array, items: { type: string }, example: ["producer"] }
        relation: { type: string, example: "制片人" }
        eps: { type: string, example: "" }

    Episode:
      type: object
      properties:
        id: { type: integer, example: 1044433 }
        type: { type: integer, description: "0=本篇 1=SP 2=OP 3=ED 4=预告 5=MAD 6=其他", example: 0 }
        sort: { type: number, example: 1 }
        ep: { type: number, example: 1 }
        name: { type: string, example: "みんなでなら魔法少女になれる気がしたの" }
        name_cn: { type: string, example: "感觉和大家一起的话 就能够成为魔法少女" }
        duration: { type: string, example: "00:23:40" }
        airdate: { type: string, example: "2021-07-31" }
        desc: { type: string }

    SubjectRelation:
      type: object
      properties:
        id: { type: integer, example: 302875 }
        type: { type: integer, example: 2 }
        name: { type: string }
        name_cn: { type: string }
        relation: { type: string, example: "前传" }

    Character:
      type: object
      properties:
        id: { type: integer, example: 4 }
        name: { type: string, example: "古河渚" }
        type: { type: integer, example: 1 }
        summary: { type: string }
