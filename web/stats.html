<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#1d1d1d]">
<head>
<meta charset="utf-8"><meta name="view-transition" content="same-origin"><meta name="viewport" content="width=device-width, initial-scale=1"><title>统计</title>
<script src="/assets/tailwindcss-3.4.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#1d1d1d',card:'#2a2a2a',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95','pink-bg':'#403638'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">
<div id="topbar"></div>
<main class="max-w-[900px] mx-auto p-6">
  <div class="flex items-center gap-3 mb-4 flex-wrap">
    <span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span>
    <span class="font-bold text-lg">评分</span>
    <span id="backend-note" class="text-xs text-sub" style="display:none">（仅能展示有本地索引和elo rating的部分）</span>
    <span class="text-xs text-sub" style="margin-left:auto">排序</span>
    <div class="flex gap-1">
      <button id="btn-sort-elo" class="px-3 py-1 rounded-lg text-xs cursor-pointer border border-[#FE8A95] bg-[#FE8A95] text-white font-semibold" onclick="sortBy('elo')">ELO</button>
      <button id="btn-sort-score" class="px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white" onclick="sortBy('score')">评分</button>
    </div>
    <span class="text-xs text-sub ml-4">显示</span>
    <div class="flex gap-1" id="toggles" style="display:none">
      <button id="btn-no-rating" class="px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white" onclick="toggleNoRating()">无 ELO Rating</button>
      <button id="btn-orphans" class="px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white" onclick="toggleOrphans()">无本地数据</button>
    </div>
  </div>
  <div id="stats-list"><div class="text-center py-20 text-sub">加载中…</div></div>
</main>
<script src="assets/app.js"></script>
<script>
if (window.BACKEND_URL) document.getElementById('backend-note').style.display = '';
else document.getElementById('toggles').style.display = '';

var _entries = [], _noRating = [], _orphans = [];
var _orphanNames = {};
var _showNoRating = false, _showOrphans = false;
var sortKey = 'elo';

function toggleNoRating() { _showNoRating = !_showNoRating; updateBtn('btn-no-rating', _showNoRating); render(); }
function toggleOrphans() { _showOrphans = !_showOrphans; updateBtn('btn-orphans', _showOrphans); render(); }
function updateBtn(id, on) {
  var b = document.getElementById(id);
  b.className = on
    ? 'px-3 py-1 rounded-lg text-xs cursor-pointer border border-[#FE8A95] bg-[#FE8A95] text-white font-semibold'
    : 'px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white';
  b.innerHTML = (on ? '✓ ' : '') + (id === 'btn-no-rating' ? '无 ELO Rating' : '无本地数据');
}

async function load() {
  try {
    var data = (await api('/v0/elo/ranking')) || {};
    _entries = (data && data.entries) ? data.entries : [];
    _noRating = (data && data.no_rating) ? data.no_rating : [];
    _orphans = (data && data.orphans) ? data.orphans : [];
    sortBy('elo');
  } catch(e) {
    document.getElementById('stats-list').innerHTML = '<div class="text-center py-20 text-sub">加载失败</div>';
  }
}

function sortBy(key) {
  sortKey = key;
  document.getElementById('btn-sort-elo').className = key === 'elo'
    ? 'px-3 py-1 rounded-lg text-xs cursor-pointer border border-[#FE8A95] bg-[#FE8A95] text-white font-semibold'
    : 'px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white';
  document.getElementById('btn-sort-score').className = key === 'score'
    ? 'px-3 py-1 rounded-lg text-xs cursor-pointer border border-[#FE8A95] bg-[#FE8A95] text-white font-semibold'
    : 'px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white';
  render();
}

function render() {
  var isElo = sortKey === 'elo';
  var items = [];
  // Merge items based on toggles
  for (var i = 0; i < _entries.length; i++) items.push(_entries[i]);
  if (_showNoRating) { for (var i = 0; i < _noRating.length; i++) items.push(_noRating[i]); }
  if (_showOrphans) {
    for (var i = 0; i < _orphans.length; i++) {
      var cached = _orphanNames[_orphans[i].id];
      items.push({id: _orphans[i].id, name: cached ? cached.name : undefined, name_cn: cached ? cached.name_cn : undefined, score: cached ? cached.score : undefined, rating: _orphans[i].rating, _orphan: true});
      if (!cached) {
        (function(id) {
          api('/v0/subjects/' + id).then(function(s) {
            var score = (s && s.rating && s.rating.score) ? s.rating.score : null;
            _orphanNames[id] = (s && s.id) ? {name: s.name || '', name_cn: s.name_cn || '', score: score} : {name: null, name_cn: null, score: null};
            if (_showOrphans) render();
          });
        })(_orphans[i].id);
      }
    }
  }
  // Sort
  items.sort(function(a, b) {
    if (isElo) {
      var ra = a.rating ? (typeof a.rating === 'number' ? a.rating : a.rating) : 0;
      var rb = b.rating ? (typeof b.rating === 'number' ? b.rating : b.rating) : 0;
      var d = rb - ra;
      return d !== 0 ? d : (b.score || 0) - (a.score || 0);
    } else {
      var d = (b.score || 0) - (a.score || 0);
      return d !== 0 ? d : ((b.rating||0) - (a.rating||0));
    }
  });

  var html = '<div class="flex items-center gap-4 px-3 py-1.5 text-xs text-sub border-b border-[rgba(255,255,255,.06)]"><div class="w-10 shrink-0 text-center">动画</div><div class="flex-1 min-w-0"></div><div class="w-[100px] text-center shrink-0">ELO Rating</div><div class="w-[100px] text-center shrink-0">BGM Rank</div><div class="w-[60px] text-center shrink-0">ID</div></div>';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var bg = i % 2 === 0 ? 'bg-[#202028]' : 'bg-[#1a1a1e]';
    var eloCls = isElo ? 'text-sm font-semibold' : 'text-sm text-sub';
    var bkgCls = isElo ? 'text-sm text-sub' : 'text-sm font-semibold';
    if (it._orphan) {
      var oTitle = '加载中…', oSub = '';
      if (it.name !== undefined) {
        if (it.name) {
          oTitle = primaryName(it.name, it.name_cn);
          oSub = subName(it.name, it.name_cn);
        } else {
          oTitle = '无标题';
          oSub = '未能获取此条目的数据，可能是未储存此条目，或数据端点异常';
        }
      }
      html += '<div id="orphan-'+it.id+'" class="flex items-center gap-4 px-3 py-1.5 border border-transparent '+bg+'">'+
        '<img src="'+img('subject', it.id, 'grid')+'" '+imgOnError('subject', it.id, 'grid')+' class="w-10 h-10 rounded object-cover bg-[#151518] shrink-0">'+
        '<div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate'+(it.name ? '' : ' text-sub')+'">'+oTitle+'</div>'+(oSub?'<div class="text-xs text-sub truncate">'+oSub+'</div>':'')+'</div>'+
        '<span class="'+eloCls+' w-[100px] text-center shrink-0">'+it.rating.toFixed(0)+'</span>'+
        '<span class="'+bkgCls+' w-[100px] text-center shrink-0">'+(it.score != null ? it.score.toFixed(1) : '-')+'</span>'+
        '<span class="text-xs text-sub w-[60px] text-center shrink-0">#'+it.id+'</span></div>';
    } else {
      var primary = primaryName(it.name, it.name_cn);
      var sub = subName(it.name, it.name_cn);
      var ratingVal = it.rating ? (typeof it.rating === 'number' ? it.rating.toFixed(0) : it.rating) : '-';
      html += '<div onclick="location.href=\'/subject.html?id='+it.id+'\'" class="flex items-center gap-4 px-3 py-1.5 cursor-pointer hover:border-[#FE8A95] border border-transparent '+bg+'">'+
        '<img src="'+img('subject', it.id, 'grid')+'" '+imgOnError('subject', it.id, 'grid')+' class="w-10 h-10 rounded object-cover bg-[#151518] shrink-0">'+
        '<div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">'+primary+'</div>'+(sub?'<div class="text-xs text-sub truncate">'+sub+'</div>':'')+'</div>'+
        '<span class="'+eloCls+' w-[100px] text-center shrink-0">'+ratingVal+'</span>'+
        '<span class="'+bkgCls+' w-[100px] text-center shrink-0">'+(it.score ? it.score.toFixed(1) : '-')+'</span>'+
        '<span class="text-xs text-sub w-[60px] text-center shrink-0">#'+it.id+'</span></div>';
    }
  }
  document.getElementById('stats-list').innerHTML = html;
}

load();
</script>
</body>
</html>
