<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#1d1d1d]">
<head>
<meta charset="utf-8"><meta name="view-transition" content="same-origin"><meta name="viewport" content="width=device-width, initial-scale=1"><title>统计</title>
<script src="/assets/tailwindcss-3.4.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#1d1d1d',card:'#2a2a2a',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95','pink-bg':'#403638'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">
<div id="topbar"></div>
<main class="max-w-[900px] mx-auto p-6">
  <div class="flex items-center gap-4 mb-4">
    <span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span>
    <span class="font-bold text-lg">评分</span>
    <span class="text-xs text-sub ml-auto">排序方式</span>
    <div class="flex gap-1">
      <button id="btn-sort-elo" class="px-3 py-1 rounded-lg text-xs cursor-pointer border-0 bg-[#FE8A95] text-white font-semibold" onclick="sortBy('elo')">ELO Rating</button>
      <button id="btn-sort-score" class="px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white" onclick="sortBy('score')">BGM Rank</button>
    </div>
  </div>
  <div id="stats-list"><div class="text-center py-20 text-sub">加载中…</div></div>
</main>
<script src="assets/app.js"></script>
<script>
var allItems = [];
var sortKey = 'elo';

async function load() {
  try {
    var eloList = (await api('/v0/elo/ranking')) || [];
    allItems = Array.isArray(eloList) ? eloList : [];
    for (var i = 0; i < allItems.length; i++) {
      if (!allItems[i].rating) allItems[i].rating = 1500;
    }
    sortBy('elo');
  } catch(e) {
    document.getElementById('stats-list').innerHTML = '<div class="text-center py-20 text-sub">加载失败</div>';
  }
}

function sortBy(key) {
  sortKey = key;
  document.getElementById('btn-sort-elo').className = key === 'elo'
    ? 'px-3 py-1 rounded-lg text-xs cursor-pointer border-0 bg-[#FE8A95] text-white font-semibold'
    : 'px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white';
  document.getElementById('btn-sort-score').className = key === 'score'
    ? 'px-3 py-1 rounded-lg text-xs cursor-pointer border-0 bg-[#FE8A95] text-white font-semibold'
    : 'px-3 py-1 rounded-lg text-xs cursor-pointer border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white';

  allItems.sort(function(a, b) {
    if (key === 'elo') {
      var d = b.rating - a.rating;
      return d !== 0 ? d : (b.score || 0) - (a.score || 0);
    } else {
      var d = (b.score || 0) - (a.score || 0);
      return d !== 0 ? d : b.rating - a.rating;
    }
  });
  render();
}

function render() {
  var isElo = sortKey === 'elo';
  var html = '<div class="flex items-center gap-4 px-3 py-1.5 text-xs text-sub border-b border-[rgba(255,255,255,.06)]"><div class="w-10 shrink-0 text-center">动画</div><div class="flex-1 min-w-0"></div><div class="w-[100px] text-center shrink-0">ELO Rating</div><div class="w-[100px] text-center shrink-0">BGM Rank</div><div class="w-[60px] text-center shrink-0">ID</div></div>';
  for (var i = 0; i < allItems.length; i++) {
    var it = allItems[i];
    var bg = i % 2 === 0 ? 'bg-[#202028]' : 'bg-[#1a1a1e]';
    var primary = primaryName(it.name, it.name_cn);
    var sub = subName(it.name, it.name_cn);
    var eloCls = isElo ? 'text-sm font-semibold' : 'text-sm text-sub';
    var bkgCls = isElo ? 'text-sm text-sub' : 'text-sm font-semibold';
    html += '<div onclick="location.href=\'/subject.html?id='+it.id+'\'" class="flex items-center gap-4 px-3 py-1.5 cursor-pointer hover:border-[#FE8A95] border border-transparent '+bg+'">'+
      '<img src="'+img('subject', it.id, 'grid')+'" '+imgOnError('subject', it.id, 'grid')+' class="w-10 h-10 rounded object-cover bg-[#151518] shrink-0">'+
      '<div class="flex-1 min-w-0">'+
        '<div class="text-sm font-semibold truncate">'+primary+'</div>'+
        (sub ? '<div class="text-xs text-sub truncate">'+sub+'</div>' : '')+
      '</div>'+
      '<span class="'+eloCls+' w-[100px] text-center shrink-0">'+(it.rating ? it.rating.toFixed(0) : '1500')+'</span>'+
      '<span class="'+bkgCls+' w-[100px] text-center shrink-0">'+(it.score ? it.score.toFixed(1) : '-')+'</span>'+
      '<span class="text-xs text-sub w-[60px] text-center shrink-0">#'+it.id+'</span>'+
    '</div>';
  }
  document.getElementById('stats-list').innerHTML = html;
}

load();
</script>
</body>
</html>
