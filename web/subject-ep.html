<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#181818]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>章节列表</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#181818',card:'#242424',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>

<main id="view" class="max-w-[900px] mx-auto p-6"></main>

<script src="assets/app.js"></script>
<script>
(async () => {
  const SID = new URLSearchParams(location.search).get('id');
  const s = (await api('/api/v1/subjects/'+SID));
  const eps = (await api('/api/v1/subjects/'+SID+'/episodes'))||[];
  const types = {0:'本篇',1:'SP',2:'OP',3:'ED',4:'预告',5:'MAD',6:'其他'};
  const main = eps.filter(e=>e.type===0).sort((a,b)=>a.sort-b.sort);
  const sp = eps.filter(e=>e.type!==0).sort((a,b)=>a.sort-b.sort);

  function epRows(list, label) {
    if (!list.length) return '';
    return `<div class="mb-6"><div class="text-sm text-sub font-semibold mb-3">${label}</div>
      ${list.map(e => `<div class="ml-2 pl-4 border-l-2 border-[rgba(255,255,255,.08)] py-3">
        <div class="flex items-center gap-3">
          <span class="text-[#FE8A95] text-sm font-bold w-10">${e.type===0?String(Math.floor(e.sort||e.ep||0)).padStart(2,'0'):types[e.type]}</span>
          <span class="font-semibold">${e.name_cn||e.name}</span>
        </div>
        <div class="text-[11px] text-sub mt-1 ml-13">${e.name||''} · ${e.duration||''} · ${e.airdate||''}${e.desc?`<p class="mt-1 leading-relaxed">${e.desc}</p>`:''}</div>
      </div>`).join('')}</div>`;
  }

  document.getElementById('view').innerHTML = `
    <a href="/subject.html?id=${SID}" class="text-sub text-sm no-underline hover:text-white mb-4 inline-block">← 返回动画</a>
    <h2 class="text-xl font-bold mb-1">${s.name_cn||s.name}</h2>
    <p class="text-sm text-sub mb-6">${s.name||''} · ${eps.length} 集</p>
    ${epRows(main, '本篇 ('+main.length+')')}
    ${epRows(sp, 'SP / 其他 ('+sp.length+')')}`;
})();
</script>
</body>
</html>
