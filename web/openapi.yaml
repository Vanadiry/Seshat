openapi: "3.0.0"
info:
  title: Seshat API
  description: |
    离线优先的 Bangumi 数据管理与浏览工具。
    从 Bangumi API 拉取动画、角色、人物数据存入本地 SQLite，通过 REST API 提供查询和双链浏览。
  version: "0.1.0"
servers:
  - url: http://127.0.0.1:8080
    description: 本地服务器

paths:
  /api/v1/health:
    get:
      tags: [系统]
      summary: 健康检查
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string

  /api/v1/settings:
    get:
      tags: [设置]
      summary: 读取配置
      responses:
        "200":
          description: 当前配置
    put:
      tags: [设置]
      summary: 写入配置
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bind_addr:    { type: string }
                port:         { type: integer }
                data_home:    { type: string }
                username:     { type: string }
                concurrency:  { type: integer }
      responses:
        "200":
          description: 保存成功

  /api/v1/subjects:
    get:
      tags: [动画]
      summary: 动画列表
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: 搜索关键词
        - name: tag
          in: query
          schema: { type: string }
          description: 标签筛选
        - name: platform
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: 分页列表

  /api/v1/subjects/fetch:
    post:
      tags: [动画]
      summary: 拉取单部动画数据
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
              required: [id]
      responses:
        "202":
          description: 返回 task_id，通过 SSE 订阅进度

  /api/v1/subjects/fetch/batch:
    post:
      tags: [动画]
      summary: 批量拉取
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: integer } }
      responses:
        "202":
          description: 返回 task_ids

  /api/v1/subjects/{id}:
    get:
      tags: [动画]
      summary: 动画详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 完整动画数据（含 infobox、评分、标签）

  /api/v1/subjects/{id}/characters:
    get:
      tags: [动画・关联]
      summary: 动画中的角色列表
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 角色列表（含关系 + 声优）

  /api/v1/subjects/{id}/persons:
    get:
      tags: [动画・关联]
      summary: 动画的制作组
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 制作组列表（含职务）

  /api/v1/subjects/{id}/tags:
    get:
      tags: [动画・关联]
      summary: 动画的标签
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 标签列表

  /api/v1/subjects/{id}/episodes:
    get:
      tags: [动画・关联]
      summary: 动画的剧集列表
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 剧集列表

  /api/v1/subjects/{id}/relations:
    get:
      tags: [动画・关联]
      summary: 关联作品（前传/续集/番外）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 关联作品列表

  /api/v1/characters/{id}:
    get:
      tags: [角色]
      summary: 角色详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 角色完整数据

  /api/v1/characters/{id}/subjects:
    get:
      tags: [角色・关联]
      summary: 角色出演的动画
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 动画列表

  /api/v1/characters/{id}/persons:
    get:
      tags: [角色・关联]
      summary: 角色的声优
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 声优列表

  /api/v1/persons/{id}:
    get:
      tags: [人物]
      summary: 人物详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 人物完整数据

  /api/v1/persons/{id}/subjects:
    get:
      tags: [人物・关联]
      summary: 人物参与的动画
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 动画列表

  /api/v1/persons/{id}/characters:
    get:
      tags: [人物・关联]
      summary: 人物配音的角色
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 角色列表

  /api/v1/episodes/{id}:
    get:
      tags: [剧集]
      summary: 单集详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 剧集完整数据

  /api/v1/tags:
    get:
      tags: [标签]
      summary: 所有标签列表
      responses:
        "200":
          description: 按使用量降序

  /api/v1/tags/{name}/subjects:
    get:
      tags: [标签]
      summary: 标签下的动画
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 分页动画列表

  /api/v1/tasks/{id}/events:
    get:
      tags: [任务]
      summary: SSE 任务进度流
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream 实时进度
