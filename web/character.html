<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#1d1d1d]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>角色详情</title>
<script src="/assets/tailwindcss-3.4.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#1d1d1d',card:'#2a2a2a',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>
<div id="detail-header" class="sticky top-12 z-40 bg-[#1c1c22] border-b border-[rgba(255,255,255,.12)]"></div>
<main id="view" class="max-w-[1200px] mx-auto p-6"></main>

<script src="assets/app.js"></script>
<script>
(async () => {
  const ID = new URLSearchParams(location.search).get('id');
  if (!ID) { document.getElementById('view').innerHTML = '<p class="text-sub text-center py-20">缺少角色 ID</p>'; return; }

  const c = (await api('/v0/characters/'+ID));
  if (!c) { document.getElementById('view').innerHTML = '<p class="text-sub text-center py-10">未找到该角色（ID: '+ID+'）</p>'; return; }

  document.getElementById('detail-header').innerHTML = '<div class="max-w-[1200px] mx-auto px-6 h-12 py-0 flex items-center gap-3">' +
    '<a href="javascript:history.back()" class="text-sub text-sm no-underline hover:text-white shrink-0">← 返回</a>' +
    '<span class="text-xl font-bold truncate">'+primaryName(c.name,'')+'</span>' +
    '<span class="text-xs text-sub ml-auto shrink-0">ID: '+c.id+'</span></div>';

  const info = (() => { try { const d=JSON.parse(c.infobox||'[]'); const o={}; for(const i of d) if(i.key && typeof i.value==='string') o[i.key]=i.value; return o; } catch(e){return {}} })();
  const infoEntries = Object.entries(info);

  document.getElementById('view').innerHTML = `
    <div class="flex flex-col md:flex-row gap-6">
      <div class="w-full md:w-[260px] shrink-0">
        <img src="${img('character',c.id,'large')}" onerror="this.remove()" class="w-full rounded-xl">
        ${infoEntries.length ? `
        <div class="mt-3 flex flex-col gap-0.5">${infoEntries.map(([k,v]) => `<div class="flex justify-between py-1 border-b border-[rgba(255,255,255,.06)] text-[13px]"><span class="text-sub">${k}</span><span class="text-right ml-2">${v}</span></div>`).join('')}</div>` : ''}
      </div>
      <div class="flex-1 min-w-0">
        ${c.gender ? `<div class="text-xs text-sub mb-2">性别: ${c.gender}</div>` : ''}
        ${c.summary ? `<p class="text-[13px] leading-relaxed text-sub mb-6">${c.summary}</p>` : ''}
        ${c.actors?.length ? `
        <div class="mb-6">
          <div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">声优</span></div>
          <div class="flex flex-wrap gap-2">${c.actors.map(a => `<span onclick="location.href='/person.html?id=${a.id}'" class="bg-[#2a2a2a] border border-[rgba(255,255,255,.12)] rounded-lg px-3 py-1.5 text-sm cursor-pointer hover:border-[#FE8A95]">${a.name}</span>`).join('')}</div>
        </div>` : ''}
        ${c.subjects?.length ? `
        <div class="mb-6">
          <div class="flex items-center gap-2 mb-3"><span class="w-[3px] h-[18px] bg-[#FE8A95] rounded-sm"></span><span class="font-bold">出演</span></div>
          <div class="flex flex-wrap gap-2">${c.subjects.map(s => `<span onclick="location.href='/subject.html?id=${s.id}'" class="bg-[#2a2a2a] border border-[rgba(255,255,255,.12)] rounded-lg px-3 py-1.5 text-sm cursor-pointer hover:border-[#FE8A95]">${s.name}</span>`).join('')}</div>
        </div>` : ''}
      </div>
    </div>`;
})();
</script>
</body>
</html>
