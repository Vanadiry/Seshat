<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#181818]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>角色列表</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#181818',card:'#242424',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95','pink-bg':'#3B3033'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>

<main class="max-w-[1200px] mx-auto p-6">
  <div id="grid" class="grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-2"></div>
  <div id="pager" class="mt-6 text-center"></div>
</main>

<script src="assets/app.js"></script>
<script>
var pageSize = 100;
var allItems = [];
var showing = 0;

function renderItem(c) {
  return '<div onclick="location.href=\'/character.html?id='+c.id+'\'" class="flex items-center gap-3 bg-[#242424] rounded-lg overflow-hidden cursor-pointer border border-[rgba(255,255,255,.12)] hover:border-[#FE8A95] transition-colors h-[72px]">'+
    '<img src="'+img('character',c.id,'grid')+'" loading="lazy" onerror="this.remove()" class="w-[72px] h-[72px] object-cover bg-[#1a1a23] shrink-0">'+
    '<div class="flex-1 min-w-0 pr-3 py-1">'+
    '<div class="text-sm font-semibold truncate">'+c.name+'</div>'+
    (c.name_cn ? '<div class="text-xs text-sub truncate mt-0.5">'+c.name_cn+'</div>' : '')+
    '</div></div>';
}

function showMore(n) {
  var grid = document.getElementById('grid');
  var end = Math.min(showing + n, allItems.length);
  var html = '';
  for (var i = showing; i < end; i++) { html += renderItem(allItems[i]); }
  grid.innerHTML += html;
  showing = end;
  updatePager();
}
function showAll() { showMore(allItems.length - showing); }
function updatePager() {
  var pager = document.getElementById('pager');
  if (allItems.length <= pageSize) {
    pager.innerHTML = '<span class="text-xs text-sub">共 '+allItems.length+' 个角色</span>';
    return;
  }
  var html = '<span class="text-xs text-sub">当前展示 '+showing+'，共 '+allItems.length+' 个角色</span>';
  if (showing < allItems.length) {
    html += ' <button onclick="showMore('+pageSize+')" class="ml-3 px-3 py-1 rounded-lg border border-[rgba(255,255,255,.12)] bg-transparent text-sub text-xs cursor-pointer hover:bg-[#2a2a35] hover:text-white">展开更多</button>';
    html += ' <button onclick="showAll()" class="ml-2 px-3 py-1 rounded-lg border border-[rgba(255,255,255,.12)] bg-transparent text-sub text-xs cursor-pointer hover:bg-[#2a2a35] hover:text-white">展开全部</button>';
  }
  pager.innerHTML = html;
}

(async () => {
  allItems = (await api('/api/v1/characters'))||[];
  if (!allItems.length) { document.getElementById('grid').innerHTML='<div class="col-span-full text-center py-20 text-sub">暂无数据</div>'; return; }
  showing = 0;
  showMore(pageSize);
})();
</script>
</body>
</html>
