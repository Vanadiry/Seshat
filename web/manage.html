<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>管理 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
        <style>
            .radio-pink {
                appearance: none;
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                border: 2px solid var(--c-sub);
                border-radius: 9999px;
                background: transparent;
                cursor: pointer;
                position: relative;
                flex: none;
            }
            .radio-pink:checked {
                border-color: var(--c-pink);
            }
            .radio-pink:checked::after {
                content: "";
                position: absolute;
                inset: 3px;
                border-radius: 9999px;
                background: var(--c-pink);
            }
            .radio-pink:focus-visible {
                outline: 2px solid var(--c-pink);
                outline-offset: 2px;
            }
            .danger-lock {
                position: relative;
                overflow: hidden;
            }
            .lock-fill {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                width: 0;
                background: rgba(220, 38, 38, 0.18);
                transition: width 0.05s linear;
                pointer-events: none;
            }
            .lock-label {
                position: relative;
                transition: color 0.5s ease;
            }
        </style>
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <main class="relative max-w-[1200px] mx-auto p-6">
            <div id="manage-content" class="flex flex-col sm:flex-row gap-8">
                <div class="flex-1 min-w-0">
                    <section class="mb-8 sm:mb-0">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="section-bar"></span>
                            <h2 class="font-bold text-sm">拉取</h2>
                        </div>

                        <div class="text-xs text-sub mb-2">来源</div>
                        <div class="flex flex-col gap-2 mb-3">
                            <label
                                data-feature="tracker"
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="tracker_new"
                                    class="radio-pink"
                                />
                                所有 Tracker 中的新增 ID
                            </label>
                            <label
                                data-feature="tracker"
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="tracker_all"
                                    class="radio-pink"
                                />
                                所有 Tracker
                            </label>
                            <label
                                data-feature="tracker"
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="tracker_names"
                                    class="radio-pink"
                                />
                                指定 Tracker
                            </label>
                            <div
                                id="row-fetch-names"
                                data-feature="tracker"
                                style="display: none"
                                class="ml-6 flex flex-col gap-2"
                            >
                                <div
                                    id="fetch-tracker-status"
                                    class="text-xs text-sub"
                                ></div>
                                <div
                                    id="fetch-tracker-items"
                                    class="flex flex-col gap-2 max-h-80 overflow-y-auto"
                                ></div>
                                <div class="flex items-stretch gap-2">
                                    <input
                                        id="fetch-names"
                                        placeholder="也可以填写 Tracker ID，逗号分隔"
                                        class="h-10 flex-1 px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                                    />
                                    <button
                                        id="btn-add-trackers"
                                        type="button"
                                        title="添加 Tracker"
                                        aria-label="添加 Tracker"
                                        class="h-10 w-10 shrink-0 rounded-lg border border-bord bg-transparent text-sub text-lg leading-none cursor-pointer hover:bg-active hover:text-text flex items-center justify-center"
                                    >
                                        +
                                    </button>
                                </div>
                            </div>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="ids"
                                    checked
                                    class="radio-pink"
                                />
                                指定 ID
                            </label>
                            <div
                                id="row-fetch-ids"
                                style="display: none"
                                class="ml-6"
                            >
                                <input
                                    id="fetch-ids"
                                    placeholder="动画 ID，如 51 或 51, 288"
                                    class="h-10 w-full px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                                />
                            </div>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-source"
                                    value="local"
                                    class="radio-pink"
                                />
                                本地存在的条目
                            </label>
                        </div>

                        <div class="text-xs text-sub mb-2">详情数据</div>
                        <div class="flex flex-col gap-2 mb-3">
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-json"
                                    value="fill"
                                    class="radio-pink"
                                />
                                补充缺失
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-json"
                                    value="overwrite"
                                    checked
                                    class="radio-pink"
                                />
                                全量下载并覆盖
                            </label>
                        </div>

                        <div class="text-xs text-sub mb-2">图片</div>
                        <div class="flex flex-col gap-2 mb-3">
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-images"
                                    value="none"
                                    class="radio-pink"
                                />
                                跳过
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-images"
                                    value="fill"
                                    class="radio-pink"
                                />
                                补充缺失
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="fetch-images"
                                    value="overwrite"
                                    checked
                                    class="radio-pink"
                                />
                                全量下载并覆盖
                            </label>
                        </div>

                        <button
                            id="btn-page-fetch"
                            class="h-10 w-full px-4 py-2 rounded-lg bg-pink-solid text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90"
                        >
                            开始拉取
                        </button>
                    </section>
                </div>

                <div class="hidden sm:block w-px bg-bord-light shrink-0"></div>

                <div class="flex-1 min-w-0">
                    <section class="mb-8" data-feature="upstream">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="section-bar"></span>
                            <h2 class="font-bold text-sm">上游 ID 搜索</h2>
                        </div>
                        <p class="text-xs text-sub mb-3">
                            从 Bangumi 搜索动画，把 ID 添加到“指定 ID”。
                        </p>
                        <div class="flex gap-2 mb-2">
                            <input
                                id="upstream-search-input"
                                placeholder="关键词，例如 CLANNAD"
                                class="h-10 flex-1 px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                            />
                            <button
                                id="btn-upstream-search"
                                type="button"
                                class="h-10 shrink-0 px-4 py-2 rounded-lg bg-pink-solid text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90"
                            >
                                搜索
                            </button>
                        </div>
                        <div
                            id="upstream-search-status"
                            class="text-xs text-sub"
                        ></div>
                        <div
                            id="upstream-search-results"
                            class="thin-scroll flex flex-col gap-1.5 mt-2 max-h-80 overflow-y-auto pr-1"
                        ></div>
                    </section>

                    <div id="manage-user"></div>

                    <section class="mb-8" data-feature="bundle">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="section-bar"></span>
                            <h2 class="font-bold text-sm">数据包</h2>
                        </div>
                        <p class="text-xs text-sub mb-3">
                            导出本地数据包，或导入 tar 数据包。
                        </p>

                        <div class="text-xs text-sub mb-2">导出</div>
                        <div class="flex flex-col gap-2 mb-2">
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="bundle-source"
                                    value="ids"
                                    checked
                                    class="radio-pink"
                                />
                                指定 ID
                            </label>
                            <label
                                class="flex items-center gap-2 cursor-pointer"
                            >
                                <input
                                    type="radio"
                                    name="bundle-source"
                                    value="trackers"
                                    class="radio-pink"
                                />
                                指定 Tracker
                            </label>
                        </div>
                        <div
                            id="bundle-export-tracker-picker"
                            style="display: none"
                            class="mb-2"
                        >
                            <div
                                id="bundle-export-tracker-status"
                                class="text-xs text-sub mb-1"
                            ></div>
                            <div
                                id="bundle-export-tracker-items"
                                class="thin-scroll flex flex-col gap-1.5 max-h-60 overflow-y-auto pr-1"
                            ></div>
                        </div>
                        <div class="flex flex-col gap-2 mb-2">
                            <input
                                id="bundle-export-ids"
                                placeholder="动画 ID，逗号分隔"
                                class="h-10 w-full px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                            />
                            <input
                                id="bundle-export-trackers"
                                placeholder="也可以填写 Tracker ID，逗号分隔"
                                style="display: none"
                                class="h-10 w-full px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                            />
                            <input
                                id="bundle-export-description"
                                placeholder="描述，可选"
                                class="h-10 w-full px-3 py-2 rounded-lg border border-bord bg-input text-sm"
                            />
                            <button
                                id="btn-bundle-export"
                                type="button"
                                class="h-10 w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text"
                            >
                                导出数据包
                            </button>
                            <div
                                id="bundle-export-status"
                                class="text-xs text-sub whitespace-pre-line break-all"
                            ></div>
                        </div>

                        <div class="text-xs text-sub mb-2">导入</div>
                        <input
                            id="bundle-file"
                            type="file"
                            accept=".tar,application/x-tar"
                            class="hidden"
                        />
                        <button
                            id="btn-bundle-import"
                            type="button"
                            class="h-10 w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active hover:text-text"
                        >
                            导入数据包
                        </button>
                        <div
                            id="bundle-file-status"
                            class="text-xs text-sub mt-2"
                        ></div>
                    </section>

                    <div id="manage-danger"></div>
                </div>
            </div>

            <div
                id="task-overlay"
                class="fixed inset-x-0 bottom-0 z-20 flex items-center justify-center bg-bg/40 backdrop-blur-xl p-6"
                style="display: none"
            >
                <div
                    class="w-full max-w-[420px] flex flex-col items-center text-center"
                >
                    <p
                        id="task-overlay-label"
                        class="text-lg font-bold mb-1"
                    ></p>
                    <div
                        id="task-overlay-phase"
                        class="text-xs text-sub mb-3"
                    ></div>
                    <div
                        class="w-full h-2 rounded-full bg-[rgba(128,128,128,.2)] overflow-hidden mb-2"
                    >
                        <div
                            id="task-overlay-fill"
                            class="h-full rounded-full"
                            style="
                                width: 0;
                                background: var(--c-toast-progress);
                                transition: width 0.2s linear;
                            "
                        ></div>
                    </div>
                    <div
                        id="task-overlay-detail"
                        class="text-xs text-sub mb-5"
                    ></div>
                    <button
                        id="btn-task-abort"
                        type="button"
                        class="h-10 px-5 py-2 rounded-lg border border-[#dc2626] bg-transparent text-[#dc2626] text-sm cursor-pointer hover:bg-pink-bg"
                    >
                        中止任务
                    </button>
                </div>
            </div>
        </main>

        <div
            id="confirm-overlay"
            class="fixed inset-0 bg-black/70 flex items-center justify-center z-[400] transition-opacity duration-200"
            style="display: none; opacity: 0"
        >
            <div
                class="bg-surface-alt border border-bord rounded-lg p-5 w-[340px] max-w-[85vw]"
                role="dialog"
                aria-modal="true"
                aria-labelledby="confirm-msg"
            >
                <p
                    id="confirm-msg"
                    class="text-sm mb-4 leading-relaxed whitespace-pre-line"
                ></p>
                <button
                    id="btn-confirm-exec"
                    class="h-10 w-full px-4 py-2 rounded-lg bg-pink-solid text-white text-sm font-semibold cursor-pointer border-0 hover:opacity-90 mb-2"
                >
                    执行
                </button>
                <button
                    id="btn-confirm-cancel"
                    class="h-10 w-full px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm cursor-pointer hover:bg-active"
                >
                    取消
                </button>
            </div>
        </div>

        <script src="assets/app.min.js"></script>
        <script type="module" src="assets/manage.js"></script>
        <script>
            function radioValue(name) {
                var el = document.querySelector(
                    'input[name="' + name + '"]:checked'
                );
                return el ? el.value : "";
            }

            function splitList(value) {
                return value
                    .split(",")
                    .map(function (s) {
                        return s.trim();
                    })
                    .filter(Boolean);
            }

            function splitIDs(value) {
                return splitList(value)
                    .map(function (s) {
                        return parseInt(s, 10);
                    })
                    .filter(function (n) {
                        return n > 0;
                    });
            }

            var _trackers = [];
            var _trackerIndex = {};
            var _selectedTrackerIDs = {};
            var _bundleSelectedTrackerIDs = {};
            var _trackersLoaded = false;
            var _trackerLoading = false;

            function trackerLabel(t) {
                return t.name || t.id;
            }

            function setStatusElement(id, text, retry) {
                var el = document.getElementById(id);
                if (!el) return;
                el.textContent = text;
                if (!retry) return;
                var btn = document.createElement("button");
                btn.type = "button";
                btn.className =
                    "ml-2 text-pink bg-transparent border-0 p-0 text-xs cursor-pointer";
                btn.textContent = "重试";
                btn.onclick = function () {
                    loadTrackerList(true);
                };
                el.appendChild(btn);
            }

            function setTrackerStatus(text, retry) {
                setStatusElement("fetch-tracker-status", text, retry);
            }

            function setBundleTrackerStatus(text, retry) {
                setStatusElement("bundle-export-tracker-status", text, retry);
            }

            function updateTrackerSelectionStatus() {
                if (!_trackers.length) {
                    setTrackerStatus(
                        "暂无 Tracker，可以直接填写 id 或用加号创建",
                        false
                    );
                    return;
                }
                var available = _trackers.some(function (t) {
                    return t.count > 0;
                });
                if (!available) {
                    setTrackerStatus(
                        "暂无可用 Tracker，可以直接填写 id 或用加号创建",
                        false
                    );
                    return;
                }
                setTrackerStatus(
                    "已选择 " + Object.keys(_selectedTrackerIDs).length + " 个",
                    false
                );
            }

            function updateBundleTrackerSelectionStatus() {
                if (!_trackers.length) {
                    setBundleTrackerStatus(
                        "暂无 Tracker，可以直接填写 Tracker ID",
                        false
                    );
                    return;
                }
                var available = _trackers.some(function (t) {
                    return t.count > 0;
                });
                if (!available) {
                    setBundleTrackerStatus(
                        "暂无可用 Tracker，可以直接填写 Tracker ID",
                        false
                    );
                    return;
                }
                setBundleTrackerStatus(
                    "已选择 " +
                        Object.keys(_bundleSelectedTrackerIDs).length +
                        " 个",
                    false
                );
            }

            function renderTrackerRows(boxId, selected, onChange) {
                var box = document.getElementById(boxId);
                if (!box) return;
                box.textContent = "";
                for (var id in selected) {
                    var item = _trackerIndex[id];
                    if (!item || item.count <= 0) {
                        delete selected[id];
                    }
                }
                var list = _trackers.slice().sort(function (a, b) {
                    if (a.type !== b.type) return a.type === "manual" ? -1 : 1;
                    var an = trackerLabel(a);
                    var bn = trackerLabel(b);
                    if (an !== bn) return an.localeCompare(bn, "zh-Hans-CN");
                    return a.id.localeCompare(b.id);
                });
                for (var i = 0; i < list.length; i++) {
                    (function (t) {
                        var enabled = t.count > 0;
                        var label = document.createElement("label");
                        label.className =
                            "h-10 w-full flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-lg border border-bord bg-transparent text-sub text-sm min-w-0 " +
                            (enabled
                                ? "cursor-pointer hover:bg-active hover:text-text focus-within:bg-active focus-within:text-text"
                                : "opacity-50");
                        var cb = document.createElement("input");
                        cb.type = "checkbox";
                        cb.className = "w-4 h-4 accent-pink shrink-0";
                        cb.value = t.id;
                        cb.checked = !!selected[t.id];
                        cb.disabled = !enabled;
                        cb.addEventListener("change", function () {
                            if (cb.checked) {
                                selected[t.id] = true;
                            } else {
                                delete selected[t.id];
                            }
                            if (onChange) onChange();
                        });
                        label.appendChild(cb);

                        var meta = document.createElement("span");
                        meta.className =
                            "flex items-center gap-2 flex-1 min-w-0";

                        var name = document.createElement("span");
                        name.className = "truncate min-w-0";
                        name.textContent = trackerLabel(t);
                        meta.appendChild(name);

                        if (t.name && t.name !== t.id) {
                            var idEl = document.createElement("span");
                            idEl.className =
                                "text-xs text-sub font-mono shrink-0";
                            idEl.textContent = t.id;
                            meta.appendChild(idEl);
                        }
                        label.appendChild(meta);

                        var count = document.createElement("span");
                        count.className = "ml-auto text-xs text-right shrink-0";
                        count.textContent = enabled ? t.count + " 条" : "空";
                        label.appendChild(count);

                        var typeEl = document.createElement("span");
                        typeEl.className =
                            "w-7 sm:w-8 text-right text-xs shrink-0";
                        typeEl.textContent =
                            t.type === "auto" ? "自动" : "手动";
                        label.appendChild(typeEl);

                        box.appendChild(label);
                    })(list[i]);
                }
                if (onChange) onChange();
            }

            function renderTrackerList() {
                renderTrackerRows(
                    "fetch-tracker-items",
                    _selectedTrackerIDs,
                    updateTrackerSelectionStatus
                );
                renderTrackerRows(
                    "bundle-export-tracker-items",
                    _bundleSelectedTrackerIDs,
                    updateBundleTrackerSelectionStatus
                );
            }

            async function loadTrackerList(force) {
                if (_trackerLoading) return;
                if (_trackersLoaded && !force) return;
                _trackerLoading = true;
                setTrackerStatus("加载中...", false);
                setBundleTrackerStatus("加载中...", false);
                try {
                    var res = await fetch(API + "/v0/tracker");
                    var d = await readJSON(res);
                    if (!res.ok || !d) {
                        setTrackerStatus("Tracker 列表加载失败", true);
                        setBundleTrackerStatus("Tracker 列表加载失败", true);
                        return;
                    }
                    _trackers = Array.isArray(d.data) ? d.data : [];
                    _trackersLoaded = true;
                    _trackerIndex = {};
                    for (var i = 0; i < _trackers.length; i++) {
                        _trackerIndex[_trackers[i].id] = _trackers[i];
                    }
                    renderTrackerList();
                } catch (e) {
                    setTrackerStatus("Tracker 列表加载失败", true);
                    setBundleTrackerStatus("Tracker 列表加载失败", true);
                } finally {
                    _trackerLoading = false;
                }
            }

            function updateFetchRows() {
                var source = radioValue("fetch-source");
                var showNames = source === "tracker_names";
                document.getElementById("row-fetch-names").style.display =
                    showNames ? "" : "none";
                document.getElementById("row-fetch-ids").style.display =
                    source === "ids" ? "" : "none";
                if (showNames) loadTrackerList(false);
            }

            function buildFetchBody() {
                var source = radioValue("fetch-source");
                var body = {
                    source: source,
                    json: radioValue("fetch-json"),
                    images: radioValue("fetch-images")
                };
                if (source === "tracker_names") {
                    var names = [];
                    var seen = {};
                    var selected = Object.keys(_selectedTrackerIDs);
                    for (var i = 0; i < selected.length; i++) {
                        if (!seen[selected[i]]) {
                            seen[selected[i]] = true;
                            names.push(selected[i]);
                        }
                    }
                    var manual = splitList(
                        document.getElementById("fetch-names").value
                    );
                    for (var j = 0; j < manual.length; j++) {
                        if (!seen[manual[j]]) {
                            seen[manual[j]] = true;
                            names.push(manual[j]);
                        }
                    }
                    if (!names.length) {
                        showError("请选择或填写 Tracker");
                        return null;
                    }
                    for (var k = 0; k < names.length; k++) {
                        if (!/^[a-zA-Z0-9_-]+$/.test(names[k])) {
                            showError(MSG.errInvalidTrackerName);
                            return null;
                        }
                    }
                    if (_trackersLoaded) {
                        var missing = [];
                        for (var m = 0; m < names.length; m++) {
                            if (!_trackerIndex[names[m]]) {
                                missing.push(names[m]);
                            }
                        }
                        if (missing.length) {
                            showError("未找到 Tracker：" + missing.join("、"));
                            return null;
                        }
                        var empty = [];
                        for (var n = 0; n < names.length; n++) {
                            var info = _trackerIndex[names[n]];
                            if (info && info.count === 0) {
                                empty.push(names[n]);
                            }
                        }
                        if (empty.length) {
                            showError("Tracker 为空：" + empty.join("、"));
                            return null;
                        }
                    }
                    body.names = names;
                }
                if (source === "ids") {
                    body.ids = splitIDs(
                        document.getElementById("fetch-ids").value
                    );
                    if (!body.ids.length) {
                        showError("请填写动画 ID");
                        return null;
                    }
                }
                return body;
            }

            function fetchSummary(body) {
                var lines = [
                    "来源：" +
                        {
                            tracker_new: "所有 Tracker 中的新增 ID",
                            tracker_all: "所有 Tracker",
                            tracker_names: "指定 Tracker",
                            ids: "指定 ID",
                            local: "本地存在的条目"
                        }[body.source]
                ];
                if (body.names && body.names.length) {
                    lines.push("Tracker：" + body.names.join("、"));
                }
                if (body.ids && body.ids.length) {
                    lines.push("ID：" + body.ids.join("、"));
                }
                lines.push(
                    "详情数据：" +
                        (body.json === "fill" ? "补充缺失" : "全量下载并覆盖")
                );
                lines.push(
                    "图片：" +
                        {
                            none: "跳过",
                            fill: "补充缺失",
                            overwrite: "全量下载并覆盖"
                        }[body.images]
                );
                lines.push("");
                lines.push("确定开始拉取？");
                return lines.join("\n");
            }

            function requestStartFetch() {
                var body = buildFetchBody();
                if (!body) return;
                confirmAction(fetchSummary(body), function () {
                    startFetch(body);
                });
            }

            async function startFetch(body) {
                body = body || buildFetchBody();
                if (!body) return;
                var res = await fetch(API + "/v0/fetch", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                var d = await readJSON(res);
                if (!res.ok || !d) {
                    showError(errText(d, res.status));
                    return;
                }
                if (d.task_id) {
                    startProgress(d.task_id);
                } else {
                    showInfo("没有需要处理的条目");
                }
            }

            function requestAddTrackers() {
                var names = splitList(
                    document.getElementById("fetch-names").value
                );
                if (!names.length) {
                    showError("请填写 Tracker ID");
                    return;
                }
                for (var i = 0; i < names.length; i++) {
                    if (!/^[a-zA-Z0-9_-]+$/.test(names[i])) {
                        showError(MSG.errInvalidTrackerName);
                        return;
                    }
                }
                confirmAction(
                    "将创建以下 Tracker：\n" +
                        names.join("、") +
                        "\n已存在的会跳过",
                    function () {
                        addTrackers(names);
                    }
                );
            }

            async function addTrackers(names) {
                var created = 0,
                    existed = 0,
                    failed = 0;
                for (var i = 0; i < names.length; i++) {
                    var r = await fetch(API + "/v0/tracker/create", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ id: names[i] })
                    });
                    if (r.ok) created++;
                    else if (r.status === 409) existed++;
                    else failed++;
                }
                if (failed > 0) {
                    showWarn(
                        "已添加 " +
                            created +
                            " 个，已存在 " +
                            existed +
                            " 个，失败 " +
                            failed +
                            " 个"
                    );
                } else {
                    showSuccess(
                        "已添加 " +
                            created +
                            " 个 Tracker" +
                            (existed > 0 ? "，已存在 " + existed + " 个" : "")
                    );
                }
                loadTrackerList(true);
            }

            var _activeTaskId = "";
            var _bundleTaskId = "";
            var _overlayHideTimer = 0;
            var _overlayVisible = false;
            var _bodyOverflow = "";

            function showTaskOverlay(id, label) {
                if (!id) return;
                var overlay = document.getElementById("task-overlay");
                var content = document.getElementById("manage-content");
                var same = _activeTaskId === id;
                clearTimeout(_overlayHideTimer);
                _activeTaskId = id;
                document.getElementById("task-overlay-label").textContent =
                    label || "任务进行中";
                if (!same) {
                    document.getElementById("task-overlay-phase").textContent =
                        "";
                    document.getElementById("task-overlay-detail").textContent =
                        "";
                    var fill = document.getElementById("task-overlay-fill");
                    fill.style.width = "0";
                    fill.style.background = "var(--c-toast-progress)";
                }
                var topbar = document.getElementById("topbar");
                overlay.style.top =
                    Math.max(
                        0,
                        Math.round(topbar.getBoundingClientRect().bottom)
                    ) + "px";
                if (!_overlayVisible) {
                    _bodyOverflow = document.body.style.overflow;
                    _overlayVisible = true;
                }
                document.body.style.overflow = "hidden";
                overlay.style.display = "flex";
                content.inert = true;
                document.getElementById("btn-task-abort").focus();
            }

            function hideTaskOverlay() {
                clearTimeout(_overlayHideTimer);
                _activeTaskId = "";
                var overlay = document.getElementById("task-overlay");
                if (overlay) overlay.style.display = "none";
                var content = document.getElementById("manage-content");
                if (content) content.inert = false;
                if (_overlayVisible) {
                    document.body.style.overflow = _bodyOverflow;
                    _overlayVisible = false;
                }
            }

            function updateTaskOverlay(detail) {
                if (!_activeTaskId || detail.id !== _activeTaskId) return;
                var d = detail.data || {};
                if (d.label) {
                    document.getElementById("task-overlay-label").textContent =
                        d.label;
                }
                var fill = document.getElementById("task-overlay-fill");
                var phase = document.getElementById("task-overlay-phase");
                var text = document.getElementById("task-overlay-detail");
                if (d.step === "complete" || d.step === "done") {
                    phase.textContent = "完成";
                    text.textContent = "";
                    fill.style.width = "100%";
                    fill.style.background = "#22c55e";
                    var doneId = _activeTaskId;
                    _overlayHideTimer = setTimeout(function () {
                        if (_activeTaskId === doneId) hideTaskOverlay();
                    }, 800);
                    return;
                }
                if (d.step === "error") {
                    phase.textContent = "任务失败";
                    text.textContent = d.status || "";
                    fill.style.width = "100%";
                    fill.style.background = "var(--c-toast-error)";
                    var errId = _activeTaskId;
                    _overlayHideTimer = setTimeout(function () {
                        if (_activeTaskId === errId) hideTaskOverlay();
                    }, 2500);
                    return;
                }
                if (d.step === "cancelled") {
                    phase.textContent = "任务已终止";
                    text.textContent = "";
                    fill.style.width = "100%";
                    fill.style.background = "var(--c-toast-warning)";
                    var cancelId = _activeTaskId;
                    _overlayHideTimer = setTimeout(function () {
                        if (_activeTaskId === cancelId) hideTaskOverlay();
                    }, 1200);
                    return;
                }
                // start 事件只用于标记任务开始，进度以连接时的 snapshot 为准
                if (d.step === "start") return;
                var phaseText = d.phase_name || "";
                if (d.phase && d.phases) {
                    phaseText +=
                        (phaseText ? " " : "") + d.phase + "/" + d.phases;
                }
                phase.textContent = phaseText;
                if (typeof d.percent === "number") {
                    fill.style.width =
                        Math.max(0, Math.min(100, d.percent)) + "%";
                    var percentParts = [];
                    if (typeof d.done === "number" && d.total) {
                        var count = d.done + "/" + d.total;
                        if (d.speed) count += "，" + d.speed;
                        percentParts.push(count);
                    }
                    if (d.status) percentParts.push(d.status);
                    percentParts.push(d.percent + "%");
                    text.textContent = percentParts.join("，");
                } else if (typeof d.done === "number" && d.total) {
                    fill.style.width =
                        Math.round((d.done / d.total) * 100) + "%";
                    var parts = [];
                    parts.push(d.done + "/" + d.total);
                    if (d.speed) parts.push(d.speed);
                    text.textContent = parts.join("，");
                } else if (d.status) {
                    text.textContent = d.status;
                }
            }

            var _searchItems = [];
            var _searchTotal = 0;
            var _searchLoading = false;

            function searchYear(date) {
                return date ? String(date).slice(0, 4) : "";
            }

            function renderSearchResults() {
                var box = document.getElementById("upstream-search-results");
                var status = document.getElementById("upstream-search-status");
                box.textContent = "";
                if (!_searchItems.length) {
                    status.textContent = "没有找到结果";
                    return;
                }
                status.textContent =
                    "已显示 " +
                    _searchItems.length +
                    " / " +
                    _searchTotal +
                    " 条";
                for (var i = 0; i < _searchItems.length; i++) {
                    (function (item) {
                        var primary =
                            primaryName(item.name, item.name_cn) ||
                            "ID " + item.id;
                        var secondary = subName(item.name, item.name_cn);
                        var sub = ["ID " + item.id];
                        if (item.date) sub.push(searchYear(item.date));
                        if (item.platform) sub.push(item.platform);

                        var row = document.createElement("div");
                        row.className =
                            "flex items-center gap-2 px-3 py-1.5 rounded-lg border border-bord";

                        var meta = document.createElement("div");
                        meta.className = "flex-1 min-w-0";

                        var titleRow = document.createElement("div");
                        titleRow.className =
                            "flex items-baseline gap-1.5 min-w-0";
                        var name = document.createElement("span");
                        name.className =
                            "text-sm leading-tight truncate min-w-0 max-w-[60%]";
                        name.textContent = primary;
                        titleRow.appendChild(name);
                        if (secondary) {
                            var alt = document.createElement("span");
                            alt.className =
                                "text-xs leading-tight text-sub truncate min-w-0 flex-1";
                            alt.textContent = secondary;
                            titleRow.appendChild(alt);
                        }
                        meta.appendChild(titleRow);

                        var desc = document.createElement("div");
                        desc.className =
                            "text-[11px] leading-tight text-sub truncate mt-0.5";
                        desc.textContent = sub.join(" · ");
                        meta.appendChild(desc);
                        row.appendChild(meta);

                        var btn = document.createElement("button");
                        btn.type = "button";
                        btn.className =
                            "h-8 w-8 shrink-0 rounded-lg border border-bord bg-transparent text-sub text-lg leading-none cursor-pointer hover:bg-active hover:text-text flex items-center justify-center";
                        btn.textContent = "+";
                        btn.title = "添加到指定 ID";
                        btn.setAttribute("aria-label", "添加到指定 ID");
                        btn.onclick = function () {
                            addSearchResultID(item.id);
                        };
                        row.appendChild(btn);
                        box.appendChild(row);
                    })(_searchItems[i]);
                }
                if (_searchItems.length < _searchTotal) {
                    var more = document.createElement("button");
                    more.type = "button";
                    more.className =
                        "h-8 w-full px-4 rounded-lg border border-bord bg-transparent text-sub text-xs cursor-pointer hover:bg-active hover:text-text";
                    more.textContent = "加载更多";
                    more.onclick = function () {
                        runUpstreamSearch(true);
                    };
                    box.appendChild(more);
                }
            }

            async function runUpstreamSearch(append) {
                if (_searchLoading) return;
                var input = document.getElementById("upstream-search-input");
                var keyword = input.value.trim();
                if (!keyword) {
                    showError("请输入关键词");
                    input.focus();
                    return;
                }
                _searchLoading = true;
                var status = document.getElementById("upstream-search-status");
                status.textContent = "搜索中...";
                if (!append) {
                    _searchItems = [];
                    _searchTotal = 0;
                    document.getElementById(
                        "upstream-search-results"
                    ).textContent = "";
                }
                try {
                    var res = await fetch(API + "/v0/upstream/search", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            keyword: keyword,
                            limit: 20,
                            offset: append ? _searchItems.length : 0
                        })
                    });
                    var d = await readJSON(res);
                    if (!res.ok || !d) {
                        showError(errText(d, res.status));
                        status.textContent = "搜索失败";
                        return;
                    }
                    var page = Array.isArray(d.data) ? d.data : [];
                    _searchItems = _searchItems.concat(page);
                    _searchTotal =
                        typeof d.total === "number"
                            ? d.total
                            : _searchItems.length;
                    if (append && !page.length) {
                        _searchTotal = _searchItems.length;
                    }
                    renderSearchResults();
                } catch (e) {
                    showError("搜索失败");
                    status.textContent = "搜索失败";
                } finally {
                    _searchLoading = false;
                }
            }

            function addSearchResultID(id) {
                var input = document.getElementById("fetch-ids");
                var ids = splitIDs(input.value);
                var existed = ids.indexOf(id) !== -1;
                if (!existed) ids.push(id);
                input.value = ids.join(", ");

                var radio = document.querySelector(
                    'input[name="fetch-source"][value="ids"]'
                );
                if (radio && !radio.checked) radio.checked = true;
                updateFetchRows();

                var status = document.getElementById("upstream-search-status");
                if (status) {
                    status.textContent = existed
                        ? "#" + id + " 已在指定 ID 中"
                        : "已添加 #" + id + " 到指定 ID";
                }
            }

            function updateBundleExportRows() {
                var source = radioValue("bundle-source");
                document.getElementById("bundle-export-ids").style.display =
                    source === "ids" ? "" : "none";
                document.getElementById(
                    "bundle-export-trackers"
                ).style.display = source === "trackers" ? "" : "none";
                document.getElementById(
                    "bundle-export-tracker-picker"
                ).style.display = source === "trackers" ? "" : "none";
                if (source === "trackers") loadTrackerList(false);
            }

            function requestBundleExport() {
                var source = radioValue("bundle-source");
                var body = {
                    source: source,
                    description: document
                        .getElementById("bundle-export-description")
                        .value.trim()
                };
                var lines = [
                    "来源：" + (source === "ids" ? "指定 ID" : "指定 Tracker")
                ];
                if (source === "ids") {
                    body.ids = splitIDs(
                        document.getElementById("bundle-export-ids").value
                    );
                    if (!body.ids.length) {
                        showError("请填写动画 ID");
                        return;
                    }
                    lines.push("ID：" + body.ids.join("、"));
                } else {
                    var trackers = [];
                    var seenTrackers = {};
                    var selectedTrackers = Object.keys(
                        _bundleSelectedTrackerIDs
                    );
                    for (var i = 0; i < selectedTrackers.length; i++) {
                        if (!seenTrackers[selectedTrackers[i]]) {
                            seenTrackers[selectedTrackers[i]] = true;
                            trackers.push(selectedTrackers[i]);
                        }
                    }
                    var manualTrackers = splitList(
                        document.getElementById("bundle-export-trackers").value
                    );
                    for (var j = 0; j < manualTrackers.length; j++) {
                        if (!seenTrackers[manualTrackers[j]]) {
                            seenTrackers[manualTrackers[j]] = true;
                            trackers.push(manualTrackers[j]);
                        }
                    }
                    body.trackers = trackers;
                    if (!body.trackers.length) {
                        showError("请选择或填写 Tracker ID");
                        return;
                    }
                    for (var k = 0; k < body.trackers.length; k++) {
                        if (!/^[a-zA-Z0-9_-]+$/.test(body.trackers[k])) {
                            showError(MSG.errInvalidTrackerName);
                            return;
                        }
                    }
                    lines.push("Tracker：" + body.trackers.join("、"));
                }
                if (body.description) {
                    lines.push("描述：" + body.description);
                }
                lines.push("确定导出？");
                confirmAction(lines.join("\n"), function () {
                    doBundleExport(body);
                });
            }

            async function doBundleExport(body) {
                var btn = document.getElementById("btn-bundle-export");
                var status = document.getElementById("bundle-export-status");
                if (btn) btn.disabled = true;
                status.textContent = "导出中...";
                try {
                    var res = await fetch(API + "/v0/bundle/export", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body)
                    });
                    var d = await readJSON(res);
                    if (!res.ok || !d) {
                        showError(errText(d, res.status));
                        status.textContent = "导出失败";
                        return;
                    }
                    var lines = ["已导出 " + d.filename];
                    if (d.counts) {
                        lines.push(
                            "条目 " +
                                d.counts.subjects +
                                "，角色 " +
                                d.counts.characters +
                                "，人物 " +
                                d.counts.persons +
                                "，图片 " +
                                d.counts.images
                        );
                    }
                    lines.push("路径：" + d.path);
                    status.textContent = lines.join("\n");
                    showSuccess("已导出 " + d.filename);
                } catch (e) {
                    showError("导出失败");
                    status.textContent = "导出失败";
                } finally {
                    if (btn) btn.disabled = false;
                }
            }

            function setBundleStatus(text) {
                var el = document.getElementById("bundle-file-status");
                if (el) el.textContent = text;
            }

            function uploadBundle(file) {
                return new Promise(function (resolve, reject) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("POST", API + "/v0/bundle/import");
                    xhr.setRequestHeader("Content-Type", "application/x-tar");
                    xhr.upload.onprogress = function (e) {
                        if (!e.lengthComputable || !e.total) return;
                        setBundleStatus(
                            "上传中 " +
                                Math.round((e.loaded / e.total) * 100) +
                                "%"
                        );
                    };
                    xhr.onload = function () {
                        var d = null;
                        try {
                            d = JSON.parse(xhr.responseText);
                        } catch (_) {
                            d = null;
                        }
                        resolve({
                            ok: xhr.status >= 200 && xhr.status < 300,
                            status: xhr.status,
                            data: d
                        });
                    };
                    xhr.onerror = function () {
                        reject(new Error("network"));
                    };
                    xhr.send(file);
                });
            }

            async function startBundleImport(file) {
                var btn = document.getElementById("btn-bundle-import");
                if (btn) btn.disabled = true;
                setBundleStatus("上传中 0%");
                try {
                    var res = await uploadBundle(file);
                    if (!res.ok || !res.data) {
                        showError(errText(res.data, res.status));
                        setBundleStatus("导入失败");
                        if (btn) btn.disabled = false;
                        return;
                    }
                    if (res.data.task_id) {
                        _bundleTaskId = res.data.task_id;
                        setBundleStatus("导入中");
                        startProgress(res.data.task_id);
                    } else {
                        setBundleStatus("导入已开始");
                        if (btn) btn.disabled = false;
                    }
                } catch (e) {
                    showError("导入失败");
                    setBundleStatus("导入失败");
                    if (btn) btn.disabled = false;
                }
            }

            (async () => {
                if (!(await requireFeature("fetch"))) return;
                if (!(await requireFeature("task"))) return;
                applyFeatureVisibility(document);

                var sourceRadios = document.querySelectorAll(
                    'input[name="fetch-source"]'
                );
                for (var i = 0; i < sourceRadios.length; i++) {
                    sourceRadios[i].addEventListener("change", updateFetchRows);
                }
                var optionRadios = document.querySelectorAll(
                    'input[name="fetch-json"], input[name="fetch-images"]'
                );
                for (var i = 0; i < optionRadios.length; i++) {
                    optionRadios[i].addEventListener("change", updateFetchRows);
                }
                updateFetchRows();

                document.getElementById("btn-page-fetch").onclick =
                    requestStartFetch;
                document.getElementById("btn-add-trackers").onclick =
                    requestAddTrackers;
                var bundleSourceRadios = document.querySelectorAll(
                    'input[name="bundle-source"]'
                );
                for (var bi = 0; bi < bundleSourceRadios.length; bi++) {
                    bundleSourceRadios[bi].addEventListener(
                        "change",
                        updateBundleExportRows
                    );
                }
                updateBundleExportRows();
                document.getElementById("btn-bundle-export").onclick =
                    requestBundleExport;
                var bundleInput = document.getElementById("bundle-file");
                document.getElementById("btn-bundle-import").onclick =
                    function () {
                        bundleInput.click();
                    };
                bundleInput.addEventListener("change", function () {
                    var file = this.files && this.files[0];
                    if (!file) return;
                    if (!/\.tar$/i.test(file.name)) {
                        showError("请选择 .tar 文件");
                        this.value = "";
                        return;
                    }
                    if (file.size > 1024 * 1024 * 1024) {
                        showError("数据包不能超过 1 GiB");
                        this.value = "";
                        return;
                    }
                    setBundleStatus(
                        file.name + " · " + Math.round(file.size / 1024) + " KB"
                    );
                    confirmAction(
                        "将导入 " + file.name + "，覆盖同名文件并重建索引。",
                        function () {
                            startBundleImport(file);
                        }
                    );
                });
                document.getElementById("btn-upstream-search").onclick =
                    function () {
                        runUpstreamSearch(false);
                    };
                document
                    .getElementById("upstream-search-input")
                    .addEventListener("keydown", function (e) {
                        if (e.key === "Enter") {
                            e.preventDefault();
                            runUpstreamSearch(false);
                        }
                    });
                window.addEventListener("seshat:trackers-changed", function () {
                    loadTrackerList(true);
                });
                window.addEventListener("seshat:task-start", function (e) {
                    showTaskOverlay(e.detail.id, e.detail.label);
                });
                window.addEventListener("seshat:task-progress", function (e) {
                    updateTaskOverlay(e.detail);
                    if (!_bundleTaskId || e.detail.id !== _bundleTaskId) {
                        return;
                    }
                    var d = e.detail.data || {};
                    var btn = document.getElementById("btn-bundle-import");
                    if (
                        d.step === "complete" ||
                        d.step === "done" ||
                        d.step === "error" ||
                        d.step === "cancelled"
                    ) {
                        setBundleStatus(
                            d.step === "error"
                                ? "导入失败"
                                : d.step === "cancelled"
                                  ? "导入已终止"
                                  : "导入完成"
                        );
                        _bundleTaskId = "";
                        if (btn) btn.disabled = false;
                    }
                });
                window.addEventListener("seshat:task-error", function (e) {
                    if (_bundleTaskId && e.detail.id === _bundleTaskId) {
                        setBundleStatus("导入失败");
                        _bundleTaskId = "";
                        var bundleBtn =
                            document.getElementById("btn-bundle-import");
                        if (bundleBtn) bundleBtn.disabled = false;
                    }
                    if (!_activeTaskId || e.detail.id !== _activeTaskId) return;
                    document.getElementById("task-overlay-phase").textContent =
                        "进度连接中断";
                    document.getElementById("task-overlay-detail").textContent =
                        "请刷新页面重试";
                });
                window.addEventListener("resize", function () {
                    if (!_activeTaskId) return;
                    var topbar = document
                        .getElementById("topbar")
                        .getBoundingClientRect();
                    document.getElementById("task-overlay").style.top =
                        Math.max(0, Math.round(topbar.bottom)) + "px";
                });
                document.getElementById("btn-task-abort").onclick =
                    function () {
                        confirmAction(
                            "将终止 Seshat 后端进程，当前任务会中断，已完成的数据保留。",
                            function () {
                                fetch(API + "/v0/task/cancel", {
                                    method: "POST"
                                }).then(function () {
                                    showInfo("已发送中止请求");
                                });
                            }
                        );
                    };
                apiFor("task", "/v0/tasks").then(function (d) {
                    if (!d || !d.data || !d.data.length) return;
                    var task = d.data[0];
                    showTaskOverlay(task.id, task.label);
                    updateTaskOverlay({
                        id: task.id,
                        data: {
                            step: "snapshot",
                            label: task.label,
                            done: task.done,
                            total: task.total,
                            phase: task.phase,
                            phases: task.phases,
                            phase_name: task.phase_name
                        }
                    });
                });

                document.getElementById("btn-confirm-cancel").onclick =
                    closeConfirm;
            })();
        </script>
    </body>
</html>
