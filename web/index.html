<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Seshat</title>
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.6.0/styles/webawesome.css" />
  <script type="module" src="https://ka-f.webawesome.com/webawesome@3.6.0/webawesome.loader.js"></script>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="main">
  <div class="grid" id="grid"></div>
</div>


<div id="progress-area" style="display:none;position:fixed;top:56px;left:0;right:0;z-index:60;padding:0 24px;">
  <wa-progress-bar id="progress-bar" value="0"></wa-progress-bar>
  <div id="progress-text" style="font-size:12px;color:#71717a;margin-top:2px;"></div>
</div>

<script src="app.js"></script>
<script>
async function load() {
  const q = new URLSearchParams(location.search).get('q') || '';
  const grid = document.getElementById('grid');
  grid.innerHTML = '<wa-skeleton effect="sheen" style="height:150px;"></wa-skeleton>'.repeat(8);
  const data = await api('/api/v1/subjects' + (q ? '?q='+encodeURIComponent(q) : ''));
  const subs = data.data || [];
  if (!subs.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:80px 0;color:#52525b;">暂无数据。点击右上角「+ 拉取」添加动画</div>';
    return;
  }
  grid.innerHTML = subs.map(s => `
    <wa-card class="card" appearance="filled" onclick="location.href='/subject.html?id=${s.id}'">
      <img class="card-img" src="${imgUrl(s.image_path)}" loading="lazy" onerror="this.style.display='none'" />
      <div class="card-body">
        <div class="card-title">${s.name_cn||s.name}</div>
        <div class="card-meta">
          ${s.score?`<wa-badge variant="brand" pill>★ ${s.score}</wa-badge>`:''}
          <wa-badge variant="neutral" pill>${s.platform||''}</wa-badge>
          ${s.date?`<wa-badge variant="neutral" pill>${s.date.slice(0,4)}</wa-badge>`:''}
        </div>
      </div>
    </wa-card>
  `).join('');
}
load();
</script>
</body>
</html>
