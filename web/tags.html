<!DOCTYPE html>
<html lang="zh-CN" class="bg-[#181818]">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>标签</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#181818',card:'#242424',bord:'rgba(255,255,255,.12)',text:'rgba(255,255,255,.88)',sub:'rgba(255,255,255,.52)',pink:'#FE8A95','pink-bg':'#3B3033'}}}}</script>
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">

<div id="topbar"></div>

<main class="max-w-[1200px] mx-auto p-6">
  <div id="tags" class="flex flex-wrap gap-2"></div>
  <div id="pager" class="mt-6 text-center"></div>
</main>

<script src="assets/app.js"></script>
<script>
var pageSize = 100;
var allItems = [];
var showing = 0;

function renderItem(t) {
  return '<a href="/tags-subject.html?tag='+encodeURIComponent(t.name)+'" class="no-underline bg-[#242424] border border-[rgba(255,255,255,.12)] rounded-lg px-3 py-1.5 text-sm hover:border-[#FE8A95] transition-colors"><span class="text-[rgba(255,255,255,.88)] hover:text-[#FE8A95]">'+t.name+'</span><small class="text-sub ml-1.5">'+t.count+'</small></a>';
}

function showMore(n) {
  var el = document.getElementById('tags');
  var end = Math.min(showing + n, allItems.length);
  var html = '';
  for (var i = showing; i < end; i++) { html += renderItem(allItems[i]); }
  el.innerHTML += html;
  showing = end;
  updatePager();
}

function showAll() { showMore(allItems.length - showing); }

function updatePager() {
  var pager = document.getElementById('pager');
  if (allItems.length <= pageSize) {
    pager.innerHTML = '<span class="text-xs text-sub">共 '+allItems.length+' 个标签</span>';
    return;
  }
  var html = '<span class="text-xs text-sub">当前展示 '+showing+'，共 '+allItems.length+' 个标签</span>';
  if (showing < allItems.length) {
    html += ' <button onclick="showMore('+pageSize+')" class="ml-3 px-3 py-1 rounded-lg border border-[rgba(255,255,255,.12)] bg-transparent text-sub text-xs cursor-pointer hover:bg-[#2a2a35] hover:text-white">展开更多</button>';
    html += ' <button onclick="showAll()" class="ml-2 px-3 py-1 rounded-lg border border-[rgba(255,255,255,.12)] bg-transparent text-sub text-xs cursor-pointer hover:bg-[#2a2a35] hover:text-white">展开全部</button>';
  }
  pager.innerHTML = html;
}

(async () => {
  allItems = (await api('/api/v1/tags'))||[];
  if (!allItems.length) { document.getElementById('tags').innerHTML = '<span class="text-sub text-sm">暂无标签</span>'; return; }
  showing = 0;
  showMore(pageSize);
})();
</script>
</body>
</html>
