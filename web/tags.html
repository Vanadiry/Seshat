<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>标签</title>
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.6.0/styles/webawesome.css" />
  <script type="module" src="https://ka-f.webawesome.com/webawesome@3.6.0/webawesome.loader.js"></script>
  <link rel="stylesheet" href="app.css" />
</head>
<body>

<div id="topbar" class="topbar"></div>
<div class="main"><h4>标签</h4><div class="tag-list" id="view"></div></div>

<script src="app.js"></script>
<script>
(async()=>{
  const tags = (await api('/api/v1/tags')).data||[];
  document.getElementById('view').innerHTML = tags.map(t=>`
    <wa-badge variant="neutral" pill style="cursor:pointer;font-size:13px;" onclick="location.href='/?tag=${encodeURIComponent(t.name)}'">${t.name} (${t.count})</wa-badge>
  `).join('');
})();
</script>
</body>
</html>
