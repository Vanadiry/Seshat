<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>标签 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <main class="max-w-[1200px] mx-auto p-6">
            <div id="tags" class="flex flex-wrap gap-2"></div>
            <div id="pager" class="mt-6 text-center"></div>
        </main>

        <script src="assets/app.min.js"></script>
        <script>
            var allItems = [];

            function renderItem(t) {
                return (
                    '<a href="/tag?tag=' +
                    encodeURIComponent(escapeHtml(t.name)) +
                    '" class="no-underline bg-surface border border-bord rounded-lg px-3 py-1.5 text-sm hover:border-pink hover:-translate-y-0.5 transition-all"><span class="text-text">' +
                    escapeHtml(t.name) +
                    '</span><small class="text-sub ml-1.5">' +
                    t.count +
                    "</small></a>"
                );
            }

            var pager = createPager({
                containerId: "tags",
                unit: "个标签",
                pageSize: 200,
                getItems: function () {
                    return allItems;
                },
                renderItem: renderItem
            });

            (async () => {
                if (!(await requireFeature("tags"))) return;
                var res = await apiFor("tags", "/v0/tags");
                allItems = (res && res.data) || [];
                if (!allItems.length) {
                    document.getElementById("tags").innerHTML =
                        '<span class="text-sub text-sm">暂无标签</span>';
                    return;
                }
                pager.reset();
            })();
        </script>
    </body>
</html>
