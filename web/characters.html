<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="view-transition" content="same-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>角色 | Seshat</title>

        <script src="/assets/theme.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <main class="max-w-[1200px] mx-auto p-6">
            <div
                id="grid"
                class="grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-2"
            ></div>
            <div id="pager" class="mt-6 text-center"></div>
        </main>

        <script src="assets/app.min.js"></script>
        <script>
            var allItems = [];

            // ── 卡片渲染：左侧正方形头像 + 右侧两行（原名/中文名）──
            function renderItem(c) {
                return entityCard("character", c);
            }

            var pager = createPager({
                containerId: "grid",
                unit: "个角色",
                pageSize: 100,
                getItems: function () {
                    return allItems;
                },
                renderItem: renderItem
            });

            (async () => {
                var res = await apiFor("lists", "/v0/characters/list");
                allItems = (res && res.data) || [];
                if (!allItems.length) {
                    document.getElementById("grid").innerHTML =
                        '<div class="col-span-full text-center py-20 text-sub">暂无数据</div>';
                    return;
                }
                pager.reset();
            })();
        </script>
    </body>
</html>
